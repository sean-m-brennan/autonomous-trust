schema_version: "1"
kind: scenario
protocol: negotiation
name: status-poll
byte_pinning: false
description: |
    Long-running task lifecycle. alice invites bob to perform `data_fetch`;
    bob accepts (ack). Some time later alice issues a status_req; bob's
    handle_stat_req finds the task in task_stack and forwards a
    status_resp with status=pending.

    Exercises four message types in one scenario: invitation, ack,
    status request, status response.

participants:
  - id: alice
    role: requestor
  - id: bob
    role: worker

fixtures:
  capabilities:
    bob: [data_fetch]

steps:
  - id: 1
    from: alice
    to: bob
    function: invitation
    payload:
      capability: data_fetch
      task_id: t-poll

  - id: 2
    from: bob
    to: alice
    function: ack
    in_response_to: 1
    payload:
      task_id: t-poll

  - id: 3
    from: alice
    to: bob
    function: status request
    payload:
      capability: data_fetch
      task_id: t-poll

  - id: 4
    from: bob
    to: alice
    function: status response
    in_response_to: 3
    payload:
      task_id: t-poll
      status: pending
