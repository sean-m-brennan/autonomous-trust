schema_version: "1"
kind: scenario
protocol: reputation
name: prior-ignores-told-entries
byte_pinning: false
description: |
    The mined prior skips catch-up-marked entries under the join policy
    (RD_14.4_HOSTILE_JOIN_PLAN.md Phase 4, D4 (b)). bob has never
    transacted with subject. Of the three entries about it, carol's and
    dave's (indices 0 and 1, each 0.9) reached bob by catch-up and are
    marked told; erin's (index 2, 0.6) is not.

    The prior shrinks erin's one observation toward the 0.2 neutral by a
    pseudo-count of 3: (0.6 + 3 x 0.2) / 4 = 0.3. Without the policy all
    three count: (3 x 0.8 + 3 x 0.2) / 6 = 0.5. bob has no own evidence, so
    no brought score, and bounded is told under the tier-1 ceiling.

participants:
  - id: alice
    role: requestor
  - id: bob
    role: oracle
  - id: subject
    role: subject
  - id: carol
    role: member
  - id: dave
    role: member
  - id: erin
    role: member

fixtures:
  join_policy:
    version: 1
    enabled: true
    anchors: [verified_contact]
  tx_history:
    bob:
      - {task_id: t-cs, p1: carol, p1_score: 0.9, p2: subject, p2_score: 0.5}
      - {task_id: t-ds, p1: dave, p1_score: 0.9, p2: subject, p2_score: 0.5}
      - {task_id: t-es, p1: erin, p1_score: 0.6, p2: subject, p2_score: 0.5}
  catchup_told:
    bob: [0, 1]
  reputations:
    bob:
      carol: 0.5
      dave: 0.5
      erin: 0.5

steps:
  - id: 1
    from: alice
    to: bob
    function: request reputation
    payload:
      target: subject
      proc: negotiation
    description: |
        bob scores subject, unrated so far, by contrite tit-for-tat, which
        falls back to the prior.

expected_state:
  bob:
    reputation_of:
      subject: 0.3
    brought_of:
      subject: null
    bounded_of:
      subject: 0.3
