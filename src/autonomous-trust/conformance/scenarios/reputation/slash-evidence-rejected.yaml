schema_version: "1"
kind: scenario
protocol: reputation
name: slash-evidence-rejected
byte_pinning: false
description: |
    Phase 3 — Merkle-evidence-gated slashing, rejection path
    (reputation-vs-blockchain-analysis.md §2.1 / §3).

    Same setup as slash-evidence-verified, but the slash's evidence carries a
    TAMPERED leaf entry_hash (first hex digit flipped), so its inclusion proof
    no longer folds to bob's finalized checkpoint root. bob refuses to apply
    the slash: a peer cannot floor rogue with an accusation that is not
    provably committed under the quorum-agreed checkpoint. rogue's reputation
    stays at its prior 0.6 in both languages — the negative twin of
    slash-evidence-verified.

participants:
  - id: alice
    role: detector
  - id: bob
    role: member
  - id: rogue
    role: target

# The slash protocol is opt-in (R+D.md §12.8): nothing arms it automatically,
# since a poorly scored transaction carries its reason and every peer judges
# for itself. This scenario drives that protocol, so it arms it -- and every
# scenario that does NOT set this is a pin that the default is off.
fixtures:
  slash_enabled: true
  reputations:
    bob:
      rogue: 0.6
  checkpoint:
    bob:
      root: "f9bf077e5bfd8ef4cdf5fb0519b70ec51fb7df536515bf16c594a477ce6d5168"
      epoch: 1
      count: 3

steps:
  - id: 1
    from: alice
    to: bob
    function: slash final
    payload:
      target: rogue
      floor_score: 0.1
      epoch: 9
      evidence:
        task_id: "offending-tx"
        # Tampered: leading 0 -> 1. The proof no longer reproduces the root.
        leaf: "17b59d032e50c07b60566f7a37db00376b53774dd25e892cda3d3941f3fad7b7"
        proof:
          - ["244a27c19915c64129429a834fdb517b1a3f51395d2940a950eb47b88e5c766d", false]
          - ["4f165ec5ff8ed7eb52a08bd0c648f50dd5944a673f6531e635cb637cd47bbad9", false]
        root: "f9bf077e5bfd8ef4cdf5fb0519b70ec51fb7df536515bf16c594a477ce6d5168"
    description: |
        alice broadcasts a slash whose evidence proof does not verify; bob
        rejects it and rogue's reputation is unchanged.

expected_state:
  bob:
    reputation_of:
      rogue: 0.6
