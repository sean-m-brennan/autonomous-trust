schema_version: "1"
kind: scenario
protocol: agreement
name: pot-climbed-leader-outvoted
byte_pinning: false
description: |
    The case RD_13.1 exists for. PoT is a strict majority of the eligible
    voters, so one voter that has climbed to the top tier no longer
    decides alone.

    Setup: five voters, alice at tier 4 (unique top tier), bob and carol
    at tier 2, dave and erin at tier 1. No threshold_tier, so the default
    floor (tier 1) applies and all five are eligible. alice rejects; bob,
    carol and dave approve. 3 of 5 is a majority, so the outcome is true.
    Under the old leader-decides rule it was false.

participants:
  - id: alice
    role: voter
  - id: bob
    role: voter
  - id: carol
    role: voter
  - id: dave
    role: voter
  - id: erin
    role: voter

fixtures:
  impl: trust
  tiers:
    alice: 4
    bob: 2
    carol: 2
    dave: 1
    erin: 1
  myself: erin
  blobs:
    blob-x:
      originator: bob
      payload: "climbed-leader-payload"

steps:
  - id: 1
    from: alice
    to: agreement
    function: vote
    payload:
      blob: blob-x
      approval: false
    description: |
        alice (tier 4, the old "leader") rejects.
  - id: 2
    from: bob
    to: agreement
    function: vote
    payload:
      blob: blob-x
      approval: true
    description: |
        bob (tier 2) approves.
  - id: 3
    from: carol
    to: agreement
    function: vote
    payload:
      blob: blob-x
      approval: true
    description: |
        carol (tier 2) approves.
  - id: 4
    from: dave
    to: agreement
    function: vote
    payload:
      blob: blob-x
      approval: true
    description: |
        dave (tier 1) approves. 3 of 5 eligible.

expected_state:
  agreement:
    blob-x:
      outcome: true
