syntax = "proto3";

package autonomous_trust.core.protobuf.identity;

message Encryptor {
  bytes hex_seed = 1;
}

message Signature {
  bytes hex_seed = 1;
}

message Identity {
  bytes uuid = 1;
  string address = 2;
  string fullname = 3;
  Signature signature = 4;
  Encryptor encryptor = 5;
  bytes zta_credential_hash = 6;   // SHA-256 of ZTA credential at admission
  string zta_issuer = 7;           // Credential issuer identifier
  bytes zta_credential = 8;        // Raw credential for peer verification
  // nickname/petname are Zooko LOCAL names — intentionally never populated by
  // either runtime (identity.c sync_out / identity.py sync_to_message leave
  // them unset, so proto3 omits them). Kept reserved here for field-number
  // stability; do NOT start serializing them.
  string nickname = 9;
  string petname = 10;
  uint32 rank = 11;                // Voter rank for AgreementByAuthority;
                                   // 0 by default, future elevation
                                   // mechanism may bump it.
}

message Group {
  bytes uuid = 1;
  string address = 2;  // Identity UUID to address
  Encryptor encryptor = 3;  // group-shared key
}
