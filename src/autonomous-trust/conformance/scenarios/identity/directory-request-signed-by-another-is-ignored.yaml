schema_version: "1"
kind: scenario
protocol: identity
name: directory-request-signed-by-another-is-ignored
byte_pinning: false
description: |
    The request is well formed and validly signed -- by Mallory -- but arrives
    with Bob on the envelope. What the holder's app would be told ("Bob asks")
    must be what the signature says, so a request whose signer is not its
    sender is dropped before the app ever sees it.

participants:
  - id: alice
    role: border_guard
  - id: bob
    role: new_node
  - id: mallory
    role: new_node

fixtures:
  first_contact:
    enabled: true
  # Strangers, each alone in a cohort: nobody here is a peer of anybody.
  groups:
    alice:
      uuid: "fc000000-0000-4000-8000-0000000d0200"
      size: 1
    bob:
      uuid: "fc000000-0000-4000-8000-0000000d0201"
      size: 1
    mallory:
      uuid: "fc000000-0000-4000-8000-0000000d0202"
      size: 1

steps:
  - id: 1
    from: alice
    to: alice
    function: trigger_directory_publish
    payload:
      handle: alice@example.org
    description: |
        Pseudo-step: Alice's app publishes her handle through the production
        app_directory_publish, with an attestation from the harness issuer.
  - id: 2
    from: bob
    to: alice
    function: first_contact_request
    payload:
      handle: alice@example.org
      nonce: 02c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0
      signer: mallory
    description: |
        Mallory's request, under Bob's envelope.

expected_state:
  alice:
    directory_requests_held: 0
