schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "group-eid-short-hash-refused"
description: |
  A hash under eight bytes forms no group EID.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "group_eid"
    group_hash_hex: "11223344556677"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "group_eid"
    description: "trigger: group_eid"
expected_state:
  host:
    error: true
