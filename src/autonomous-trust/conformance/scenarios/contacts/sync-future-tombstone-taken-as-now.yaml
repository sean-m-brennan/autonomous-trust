schema_version: '1'
kind: scenario
protocol: contacts
name: sync-future-tombstone-taken-as-now
description: A tombstone from the future is dated now.
byte_pinning: false
participants:
- id: host
  role: recipient
fixtures:
  contacts:
    op: sync
    now: 1800000000.0
    store:
      typename: contacts
      version: 1
      contacts: {}
    payload:
      v: 1
      typename: at-contacts-sync
      contacts: {}
      tombstones:
        eeeeeeee-0000-4000-8000-000000000001: 1800086400.0
steps:
- id: 1
  from: host
  to: host
  function: sync
  description: 'trigger: sync'
expected_state:
  host:
    changes:
    - - eeeeeeee-0000-4000-8000-000000000001
      - tombstone
    tombstones:
      eeeeeeee-0000-4000-8000-000000000001: 1800000000.0
