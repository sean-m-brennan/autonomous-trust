schema_version: "1"
kind: scenario
protocol: identity
name: reach-record-expired-is-refused
byte_pinning: false
description: |
    A record past its expiry (here, 1970) is refused however high its sequence:
    a record states where a node is NOW, and an expired one does not.

participants:
  - id: alice
    role: border_guard
  - id: bob
    role: new_node

fixtures:
  first_contact:
    enabled: true
  groups:
    alice:
      uuid: "fc000000-0000-4000-8000-0000000000a6"
      size: 1
    bob:
      uuid: "fc000000-0000-4000-8000-0000000000b6"
      size: 1
  contacts:
    alice:
      rendezvous:
        - relay://198.51.100.1:27790

steps:
  - id: 1
    from: alice
    to: bob
    function: reach_record
    payload:
      seq: 6
      expiry: 1000
      relays:
        - relay://203.0.113.7:27790

    description: |
        An expired record.

expected_state:
  bob:
    contacts:
      alice:
        reach_seq: 0
        rendezvous_head: relay://198.51.100.1:27790

