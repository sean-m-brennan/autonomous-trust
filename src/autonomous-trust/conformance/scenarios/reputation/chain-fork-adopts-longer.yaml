schema_version: "1"
kind: scenario
protocol: reputation
name: chain-fork-adopts-longer
byte_pinning: false
description: |
    The chains fork by ORDER (ISSUES.md §2.15): each node numbers an entry
    when its second half lands, so two nodes can hold different tasks at the same
    index, and a grant needs equal chain lengths, so Paxos stalls once they differ.
    Reconciliation follows the LONGEST VERIFIED CHAIN rule (user decision
    2026-09-23): find the first index where the two differ by entry hash; the peer
    wins only with the higher tip (last index + 1, then the LOWER head hash on a
    tie); nothing inside our finalized checkpoint is rewritten; adopted entries are
    taken verbatim, so agreeing nodes become byte-identical.
    
    dave's own chain is staged through the real writer by the `local_chain`
    fixture, with the payload builder's uuid derivation, so it hash-matches
    alice's report up to the fork.
    
    The peer's chain is LONGER past the fork, so dave adopts it: his entry at
    index 2 (x) is dropped and alice's c and d take its place. The root is
    alice's, which a node that did not adopt verbatim could not reproduce.

participants:
  - id: alice
    role: provider
  - id: dave
    role: consumer

fixtures:
  local_chain:
    dave:
      - {task: a, p1: 0.7, p2: 0.5}
      - {task: b, p1: 0.9, p2: 0.3}
      - {task: x, p1: 0.2, p2: 0.2}

steps:
  - id: 1
    from: alice
    to: dave
    function: latest update
    payload:
      chain:
        - {task: a, p1: 0.7, p2: 0.5}
        - {task: b, p1: 0.9, p2: 0.3}
        - {task: c, p1: 0.6, p2: 0.4}
        - {task: d, p1: 0.8, p2: 0.8}
    description: |
        alice forks from dave at index 2 and is one entry longer.

expected_state:
  dave:
    committed_tx_count: 4
    window_root: "cf6fe5bd4f6e82e56b6d0104f03b8a6143179bb03d3fa1a2f5b740ab0935fcd2"
