- id: at-sybil-collect-001
  name: AT Sybil Attack - Collect Metrics
  description: Collect Sybil attack metrics from AT simulation
  tactic: collection
  technique:
    attack_id: T1005
    name: Data from Local System
  executors:
    - name: sh
      platform: linux
      command: >
        python -m autonomous_trust.evaluation.redteam.caldera_bridge
        --attack sybil --action collect
        --config /tmp/caldera-config/attack-config.json
      timeout: 120
