# time-sync.target, which autonomous-trust.service waits for, now means the
# clock was set by NTP. The Pi has no real-time clock: until timesyncd reaches
# a server it runs from a fixed date set when the image was built, and AT
# would stamp its identity, group and reputation records with that date.
# Bounded, because a node with no router (the ad-hoc cell) has no NTP server
# to reach; after two minutes AT starts anyway, and its own clock check logs
# the clock as unsynced.
[Service]
TimeoutStartSec=120
