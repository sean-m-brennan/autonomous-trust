schema_version: "1"
kind: scenario
protocol: identity
name: group-membership-update-refuse-foreign-public-only
byte_pinning: false
description: |
    A group_key_update advertising a DIFFERENT, larger, PUBLIC-ONLY group MUST
    NOT replace a group whose private key we already hold.

    Companion to group-membership-update-keeps-key (the same-uuid case). Here
    the incoming group has a DIFFERENT uuid and carries only the public key.
    Adopting it would abandon a group we can decrypt (ours, G) for a foreign
    group (H) we cannot — we cannot conjure H's private key from a public-only
    update; that only arrives via a private-bearing full_history. So the
    receiver refuses: it keeps its own uuid, membership, AND private key, and
    waits to converge on a private-bearing update.

    This pins the cross-runtime parity of the refuse branch: Python
    handle_group_update returns a quiet no-op (no echo) in this case, and the C
    twin now mirrors it (previously C adopted the foreign uuid + addresses while
    keeping its own — now wrong — key). Both impls leave the receiver unchanged.

    Topology: peer_a holds group G (uuid 0a..) with the shared PRIVATE key,
    size 1. peer_b advertises a DIFFERENT group H (uuid 0b..), PUBLIC-ONLY,
    size 3 (strictly larger, so the size/tiebreak decision says "adopt" — the
    refuse gate is what overrides it).

    The observable is that peer_a is UNCHANGED: it still owns the private key
    and its group is still size 1 (it did NOT take peer_b's size-3 membership).

participants:
  - id: peer_a
    role: group_member
  - id: peer_b
    role: group_member

fixtures:
  groups:
    peer_a:
      uuid: "0a000000-0000-4000-8000-00000000000a"
      size: 1
    peer_b:
      uuid: "0b000000-0000-4000-8000-00000000000b"
      size: 3
      public_only: true

steps:
  - id: 1
    from: peer_b
    to: peer_a
    function: group_key_update
    payload: {}
    description: |
        peer_b sends its DIFFERENT, public-only, size-3 group H. peer_a's
        size/tiebreak decision would adopt (H is larger), but the refuse gate
        overrides it because H is public-only and peer_a owns G's private key.

expected_state:
  peer_a:
    group_owns_private_key: true
    group_size: 1
