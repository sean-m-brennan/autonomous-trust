schema_version: "1"
kind: scenario
protocol: identity
name: proximity-absent-is-normal
byte_pinning: false
description: |
    The DEFAULT, opted-out case for private proximity (Phase 2). newcomer and bg
    are CONNECTED, but newcomer has NOT opted in to an exact position (no
    fixtures.exact_positions), so its own_exact is None. When newcomer's probe
    is triggered, handle_proximity_trigger finds no own position and emits
    NOTHING — no tags leave the node, bg is never probed, and neither side
    records a band. Opting out is silent and ordinary, not an error (cf.
    position-absent-is-normal, profile-absent-is-normal).

    NON-VACUITY: the load-bearing assertion is newcomer.proximity_probes_emitted
    = 0. The band assertions alone (both UNKNOWN=0) would pass even if the
    feature were broken, because 0 is also the never-probed default; only the
    emission count fails a mutation that drops the opt-out guard (an opted-out
    node probing with an empty/garbage tag set).

    Step 1: newcomer -> bg trigger_proximity_probe (pseudo-step).
      - Both runtimes: handle_proximity_trigger, seeing no own exact position,
        returns without emitting a probe.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

fixtures:
  connections:
    newcomer: [bg]
    bg: [newcomer]
  # No `exact_positions` fixture: newcomer is opted OUT, the default.

steps:
  - id: 1
    from: newcomer
    to: bg
    function: trigger_proximity_probe
    payload: {}
    description: |
        newcomer's probe is triggered, but it opted out of an exact position, so
        nothing is sent and no band is recorded on either side.

expected_state:
  newcomer:
    proximity_probes_emitted: 0
    peer_proximity:
      bg: 0          # UNKNOWN — never probed
  bg:
    proximity_replies_emitted: 0
    peer_proximity:
      newcomer: 0    # UNKNOWN — no probe arrived
