schema_version: "1"
kind: scenario
protocol: reputation
name: transaction-placing-accepted-without-a-grant
byte_pinning: false
description: |
    Ordered placement (doc/architecture/reputation.md, "Agreeing on an
    order"). In a group that places its order a half needs no round of its
    own: where it lands in the chain is decided by placement, so its proposer
    skips `ask permission` and sends the `transaction` at once, naming the
    group and asking to be certified.

    bob never granted this round (no `requests` fixture) and accepts it all
    the same, signing alice's commit_designation. alice's roster is bob alone,
    so his signature and her own acceptance make the group: her half is
    certified and goes to the pool, not the chain.
    Placement-mode twin of commit-cert-acceptor-signs-and-proposer-commits.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor

fixtures:
  ordered_placement: true
  my_requests:
    alice:
      - id1: 1000
        id2: 1
        task_id: t-1
        score: 0.8

steps:
  - id: 1
    from: alice
    to: bob
    function: transaction
    payload:
      id1: 1000
      id2: 1
      proposer: alice
      task_id: t-1
      score: 0.8
      certify: true
      placing: true

  - id: 2
    from: bob
    to: alice
    function: tx accepted
    in_response_to: 1
    payload:
      id1: 1000
      id2: 1
      proposer: alice
      # The C engine rebuilds a propagated message from these keys; Python
      # re-delivers bob's real one.
      task_id: t-1
      score: 0.8
      signed: true

expected_state:
  alice:
    committed_tx_count: 0
    pool_tasks: [t-1]
