schema_version: "1"
kind: scenario
protocol: identity
name: zta-x509-reject-revoked-credential
byte_pinning: false
description: |
    ZTA X.509 admission — revoked credential. The newcomer announces
    drone_alpha.der: a cert that is chain-valid and unexpired (so
    verify_credential returns VERIFIED), but whose serial appears on the
    configured CRL (intermediate-revoked.crl.pem revokes drone_alpha). The
    admission gate must therefore consult check_revocation AFTER a VERIFIED
    chain result and drop the candidate — propose_emitted == 0.

    This is the regression guard for §7.1 caveat 2: previously the gate called
    only verify_credential (chain + expiry) and a valid-but-revoked cert still
    admitted. Both sides now call check_revocation on a VERIFIED result; only an
    affirmative REVOKED blocks (UNAVAILABLE — no CRL configured — still admits,
    so deployments without a revocation source are unchanged).

    Cross-impl: pinned on BOTH sides. The C verifier's CRL path now matches the
    cached cert's serial against the CRL (x509_check_revocation), mirroring
    Python (crl.get_revoked_certificate_by_serial_number); the C and Python
    conformance adapters both resolve crl_path against the corpus root. The C
    side wires the ZTA policy when built with -DAT_ZTA=ON; scripts/
    test-conformance.sh enables that automatically when OpenSSL is present.
    Without OpenSSL the C side skips this scenario, which is still
    non-asymmetric (diff_results.py treats a one-side skip as a match).

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

fixtures:
  zta_policy:
    enabled: true
    require_at_admission: true
    # These fixtures PREDATE the credential->identity binding
    # (doc/architecture/zta-integration.md) and
    # provision none, so `off` keeps each pin testing what it claims: this case is
    # about the chain / operator classification, not about bindings. Without it a
    # reject-* pin would pass for the wrong reason (unbound, not bad chain) and the
    # admit pins would fail outright. Binding behavior is pinned separately by the
    # zta-binding-* scenarios.
    binding_mode: "off"
    verifier_type: x509
    ca_bundle_path: testdata/zta/ca-bundle.pem
    crl_path: testdata/zta/crl/intermediate-revoked.crl.pem
  credentials:
    newcomer: testdata/zta/certs/drone_alpha.der

steps:
  - id: 1
    from: newcomer
    to: broadcast
    function: request_access
    description: |
        newcomer announces a chain-valid but CRL-revoked cert. bg verifies the
        chain (VERIFIED), then check_revocation finds the serial on the CRL
        (REVOKED) and rejects at admission; no propose is emitted.

expected_state:
  bg:
    propose_emitted: 0
