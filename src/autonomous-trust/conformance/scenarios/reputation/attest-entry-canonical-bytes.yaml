schema_version: "1"
kind: scenario
protocol: reputation
name: attest-entry-canonical-bytes
byte_pinning: false
description: |
    A verifier-attested entry hashes identically in both runtimes, and an
    ordinary commit links onto it (doc/architecture/reputation.md,
    "Verifier-attested scores").

    An attested entry is the one one-sided entry the chain admits: the
    verifier occupies p1, p2 is never set, and it commits on a quorum
    certificate rather than on its subject's half. Its canonical bytes extend
    the ordinary form -- the channel block is always present, then
    `|attested|<subject>|<evidence_digest>` -- so no ordinary entry's bytes
    change and the two forms cannot collide (no ordinary entry has p2 unset
    at commit time). The task id is derived, uuid5 over
    verifier|subject|digest, so both adapters reach the same entry from the
    same content.

    The fixture writes the attested entry about carol, then an ordinary
    entry, through the chain's own writers (TransactionHistory.append_attested
    and update / their C twins); the quorum round and the placement that
    normally put them there are pinned by their own scenarios. The ordinary
    entry takes the next index and links to the attested entry's hash. The
    step (`update needed`) leaves bob's chain as it is.

    The pin is bob's `window_root`, over both entries. A divergence anywhere
    in the attested form -- field order, the marker, the subject's spelling,
    the digest, or the forced channel block -- changes the root on one side
    only. `committed-channel-in-the-entry-hash` is the control: the attested
    form did not move its root.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: proposer

fixtures:
  tx_history:
    bob:
      - attested: true
        p1: alice
        p1_score: 0.3
        p1_channel: probe
        subject: carol
        evidence_digest: "abababababababababababababababababababababababababababababababab"
      - task_id: t-1
        p1: carol
        p1_score: 0.9
        p2: alice
        p2_score: 0.8

steps:
  - id: 1
    from: alice
    to: bob
    function: update needed
    payload: {}
    description: |
        A request that leaves bob's chain as it is, so the assertion reads the
        staged entries.

expected_state:
  bob:
    committed_tx_count: 2
    window_root: "458e04b77708afc9ef018077cf1b6ce13926adac132444b9658afe05e68441b1"
