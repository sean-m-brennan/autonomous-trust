schema_version: "1"
kind: scenario
protocol: reputation
name: place-before-genesis-refused
byte_pinning: false
description: |
    Membership recorded in the chain (doc/architecture/reputation.md, "Who is
    in the group"). Until a placing chain holds its genesis roster there is no
    roster to judge an instance by, so nothing but a genesis is accepted: bob
    refuses an ordinary value on his unfounded chain.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: member
  - id: dave
    role: member

fixtures:
  ordered_placement: true
  roster: {}          # an unfounded chain: no roster in force

steps:
  - id: 1
    from: alice
    to: bob
    function: place
    payload:
      k: 0
      ballot: {n: 5, by: alice}
      head: ""
      value:
        - {task_id: t-1, p1: carol, p1_score: 0.9, p2: dave, p2_score: 0.7}
  - id: 2
    from: bob
    to: alice
    function: place accepted
    in_response_to: 1
    expect_none: true
    payload: {}
