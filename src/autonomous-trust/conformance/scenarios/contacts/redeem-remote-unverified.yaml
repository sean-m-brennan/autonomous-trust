schema_version: "1"
kind: "scenario"
protocol: "contacts"
name: "redeem-remote-unverified"
description: |
  A remote signed invitation is redeemed. The signature verifies against the embedded key, but a link over a remote channel is not MITM-proof, so the contact is UNVERIFIED and no trust edge is seeded (FIRST_CONTACT_PLAN.md §4.4).
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  contacts:
    op: "redeem"
    blob: ""
    in_person: false
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "redeem"
    description: "trigger: redeem"
expected_state:
  host:
    verified: false
    provenance: "token"
    trust_seed: 0.0
    uuid: "aaaaaaaa-0000-4000-8000-000000000001"
    nickname: "alice@example"
