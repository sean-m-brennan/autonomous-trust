[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "autonomous_trust_zta"
version = "0.2.1"
description = "AutonomousTrust Zero Trust credential integration: X.509 / OIDC / MFA verifiers, the admission gate, credential binding and re-verification"
authors = ["Sean M Brennan <sean.brennan@tekfive.com>"]
readme = "README.md"
packages = [{include = "autonomous_trust"}]
exclude = ["**/__pycache__"]

[project]
name = "autonomous_trust_zta"
version = "0.2.1"

# How an installed core finds ZTA (autonomous_trust.core.extensions).
[project.entry-points."autonomous_trust.extensions"]
zta = "autonomous_trust.zta._at_extension:EXTENSION"

[tool.poetry.dependencies]
python = "^3.13"
autonomous-trust = ">=0.2.1"
# X.509 verification; parity with the C library's OpenSSL backend (libat_zta).
cryptography = ">=43.0.0"
# The TOTP factor imports it lazily, only when a policy configures one.
pyotp = ">=2.9"
