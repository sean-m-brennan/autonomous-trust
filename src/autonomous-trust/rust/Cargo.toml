[package]
name = "autonomous-trust-zkp"
version = "0.1.0"
edition = "2021"

[lib]
name = "autonomous_trust_zkp"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
rand = "0.9"

# Plonky3 STARK proving system
p3-air = "0.4.2"
p3-baby-bear = "0.4.2"
p3-challenger = "0.4.2"
p3-commit = "0.4.2"
p3-dft = "0.4.2"
p3-field = "0.4.2"
p3-fri = "0.4.2"
p3-matrix = "0.4.2"
p3-merkle-tree = "0.4.2"
p3-poseidon2 = "0.4.2"
p3-symmetric = "0.4.2"
p3-uni-stark = "0.4.2"

[profile.release]
opt-level = 3
lto = true
