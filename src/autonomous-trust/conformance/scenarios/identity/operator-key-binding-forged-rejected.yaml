schema_version: "1"
kind: scenario
protocol: identity
name: operator-key-binding-forged-rejected
byte_pinning: false
description: |
    NEGATIVE CONTROL: a guardian key whose binding was signed by somebody else.
    Everything else is identical to operator-key-bound-verified — same operator
    credential, same operator-class classification, same pre-image, same
    algorithm and key size — so the ONE difference is who held the private key
    (impostor_leaf.key, which chains to nothing).

    The key is refused and the peer is stored with no guardian. `operator_bound`
    stays TRUE, deliberately: it was earned independently by verifying the
    credential against the operator anchor, and demoting it here would turn an
    honest node whose operator key rotated into a node that lost its credential.
    Losing a guardian edge is the failure mode; losing admission is not.

    This is the case that makes a guardian count mean something. Without it a
    node could name any human it liked.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

fixtures:
  zta_policy:
    enabled: true
    require_at_admission: true
    # These fixtures PREDATE the credential->identity binding (ISSUES §1.5) and
    # provision none, so `off` keeps each pin testing what it claims: this case is
    # about the chain / operator classification, not about bindings. Without it a
    # reject-* pin would pass for the wrong reason (unbound, not bad chain) and the
    # admit pins would fail outright. Binding behavior is pinned separately by the
    # zta-binding-* scenarios.
    binding_mode: "off"
    verifier_type: x509
    ca_bundle_path: testdata/zta/operator-ca-bundle.pem
    operator_ca_bundle_path: testdata/zta/operator-ca-bundle.pem
  credentials:
    newcomer: testdata/zta/certs/operator_leaf.der
  operator_bindings:
    newcomer: forged

steps:
  - id: 1
    from: newcomer
    to: broadcast
    function: request_access
    description: |
        newcomer announces with an operator credential AND an advertised
        guardian key. bg's welcoming_committee verifies the chain, classifies
        the credential operator-class, then checks the binding.
  - id: 2
    from: bg
    to: broadcast
    function: propose_peer
    in_response_to: 1
    description: bg proposes the candidate to the group.
  - id: 3
    from: bg
    to: broadcast
    function: peer_accepted
    in_response_to: 1
    description: |
        After synchronous vote finalization, _peer_accepted stores the newcomer
        with whatever the gate concluded about its guardian.
  - id: 4
    from: bg
    to: newcomer
    function: access_granted
    in_response_to: 1
    description: bg sends its published identity to the newcomer.
  - id: 5
    from: bg
    to: newcomer
    function: full_history
    in_response_to: 1
    description: bg sends the group key + history DAG.

expected_state:
  bg:
    operator_bound:
      newcomer: true
    operator_guardian:
      newcomer: false
