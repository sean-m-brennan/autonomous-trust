schema_version: '1'
kind: scenario
protocol: identity
name: area-accept-by-the-app-answers-the-request
byte_pinning: false
description: Alice's app accepts a request that came via her area; her node answers with a single-use invitation, as for a request by handle.
participants:
- id: alice
  role: border_guard
- id: bob
  role: new_node
fixtures:
  first_contact:
    enabled: true
  groups:
    alice:
      uuid: fc000000-0000-4000-8000-0000000e0400
      size: 1
    bob:
      uuid: fc000000-0000-4000-8000-0000000e0401
      size: 1
steps:
- id: 1
  from: alice
  to: alice
  function: trigger_area_publish
  payload:
    area: u4pr
    bucket: u4pru
  description: 'Pseudo-step: Alice''s app lists her in u4pr through the production app_area_publish.'
- id: 2
  from: bob
  to: alice
  function: first_contact_request
  payload:
    area: u4pr
    nonce: 0e04c0c0c0c0c0c0c0c0c0c0c0c0c0c0
  description: 'Bob found Alice''s card at a hub and asks, signed by his own key, naming the area. Plaintext: neither is a peer of the other yet.'
- id: 3
  from: alice
  to: alice
  function: trigger_directory_accept
  payload:
    ref: 0e04c0c0c0c0c0c0c0c0c0c0c0c0c0c0
  description: 'Pseudo-step: Alice''s app accepts, naming the request by its nonce.'
expected_state:
  alice:
    directory_requests_held: 0
    directory_accepts_emitted: 1
