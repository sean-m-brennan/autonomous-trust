schema_version: "1"
kind: scenario
protocol: negotiation
name: invite-group-member-unverified-contact-uses-earned-tier
byte_pinning: false
description: |
    A member of Bob's OWN group is never capped, even while on record as an
    unverified contact: its own group's vote admitted it. Contrast the child-group
    case, where the same record holds the member at tier 1 -- the difference
    between the two groups is the whole of the rule.

participants:
  - id: alice
    role: requestor
  - id: bob
    role: worker

fixtures:
  first_contact:
    enabled: true
  group_members:
    bob: [alice]
  unverified_contacts:
    bob: [alice]
  capabilities:
    bob: [chat, file_share]
  capability_tiers:
    chat: 1
    file_share: 2
  peer_tiers:
    alice: 4

steps:
  - id: 1
    from: alice
    to: bob
    function: invitation
    payload:
      capability: file_share
      task_id: t-gmu-share
  - id: 2
    from: bob
    to: alice
    function: ack
    in_response_to: 1
    payload:
      task_id: t-gmu-share
