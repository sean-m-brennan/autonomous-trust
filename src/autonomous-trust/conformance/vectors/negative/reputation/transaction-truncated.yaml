schema_version: "1"
kind: negative
protocol: reputation
name: transaction-truncated
description: |
    Truncate alice's reputation `transaction` proposal wire buffer mid-
    JSON. The parser must refuse the input — no half-decoded
    Message ever reaches handle_transaction. Companion to
    identity/request-access-truncated; truncation index also 64
    bytes, well before the JSON envelope is complete.

based_on: scenarios/reputation/transaction-accepted.yaml

mutation:
  step_id: 1
  op: truncate
  target: wire_bytes
  index: 64

expected:
  reason_class: envelope_truncated
