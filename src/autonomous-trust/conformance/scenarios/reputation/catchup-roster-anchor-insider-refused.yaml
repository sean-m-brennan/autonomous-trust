schema_version: "1"
kind: scenario
protocol: reputation
name: catchup-roster-anchor-insider-refused
byte_pinning: false
description: |
    Membership recorded in the chain (doc/architecture/reputation.md, "Who is
    in the group"). The same history, but the add of bob is signed by alice
    alone: one of the three members before it is no majority. A history one
    insider could write alone is not one bob adopts.

participants:
  - id: alice
    role: provider
  - id: bob
    role: consumer
  - id: carol
    role: member
  - id: dave
    role: member

fixtures:
  roster: {}          # an unfounded chain: no roster in force

steps:
  - id: 1
    from: alice
    to: bob
    function: latest update
    payload:
      chain:
        - {roster: genesis, members: [alice, carol, dave], placed_by: [alice, carol, dave]}
        - {task: a, p1: 0.7, p2: 0.5, batch: 1, placed_by: [alice, carol], certified_by: [alice, carol, dave]}
        - {roster: add, member: bob, placed_by: [alice]}

expected_state:
  bob:
    committed_tx_count: 0
