schema_version: "1"
kind: scenario
protocol: identity
name: cosign-ask-unknown-act-refused
byte_pinning: false
description: |
    The control for cosign-ask-delivered (Phase 3 P3.3): the same ask, for an act
    that is NOT exchanged. A voluntary departure is self-signed by the one person
    leaving — there is nobody to collect signatures from — so "membership/depart"
    names no exchange this build understands, and the runtime refuses it rather
    than interrupting somebody to look at it.

    The refusal is deliberately in the CORE, not only app-side: an unknown act
    cannot become a record anywhere downstream, and the app should not have to
    tell a hostile ask from a truncated one.

    Step 1: bg -> newcomer peer_cosign_request {record: membership, op: depart}.
      - Both runtimes: the shape gate refuses; nothing is recorded and nothing is
        surfaced.

    Assertion: newcomer.cosign_request_last[bg] is ABSENT. Paired with
    cosign-ask-delivered, which is byte-for-byte this scenario with op=admit and
    records the ask.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_cosign_request
    payload:
      record: membership
      op: depart
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      cid: "b3:7d3f1c9a2b4e6f80112233445566778899aabbccddeeff00123456789abcdef0"
      bytes: "a3011a0066"
      seq: 1
      ts: 0
    description: |
        An ask to co-sign a departure — an act that is never exchanged, because
        the person leaving signs it alone.

expected_state:
  newcomer:
    cosign_request_last:
      bg:
        absent: true
