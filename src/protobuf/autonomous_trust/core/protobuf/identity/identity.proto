syntax = "proto3";

package autonomous_trust.core.protobuf.identity;

message Encryptor {
  bytes hex_seed = 1;
}

message Signature {
  bytes hex_seed = 1;
}

message Identity {
  bytes uuid = 1;
  string address = 2;
  // Zooko ONLINE name (global, human-meaningful, not unique). This is the only
  // name carried on the wire (was `fullname`).
  string nickname = 3;
  Signature signature = 4;
  Encryptor encryptor = 5;
  bytes zta_credential_hash = 6;   // SHA-256 of ZTA credential at admission
  string zta_issuer = 7;           // Credential issuer identifier
  bytes zta_credential = 8;        // Raw credential for peer verification
  // Field 9 previously held a LOCAL nickname; removed. Reserved so the field
  // number is never reused.
  reserved 9;
  // petname is a Zooko LOCAL name — intentionally never populated on the wire
  // (identity.c sync_out / identity.py sync_to_message leave it unset, so
  // proto3 omits it). A receiver assigns its own petname locally.
  string petname = 10;
  uint32 rank = 11;                // Voter rank for AgreementByAuthority;
                                   // 0 by default, future elevation
                                   // mechanism may bump it.
  // Operator-attended signal (ethne guardian edge, D8). Advertises whether a
  // node has a human behind it. operator_bound is durable ("has a human
  // guardian", backed by the ZTA operator credential the receiver verifies);
  // operator_attested_at is a live freshness stamp (epoch seconds of the last
  // verified operator session; 0 = none) from which peers derive attended-now.
  // Like the zta_* fields, these are NOT part of identity equality (rotation
  // and attestation must not change identity). See
  // lib/muudd/lib/ethne/doc/design.md D8/Q9.
  bool operator_bound = 12;        // durable: node has a human guardian
  double operator_attested_at = 13;  // live: epoch secs of last operator session
}

message Group {
  bytes uuid = 1;
  string address = 2;  // Legacy single address (first of address_map); kept so
                       // an older peer that only reads this field still works.
  Encryptor encryptor = 3;  // group-shared key
  // Full UUID->address membership map (§1.4). Mirrors Python Group._address_map
  // and C group_t.address_map; the single `address` above is just its first
  // value. Proto3 map — absent on read decodes to an empty map, so an older
  // peer that only sends `address` stays compatible.
  map<string, string> address_map = 4;
  // Group age for the merge size-tie tiebreaker (§3.1-b): epoch seconds, or 0
  // when unknown. Mirrors the canonical JSON `created`.
  double created = 5;
}
