---
services:
  ctlptl-registry:
    image: registry:2
    ports:
      - "${REGISTRY_PORT:-5100}:5000"
    container_name: ctlptl-registry
    environment:
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/data
    restart: unless-stopped
    volumes:
      # $REGISTRY_DISK/data when REGISTRY_DISK is set (see
      # scripts/local-registry.sh), else ./data beside this file.
      - ${REGISTRY_DISK:-.}/data:/data
