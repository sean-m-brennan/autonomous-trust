schema_version: '1'
kind: scenario
protocol: contacts
name: backup-restore-a-later-re-add-beats-the-tombstone
description: A contact added again here after the removal in the backup is newer and stays.
byte_pinning: false
participants:
- id: host
  role: recipient
fixtures:
  contacts:
    op: backup
    mode: restore
    now: 1800000000.0
    store:
      typename: contacts
      version: 1
      contacts:
        eeeeeeee-0000-4000-8000-000000000002:
          identity:
            typename: identity
            uuid: eeeeeeee-0000-4000-8000-000000000002
            address: ''
            nickname: carol
            signature:
              hex_seed: f6542eca1f7b405afcc4df4ed28884c339a1adff7e51275c122deb7c8f586827
            encryptor:
              hex_seed: '7777777777777777777777777777777777777777777777777777777777777777'
          petname: carol-pet
          verified: false
          provenance: in_person
          trust_seed: 0.0
          rendezvous: []
          nonce: ''
          added_at: 6000.0
          verified_at: 0.0
    contents:
      typename: at-backup-contents
      v: 1
      created_at: 1700000000.0
      contacts:
        v: 1
        typename: at-contacts-sync
        contacts: {}
        tombstones:
          eeeeeeee-0000-4000-8000-000000000002: 5000.0
steps:
- id: 1
  from: host
  to: host
  function: backup
  description: 'trigger: backup restore'
expected_state:
  host:
    backup_status: ok
    changes: []
    contacts:
      eeeeeeee-0000-4000-8000-000000000002:
        petname: carol-pet
