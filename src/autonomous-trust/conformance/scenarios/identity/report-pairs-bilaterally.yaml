schema_version: "1"
kind: scenario
protocol: identity
name: report-pairs-bilaterally
byte_pinning: false
description: |
    A report's two halves land on ONE task (Agora Phase 4 P4.1).

    Reputation here commits only when both parties stage a score for the same
    task, and the task is never transmitted — each side derives it from
    ("agora-report", the two uuids in canonical order, reporter_uuid || seq).
    If the reporter and the reported node disagree about a single byte of that,
    both halves sit in the chain forever and the report costs nobody anything.
    `same_task_as` is the pin: the seq is the reporter's freshness stamp, chosen
    at run time, so no literal task can be written here and equality is the only
    honest assertion.

    The reported node's half is SOCIAL_REPORTER_SCORE (0.65, the social
    baseline) about the REPORTER, on the default channel. A bilateral
    transaction moves each party by the other's score, so the reported node's
    half is unavoidably a score about the person who reported — the baseline
    means a report neither punishes nor rewards them. Not `first_person`: it is
    not the reported node's account of anything.

    The reported node tells its app nothing; that is not observable here and is
    pinned in src/c/test/report_test.c.

    Requires CONFORMANCE_SOCIAL=1, or the C side skips and diff_results scores
    a one-side skip as a match.

participants:
  - id: node
    role: border_guard
  - id: alice
    role: group_member

steps:
  - id: 1
    from: node
    to: node
    function: trigger_report
    payload:
      peer: alice
    description: |
        node reports alice; the peer_report reaches alice's real handler.

expected_state:
  node:
    social_tx_last:
      alice:
        score: 0.15
        channel: first_person
        same_task_as:
          participant: alice
          subject: node
  alice:
    social_tx_last:
      node:
        score: 0.65
        channel: task_outcome
        n: 1
