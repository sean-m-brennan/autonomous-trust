schema_version: "1"
kind: scenario
protocol: reputation
name: chain-outdated-notification
byte_pinning: false
description: |
    Exercises the `update needed` (ReputationProtocol.outdated) handler: the
    path a peer takes when another asks for its chain. handle_outdated answers
    with a `latest update` carrying its WHOLE resident window, whatever length
    the requester reports. Python used to send only `history.era(length)`,
    which is empty for a requester as long as we are -- exactly the requester
    on an equal-length fork, who then never reconciled (ISSUES §2.51). C always
    sent the whole window.

    Cross-language note: Python's adapter builds the inbound as `str(length)`
    (raw decimal string); C's adapter builds an empty JSON object `{}`. The
    conformance value here is no-crash equivalence on the handler entry point.

participants:
  - id: alice
    role: requestor
  - id: bob
    role: holder

steps:
  - id: 1
    from: alice
    to: bob
    function: update needed
    payload:
      length: 0
    description: |
        alice notifies bob its history is short (length=0). bob's
        handle_outdated slices history.era(0) and emits a `latest
        update` back to alice with the chain.
