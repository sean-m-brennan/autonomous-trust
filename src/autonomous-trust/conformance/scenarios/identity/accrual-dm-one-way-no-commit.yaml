schema_version: "1"
kind: scenario
protocol: identity
name: accrual-dm-one-way-no-commit
byte_pinning: false
description: |
    A one-way DM does NOT accrue (Increment 8). Unlike a connection, a single DM is
    one-directional, so accrual is gated on BOTH directions being seen inside the
    recency window (the "sustained exchange" rule) — and, at the transaction layer,
    a lone submission never fills the second slot and never commits. Here bg sends
    newcomer a DM but newcomer has sent bg nothing, so newcomer stamps inbound
    recency but stages NO score. This is the anti-gaming guard: an unrequited DM
    blast cannot manufacture reputation.

    Step 1: bg -> newcomer peer_dm {text, seq:1}
      - Both runtimes: newcomer records the DM but stages no accrual (no reverse
        direction), so social_tx_last[bg] is ABSENT.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_dm
    payload:
      text: hello there
      seq: 1
    description: bg's one-way DM; newcomer records it but does not accrue.

expected_state:
  newcomer:
    dm_last:
      bg:
        seq: 1
        text: hello there
    social_tx_last:
      bg:
        absent: true
