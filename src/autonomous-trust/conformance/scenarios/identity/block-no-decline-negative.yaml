schema_version: "1"
kind: scenario
protocol: identity
name: block-no-decline-negative
byte_pinning: false
description: |
    A blocked peer's decline costs them nothing (Phase 4 P4.1).

    This is the one gate that needed its own placement. The decline branch of
    _social_accrue_connection BYPASSES _social_accrue entirely and stages
    SOCIAL_NEG_SCORE (0.30) unconditionally — accrual-decline-negative pins
    that for an ordinary decline. So the root gate that covers every POSITIVE
    path would have missed this one, and a blocked peer declining us would
    still have cost them 0.30.

    A block must not become a way to spend a peer's standing. It is
    deliberately silent and deliberately free: nothing crosses the wire, so the
    blocked peer cannot even know. A mechanism invisible to its subject must
    not also be able to move their reputation. And the submission could never
    pair anyway — the other side has no reason to stage its half — so it would
    only manufacture a permanent half-entry in the chain, which is the defect
    the 2026-09-21 cohort caught on the reaction path.

    bob is the control, declining in the same run: his 0.30 must still stage,
    or a change that simply stopped staging declines would pass. The two peers
    differ by the block alone.

    Requires CONFORMANCE_SOCIAL=1, or the C side skips and diff_results scores
    a one-side skip as a match.

participants:
  - id: node
    role: border_guard
  - id: alice
    role: group_member
  - id: bob
    role: group_member

steps:
  - id: 1
    from: node
    to: node
    function: trigger_block
    payload:
      peer: alice
    description: node locally blocks alice. Nothing on the wire.
  - id: 2
    from: alice
    to: node
    function: peer_connection_response
    payload:
      accept: false
      seq: 1
    description: |
        alice's signed decline reaches node. Node records the edge as declined
        but must stage NOTHING about alice — before P4.1 this cost her 0.30 on
        both runtimes.
  - id: 3
    from: bob
    to: node
    function: peer_connection_response
    payload:
      accept: false
      seq: 1
    description: |
        The control. bob is not blocked, so his decline stages the ordinary
        0.30 negative about him.

expected_state:
  node:
    social_tx_last:
      alice:
        absent: true
      bob:
        score: 0.3
