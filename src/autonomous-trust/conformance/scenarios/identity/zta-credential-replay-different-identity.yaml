schema_version: "1"
kind: scenario
protocol: identity
name: zta-credential-replay-different-identity
byte_pinning: false
description: |
    A credential is a ONE-PER-IDENTITY binding, and this pins it.

    The border guard holds credential X. A newcomer announces the SAME credential
    X under its own uuid and signing key — which is exactly what an attacker gets
    by lifting a certificate out of a peer's clear-text announce. The chain still
    verifies; the credential is genuine; it simply belongs to somebody else. The
    gate refuses before chain verification, because the point is not that the
    certificate is bad but that it is already bound elsewhere.

    Fingerprints are recomputed from the credential bytes that actually arrived,
    never from the peer-advertised `zta_credential_hash` — an announcer controls
    that field, so trusting it would let the attacker simply claim a different
    fingerprint and walk through.

    This is the FIRST-USE-WINS check, and it is deliberately kept even though the
    binding (zta-binding-*) supersedes it for any credential that carries one: it
    is the only defence left for an unbound credential under `binding_mode`
    prefer or off, which is precisely the state a fleet mid-migration is in. This
    scenario runs with `off` so it exercises that residual path rather than being
    short-circuited by the binding gate.

    Cross-impl: pinned on BOTH sides, ZTA-gated. Both adapters put the credential
    on the participant's own identity as well as its published copy, so each side
    can recognize its own certificate.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

fixtures:
  zta_policy:
    enabled: true
    require_at_admission: true
    binding_mode: "off"
    verifier_type: x509
    ca_bundle_path: testdata/zta/operator-ca-bundle.pem
  credentials:
    bg: testdata/zta/certs/operator_leaf.der
    newcomer: testdata/zta/certs/operator_leaf.der

steps:
  - id: 1
    from: newcomer
    to: broadcast
    function: request_access
    description: |
        newcomer announces bg's own credential under a different identity. bg
        recognizes it as already bound and does NOT propose.

expected_state:
  bg:
    propose_emitted: 0
