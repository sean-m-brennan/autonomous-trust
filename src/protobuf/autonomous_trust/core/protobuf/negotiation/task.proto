syntax = "proto3";

package autonomous_trust.core.protobuf.negotiation;

message Task {
  bytes uuid = 1;
  bytes requestor_uuid = 2;
  string capability_name = 3;
  int64 when_seconds = 4;
  int32 when_nanos = 5;
  sint64 duration_days = 6;
  uint32 duration_seconds = 7;
  uint32 duration_nsecs = 8;
  int64 timeout = 9;
  bool flexible = 10;
  int32 argc = 11;
  // Freshness sequence: the requestor's monotonic per-process counter, stamped
  // on every invitation it emits (see core/freshness.py and
  // utilities/freshness.h). The receiver keeps a per-(sender, verb) high-water
  // mark and refuses anything at or below it.
  //
  // An invitation is command-carrying -- it asks a peer to run work -- and
  // carried no freshness token of its own, so a captured one could be
  // re-presented, or presented to a DIFFERENT capable peer than it was signed
  // for, and be executed. See doc/architecture/security-hardening.md,
  // "Replay resistance, per verb".
  //
  // Appended as field 12 so every existing field keeps its number and wire
  // type; a peer that has not been rebuilt simply omits it, and an omitted
  // sequence reads as 0, which the receiver refuses (sequences start at 1).
  int64 seq = 12;
  // The invocation's keyword arguments, as a compact JSON object ("" for
  // none). C twin of Python TaskParameters.kwargs; see task_t::kwargs_json.
  //
  // A JSON string rather than a map<string, ...> field because the values are
  // heterogeneous (an integer nonce, a string echo token) and the C side
  // hands the whole blob to the capability's executor without interpreting
  // it. Only the C runtime uses this schema -- it is C's IPC encoding for a
  // task (utilities/msg_types.c), and Python serializes a Task as a
  // Configuration JSON dump -- so the shape follows what C needs to carry.
  //
  // Appended as field 13 for the same reason `seq` was appended as 12: every
  // existing field keeps its number and wire type, and an omitted field
  // unpacks as the empty string, which reads as "no keyword arguments".
  string kwargs_json = 13;
}
