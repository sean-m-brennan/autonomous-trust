schema_version: "1"
kind: scenario
protocol: identity
name: directory-accept-with-an-expired-invitation-is-ignored
byte_pinning: false
description: |
    Alice's accept answers Bob's request with her own invitation, already
    expired. No hello is sent.

participants:
  - id: alice
    role: border_guard
  - id: bob
    role: new_node

fixtures:
  first_contact:
    enabled: true
  # Strangers, each alone in a cohort: nobody here is a peer of anybody.
  groups:
    alice:
      uuid: "fc000000-0000-4000-8000-0000000d0d00"
      size: 1
    bob:
      uuid: "fc000000-0000-4000-8000-0000000d0d01"
      size: 1

steps:
  - id: 1
    from: bob
    to: bob
    function: trigger_directory_request
    payload:
      holder: alice
      handle: alice@example.org
    description: |
        Pseudo-step: a lookup finds Alice's entry (a local dir_result) and Bob's
        app asks her, through the production app_first_contact_request. Bob now
        has a request outstanding to her, under her entry's key.
  - id: 2
    from: alice
    to: bob
    function: first_contact_accept
    payload:
      minted_by: alice
      expired: true
    description: |
        Alice's accept for Bob's request, with an invitation that has expired.

expected_state:
  bob:
    first_contact_hellos_emitted: 0
