schema_version: "1"
kind: scenario
protocol: reputation
name: attest-scope-other-channel-admitted
byte_pinning: false
description: |
    The cap is per channel within a scope.

    bob's chain holds alice's `probe` finding about carol in scope A. A
    `certificate` finding in the same scope is a different check of the same
    thing (Stele: an SBOM check of the commit the CVE scan covered), so it is
    under the cap and bob signs.

participants:
  - id: alice
    role: verifier
  - id: bob
    role: member
  - id: carol
    role: subject

fixtures:
  reputations:
    bob:
      alice: 0.7
  tx_history:
    bob:
      - attested: true
        p1: alice
        p1_score: 0.3
        p1_channel: probe
        subject: carol
        evidence_digest: "cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd"
        attest_scope: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

steps:
  - id: 1
    from: alice
    to: bob
    function: attest propose
    payload:
      subject: carol
      score: 0.8
      channel: certificate
      scope: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    description: alice attests a certificate finding in scope A.

expected_state:
  bob:
    attest_signs_sent: 1
