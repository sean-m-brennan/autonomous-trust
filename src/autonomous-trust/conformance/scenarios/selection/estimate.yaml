schema_version: '1'
kind: scenario
protocol: selection
name: estimate
byte_pinning: false
description: |
  The doubly robust estimator over the decision log (RD_12.7 plan section
  3.7, D8(b)), a diagnostic only (D7(a)).

  Six probes at floor 0.1 build the reward model: each peer's mean probe
  outcome, shrunk toward the mean over all probes by two pseudo-observations.
  Five ordinary tasks of q follow. Four are scored and one is declined, and a
  decline contributes only the model term. The estimate pins, per capability,
  the decisions with an outcome, the outcomes, and the value of the logged,
  uniform and greedy policies, each
  sum_i pi_i (rhat_i + [observed_i / mu_i](r_i - rhat_i)) / sum_i pi_i averaged
  over decisions, and the logged policy's regret against the other two. An
  outcome for a peer no decision selected is not recorded.
participants:
- {id: requestor, role: requestor}
- {id: peer, role: peer}
