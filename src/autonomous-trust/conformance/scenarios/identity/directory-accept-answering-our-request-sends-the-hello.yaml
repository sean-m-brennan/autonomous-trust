schema_version: "1"
kind: scenario
protocol: identity
name: directory-accept-answering-our-request-sends-the-hello
byte_pinning: false
description: |
    The holder's accept answers the request Bob has outstanding to her: same
    uuid, the key her entry named, the request's nonce, and an unexpired
    invitation she minted herself. Bob's node redeems it with the ordinary
    hello -- exactly one.

participants:
  - id: alice
    role: border_guard
  - id: bob
    role: new_node

fixtures:
  first_contact:
    enabled: true
  # Strangers, each alone in a cohort: nobody here is a peer of anybody.
  groups:
    alice:
      uuid: "fc000000-0000-4000-8000-0000000d0900"
      size: 1
    bob:
      uuid: "fc000000-0000-4000-8000-0000000d0901"
      size: 1

steps:
  - id: 1
    from: bob
    to: bob
    function: trigger_directory_request
    payload:
      holder: alice
      handle: alice@example.org
    description: |
        Pseudo-step: a lookup finds Alice's entry (a local dir_result) and Bob's
        app asks her, through the production app_first_contact_request. Bob now
        has a request outstanding to her, under her entry's key.
  - id: 2
    from: alice
    to: bob
    function: first_contact_accept
    payload:
      minted_by: alice
    description: |
        Alice's answer, with the nonce of Bob's outstanding request and her own
        invitation.

expected_state:
  bob:
    first_contact_hellos_emitted: 1
