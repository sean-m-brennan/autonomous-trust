schema_version: "1"
kind: scenario
protocol: reputation
name: chain-fork-dropped-task-already-adopted-not-reproposed
byte_pinning: false
description: |
    A dropped entry is re-proposed only when the adopted chain does not already
    carry its task (Agora Phase 4 DDIL). Here alice's winning chain holds x too,
    one index later, so re-proposing it would count the same transaction twice.

    dave's x (his own half) is dropped at the fork and loaded back from alice's
    chain at index 3. dave has no round of his own under way.

participants:
  - id: alice
    role: provider
  - id: dave
    role: consumer

fixtures:
  local_chain:
    dave:
      - {task: a, p1: 0.7, p2: 0.5}
      - {task: b, p1: 0.9, p2: 0.3}
      - {task: x, p1_id: dave, p1: 0.2, p2: 0.4}

steps:
  - id: 1
    from: alice
    to: dave
    function: latest update
    payload:
      chain:
        - {task: a, p1: 0.7, p2: 0.5}
        - {task: b, p1: 0.9, p2: 0.3}
        - {task: c, p1: 0.6, p2: 0.4}
        - {task: x, p1_id: dave, p1: 0.2, p2: 0.4}
    description: |
        alice forks at index 2 and carries dave's x at index 3.

expected_state:
  dave:
    committed_tx_count: 4
    proposed_tasks: {}
