schema_version: "1"
kind: scenario
protocol: reputation
name: committed-channel-in-the-entry-hash
byte_pinning: false
description: |
    The evidence channel is part of the COMMITTED FACT, and both runtimes
    hash it identically (R+D.md §12.8, doc/verification_oracle.md "Keep the
    channels separate").

    This is the cross-language half of §12.8's second response. A
    transaction score says how well a peer did; the channel says how we
    know. The reason has to survive to every acceptor, because the response
    to a poor score is that every peer sees it WITH ITS REASON and judges
    for itself -- there is no accusation mechanism and no adjudicator, by
    the user's decision (2026-09-02), so a reason that stopped at the chain
    boundary would leave nothing to judge on. Before this it did stop
    there: the `committed` broadcast carried a bare score, and every
    acceptor's persisted history kept the number and dropped the reason.

    Two `tx committed` broadcasts complete one bilateral entry in carol's
    history, one of them tagged `physical`. The pin is carol's
    `window_root` -- the ordered RFC 6962 Merkle root over her committed
    window, which is what a checkpoint is quorum-signed over. It is
    therefore the strongest available statement of this slice's contract:

      - the channel reached the entry (a dropped channel changes the root);
      - Python and C serialize it into the canonical bytes identically (a
        divergence in field order, spelling or the default's treatment
        changes the root on one side only);
      - the conditional rule holds -- see the sibling assertion below.

    The conditional rule is the reason this is not a chain migration.
    `|p1_channel|p2_channel` is appended to the canonical bytes only when at
    least one side carries a channel other than `task_outcome`. Absence and
    an explicit `task_outcome` are the same claim, so they are the same
    bytes; every entry committed before this field keeps its hash; and every
    byte-pinned vector in this corpus stays valid. What the rule does NOT
    excuse is stripping: removing a real channel drops the block, changes
    the bytes, and breaks both the chain link and the window root.

    The untagged control is `chain-catchup-verifies-links`: its pinned
    `window_root` is over entries with no channel, and this slice did not
    move it. That is the evidence the conditional append holds -- had the
    block been appended unconditionally, that pin (and every other stored
    root in this corpus) would have had to be re-cut.

    Cross-language wiring:
      - Python: `handle_committed` unpacks element 5 length-tolerantly,
        validates it with `validate_tx_channel` (dropping the whole commit
        on an unknown spelling -- accepting one would fork this node's entry
        hash), and passes it to `TransactionHistory.update`.
      - C: `handle_committed` reads the top-level `channel` key, checks it
        with `tx_channel_valid`, and passes it to `tx_history_update`, which
        refuses an unknown spelling with EINVAL.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: proposer

fixtures:
  # alice's side of task t-1, staged UNTAGGED (an ordinary task outcome, what
  # every producer predating channels meant). Staged rather than delivered as
  # a first step because the C harness resets state between steps, so only the
  # step that COMPLETES the entry can be asserted on -- see
  # reputation_install_tx_single.
  tx_history:
    bob:
      - task_id: t-1
        p1: carol
        p1_score: 0.9

steps:
  - id: 1
    from: alice
    to: bob
    function: tx committed
    payload:
      task_id: t-1
      score: 0.2
      channel: physical
    description: |
        The commit that completes task t-1, refuted on physics. Filling the
        second slot promotes the entry to committed -- index assigned,
        prev_hash linked, entry hash rolled into the window root -- and it is
        that promotion which makes the channel part of a hash both runtimes
        must agree on.

        (A Transaction is intrinsically two-party, so the staged side has to
        name a different peer than the sender -- hence carol. Who the
        counterparty is does not matter here; staging one side is what buys
        the single-step assertion.)

expected_state:
  bob:
    # The bilateral entry exists (a dropped commit would leave 0)...
    committed_tx_count: 1
    # ...and both runtimes hash its channel into the same root.
    window_root: "d2900d8d9ed3fcf3a1750238bb572fbb7792bef07fd997d256cc313831225cb1"
