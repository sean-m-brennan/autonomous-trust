schema_version: "1"
kind: scenario
protocol: identity
name: identity-response-unsigned-refused
byte_pinning: false
description: |
    An identity response carries the identity its receiver adds to its peer
    set, so it must be signed by that identity (RD_2.6 plan §2.5, the user's
    call 2026-10-21). Before, it was sent unsigned and the only gate was that
    the advertised address sat in the group's address map, which anyone on the
    segment can claim. The twin of identity-resync-backfill: the same response,
    unsigned, backfills nothing.

participants:
  - id: coord
    role: group_member
  - id: member
    role: group_member

fixtures:
  shared_group:
    uuid: "0c000000-0000-4000-8000-000000000003"

steps:
  - id: 1
    from: member
    to: coord
    function: peer_identity_response
    payload:
      unsigned: true

expected_state:
  coord:
    peer_count: 0
