schema_version: "1"
kind: scenario
protocol: reputation
name: chain-catchup-default-quorum
byte_pinning: false
description: |
    The catch-up quorum at its PRODUCTION default, with no num_updates fixture.

    The default was 3, counted as updates stored one per sender, so a node with
    two peers could never reach it and never merged a chain. The live
    moderation cohort (run 7, 2026-09-23) showed the result: chain lengths
    drifted, and because a grant needs id2 == chain_len + 1, Paxos stopped
    granting on every node. This is the exchange from
    chain-catchup-verifies-links without the fixture that lowers the quorum:
    dave must catch up from alice's single report. Under the old default dave's
    history stayed empty.

participants:
  - id: alice
    role: provider
  - id: dave
    role: consumer

steps:
  - id: 1
    from: alice
    to: dave
    function: latest update
    payload:
      chain:
        - {task: a, p1: 0.7, p2: 0.5}
        - {task: b, p1: 0.9, p2: 0.3}
        - {task: c, p1: 0.6, p2: 0.4}
    description: |
        alice reports her 3-entry hash-linked chain to dave. With the default
        quorum, dave verifies the segment's prev_hash links, accepts it, and
        catches up to 3 txs.

expected_state:
  dave:
    committed_tx_count: 3
    window_root: "044ff20acbca5c0d93e083ddc7f5cefbe404271250de10d0a15dd8e50d847556"
