schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "group-eid-eight-bytes"
description: |
  A group EID is the first eight bytes of the group hash.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "group_eid"
    group_hash_hex: "1122334455667788"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "group_eid"
    description: "trigger: group_eid"
expected_state:
  host:
    eid: "dtn://at-group-1122334455667788/"
