schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "route-v6-odd-prefix"
description: |
  A prefix that ends mid-byte is applied bit by bit.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "route"
    inners:
      - kind: "udp_net_4"
        match_cidr: "fd00::/65"
    target: "fd00:0:0:0:8000::1"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "route"
    description: "trigger: route"
expected_state:
  host:
    leg: -1
