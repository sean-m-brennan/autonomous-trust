schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "peer-eid-first-match-wins"
description: |
  Two peers on one address: the first listed is the one addressed.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "peer_eid"
    target: "10.0.0.5"
    peers:
      - address: "10.0.0.5"
        uuid: "aabbccdd-1122-4000-8000-000000000001"
      - address: "10.0.0.5"
        uuid: "bbbbbbbb-0000-4000-8000-000000000002"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "peer_eid"
    description: "trigger: peer_eid"
expected_state:
  host:
    eid: "dtn://at-aabbccdd/peer"
