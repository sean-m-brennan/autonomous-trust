schema_version: "1"
kind: scenario
protocol: reputation
name: attest-propose-rate-cap-declined
byte_pinning: false
description: |
    One attestation per verifier and subject in the resident window.

    bob's chain already holds an attested entry by alice about carol (a
    different finding, so a different digest and task id). A second one from the
    same verifier about the same subject is over the cap, counted from the chain
    itself so every member reaches the same answer. bob declines.

participants:
  - id: alice
    role: verifier
  - id: bob
    role: member
  - id: carol
    role: subject

fixtures:
  reputations:
    bob:
      alice: 0.7
  tx_history:
    bob:
      - attested: true
        p1: alice
        p1_score: 0.3
        p1_channel: probe
        subject: carol
        evidence_digest: "cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd"

steps:
  - id: 1
    from: alice
    to: bob
    function: attest propose
    payload:
      subject: carol
      score: 0.3
    description: a second attestation by alice about carol.

expected_state:
  bob:
    attest_signs_sent: 0
