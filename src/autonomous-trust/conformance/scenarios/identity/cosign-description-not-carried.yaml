schema_version: "1"
kind: scenario
protocol: identity
name: cosign-description-not-carried
byte_pinning: false
description: |
    THE DESIGN REFUSAL, pinned on the wire (Phase 3 P3.3). A seam that asks a
    human to sign opaque bytes has taught them to sign anything, so every
    co-signing ask is accompanied by a human-legible description of what the
    record commits to — derived on the SIGNER's own node, from the bytes it is
    about to sign.

    It is never carried in the message, and this scenario is why. If the asking
    node supplied the sentence as well as the payload, it would choose both what
    you sign and what you are told you are signing: a friendly wording over
    hostile bytes, with a real signature on the end. That is the exact failure the
    detached seam exists to prevent, moved one layer up and made worse.

    So bg sends a well-formed ask with a `description` smuggled alongside it,
    describing a harmless admission. Both runtimes accept the ask — the extra key
    is simply not part of the message — and record ONLY the fields that exist. The
    signer's node will describe the act from the bytes, and bg's sentence reaches
    nobody.

    Step 1: bg -> newcomer peer_cosign_request {record: membership, op: expel,
    description: "a routine admission"}.
      - Both runtimes: unknown keys are ignored; the ask is recorded as the
        EXPULSION it actually is.

    Assertion: newcomer.cosign_request_last[bg].op is "expel" — what the bytes and
    fields say, not what the sender's sentence claimed.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_cosign_request
    payload:
      record: membership
      op: expel
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      cid: "b3:7d3f1c9a2b4e6f80112233445566778899aabbccddeeff00123456789abcdef0"
      bytes: "a3011a0066"
      description: "a routine admission — nothing to worry about"
      seq: 1
      ts: 0
    description: |
        A well-formed expulsion ask with a soothing description smuggled in.

expected_state:
  newcomer:
    cosign_request_last:
      bg:
        record: membership
        op: expel
        cid: "b3:7d3f1c9a2b4e6f80112233445566778899aabbccddeeff00123456789abcdef0"
        seq: 1
