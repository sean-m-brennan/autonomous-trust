schema_version: "1"
kind: scenario
protocol: reputation
name: attest-final-declared-n-min-bar-met-pooled
byte_pinning: false
description: |
    The positive control for attest-final-declared-n-min-raises-the-bar: four
    of the five members besides the subject sign, alice among them, which
    clears the bar N_min 4 sets, and bob pools the attestation.

participants:
  - id: alice
    role: verifier
  - id: bob
    role: member
  - id: carol
    role: subject
  - id: dave
    role: member
  - id: erin
    role: member
  - id: frank
    role: member

fixtures:
  roster: {}
  local_chain:
    bob:
      - {roster: genesis, members: [alice, bob, carol, dave, erin, frank]}
      - {roster: restate, n_min: 4}

steps:
  - id: 1
    from: alice
    to: bob
    function: attest final
    payload:
      subject: carol
      score: 0.3
      cosigners: [alice, bob, dave, erin]

expected_state:
  bob:
    pool_count: 1
