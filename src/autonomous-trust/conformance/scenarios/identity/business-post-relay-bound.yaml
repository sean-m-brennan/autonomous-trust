schema_version: "1"
kind: scenario
protocol: identity
name: business-post-relay-bound
byte_pinning: false
description: |
    THE RELAY BOUND (Phase 3 P3.4). A business post gossips "active network
    plus one hop", the same bound a feed post travels under (POST_MAX_HOPS).
    This is the SECOND hop arriving: a post already carrying hops: 1 is
    accepted and recorded — the reader still gets to see it — and is NOT
    relayed again.

    Note what hops is and is not. It rides OUTSIDE the signature, because a
    relay increments it and signing over it would invalidate the signature at
    the first forward; the signature still covers every byte that matters, so
    a relay cannot alter a word of the post while bumping the counter. That
    asymmetry is why this scenario can set hops directly.

    business_posts_emitted: 0 against business-post-shared's 1, with the same
    page held and the same good signature, is the bound made observable. A
    mutation that drops the hop check passes shared and fails this.

    Steps 1-2: the ad, then a post that has already been relayed once.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_business_ad
    payload:
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      sat: 255
      seq: 1
      ts: 0
      bundle: '{"page":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ","name":"Corner Cafe","locality":"9q8yyk8y"},"sig":"stub"},"delegation":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"},"sig":"stub"}}'
    description: |
        The ad that teaches newcomer the page.
  - id: 2
    from: bg
    to: newcomer
    function: peer_business_post
    payload:
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      seq: 1
      ts: 0
      hops: 1
      bundle: '{"post":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ","body":"Fresh croissants at seven.","seq":1},"sig":"stub"},"delegation":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"},"sig":"stub"}}'
    description: |
        A post that has already travelled one hop. Shown, not carried further.

expected_state:
  newcomer:
    business_post_last:
      "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ":
        seq: 1
        hops: 1
    business_posts_emitted: 0
