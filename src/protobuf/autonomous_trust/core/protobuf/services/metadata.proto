syntax = "proto3";

package autonomous_trust.core.protobuf.services;

import "autonomous_trust/core/protobuf/structures/datetime.proto";
import "autonomous_trust/core/protobuf/services/position.proto";

message PeerData {
  structures.DateTime time = 1;
  GeoPosition position = 2;
  double speed = 3;
  string kind = 4;
  string data_type = 5;
  int32 data_channels = 6;
}

message NetworkStats {
  double up = 1;
  double down = 2;
  int64 sent = 3;
  int64 recv = 4;
  int64 err_out = 5;
  int64 err_in = 6;
}
