schema_version: "1"
kind: scenario
protocol: reputation
name: catchup-placed-equivocation-kept
byte_pinning: false
description: |
    Ordered placement (doc/architecture/reputation.md, "Agreeing on an
    order"): a placed chain carries each placement's certificate on its last
    entry, with the index the placement began at, so a node catching up checks
    every placement it is handed, against its own view of the group (a strict
    majority, here three of four). Then a placement decides, not a length.

    bob holds a certified placement at index 0. alice's chain holds a
    DIFFERENT certified placement at index 0, and a second after it. Two
    quorums cannot sign two values at one index unless someone signed both:
    that is equivocation, never settled by a rule. bob keeps his chain and
    records it: both certificates, and alice and carol, who signed both
    values (R+D.md §14.1).

participants:
  - id: alice
    role: provider
  - id: bob
    role: consumer
  - id: carol
    role: member
  - id: dave
    role: member

fixtures:
  # Real scorers, so each half carries its scorer's signature (R+D.md §14.2).
  chain_parties: [carol, dave]
  local_chain:
    bob:
      - {task: a, p1: 0.7, p2: 0.5, batch: 1}
      - {task: b, p1: 0.9, p2: 0.3, batch: 1, placed_by: [alice, bob, carol]}

steps:
  - id: 1
    from: alice
    to: bob
    function: latest update
    payload:
      chain:
        - {task: c, p1: 0.6, p2: 0.4, batch: 1, certified_by: [alice, carol, dave]}
        - {task: d, p1: 0.8, p2: 0.8, batch: 1, placed_by: [alice, carol, dave], certified_by: [alice, carol, dave]}
        - {task: e, p1: 0.5, p2: 0.5, batch: 2, placed_by: [alice, carol, dave], certified_by: [alice, carol, dave]}

expected_state:
  bob:
    chain_entries: [a, b]
    equivocations: {count: 1, index: 0, both: [alice, carol]}
    evidence_doc: {forks: 1}
