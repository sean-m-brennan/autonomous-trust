schema_version: "1"
kind: scenario
protocol: identity
name: reach-record-wrong-key-is-refused
byte_pinning: false
description: |
    A record naming Alice's uuid, validly signed -- by Mallory's key -- and
    handed over as a relay lookup's answer (no sender), which is exactly what a
    hostile relay would serve. A uuid is only a label; what makes a record
    Alice's is her key, the one Bob already holds for her. Refused, and Alice's
    hints are untouched. Delivered WITHOUT a sender on purpose: pushed by
    Mallory himself, the sender check would refuse it first and this case would
    pin nothing about the key.

participants:
  - id: alice
    role: border_guard
  - id: bob
    role: new_node
  - id: mallory
    role: new_node

fixtures:
  first_contact:
    enabled: true
  groups:
    alice:
      uuid: "fc000000-0000-4000-8000-0000000000a3"
      size: 1
    bob:
      uuid: "fc000000-0000-4000-8000-0000000000b3"
      size: 1
    mallory:
      uuid: "fc000000-0000-4000-8000-0000000000c3"
      size: 1
  contacts:
    alice:
      rendezvous:
        - relay://198.51.100.1:27790

steps:
  - id: 1
    from: mallory
    to: bob
    function: reach_record
    payload:
      signer: mallory
      claim: alice
      local: true
      seq: 9
      relays:
        - relay://203.0.113.7:27790

    description: |
        A forged record for Alice, as a hostile relay would serve it.

expected_state:
  bob:
    contacts:
      alice:
        reach_seq: 0
        rendezvous_head: relay://198.51.100.1:27790

