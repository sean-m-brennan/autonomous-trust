schema_version: "1"
kind: scenario
protocol: reputation
name: reputation-canonical
byte_pinning: false
description: |
    Documentation canonical for the Reputation protocol — picked up
    by `scripts/build-docs.sh` via the `<protocol>-canonical.yaml`
    convention and rendered into `doc/architecture/_generated/`.
    Mirrors `transaction-placing-accepted-without-a-grant`
    step-for-step; the duplication is intentional so the docs example
    has a stable filename that won't move when that scenario is
    updated, while still running through the same conformance code
    path so the diagram cannot drift from executable behavior.

    Flow: a half in a group that places its order (the default since
    2026-10-13; doc/architecture/reputation.md, "Agreeing on an
    order"). The half has no Phase 1: alice sends her transaction at
    once, bob co-signs it, and with his signature her half is
    certified and goes to the pool, where placement later gives it
    its index. The legacy half round, for a group that does not place
    its order, is `reputation-legacy-canonical`.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor

fixtures:
  proposals:
    alice:
      - id1: 1000
        id2: 1
        task_id: t-1
        score: 0.8

steps:
  - id: 1
    from: alice
    to: bob
    function: transaction
    payload:
      id1: 1000
      id2: 1
      proposer: alice
      task_id: t-1
      score: 0.8
      certify: true
      placing: true
    description: |
        alice proposes her half to the group at once, naming the group
        and asking each member to sign what it accepts. No ask
        permission: placement decides where the entry goes.
  - id: 2
    from: bob
    to: alice
    function: tx accepted
    in_response_to: 1
    payload:
      id1: 1000
      id2: 1
      proposer: alice
      task_id: t-1
      score: 0.8
      signed: true
    description: |
        bob signs alice's commit designation. With his signature and
        her own acceptance a majority certifies the half, and alice
        puts it in her pool (then broadcasts `tx committed`, so every
        member pools it).

expected_state:
  alice:
    committed_tx_count: 0
    pool_tasks: [t-1]
