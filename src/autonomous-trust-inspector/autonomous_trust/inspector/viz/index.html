<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1024" />
    <title>Autonomous Trust</title>
    
    <meta name="description" content="" />
    <meta name="author" content="Sean Brennan" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link href="css/force.css" rel="stylesheet" />
    <style>
      html, body { height: 100%; }
    </style>
  </head>
  <body>
    <div class="graph-container" style="width: 100%; height: 100%;"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://d3js.org/d3.v4.min.js" charset="utf-8"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>
    <script src="js/force.js"></script>

    <script>
      // Socket parameters are rendered in by VizServer.page() rather than
      // hardcoded in force.js: the scheme follows whether TLS is configured,
      // and ws_token is empty whenever client authentication is off (the
      // default), in which case force.js sends no credential frame at all.
      // The `default` filters keep this template renderable by anything that
      // serves it without supplying them.
      const AT_WS = {
          scheme: "{{ ws_scheme|default('ws') }}",
          port: {{ ws_port|default(8000) }},
          token: "{{ ws_token|default('') }}"
      };
      $(document).ready(function() {
          const forcesGraph = createForcesGraph()
          forcesGraph.init(AT_WS.port, 500, 10, null, true,
                           {scheme: AT_WS.scheme, token: AT_WS.token});
          forcesGraph.start();
      });
    </script>
  </body>
</html>
