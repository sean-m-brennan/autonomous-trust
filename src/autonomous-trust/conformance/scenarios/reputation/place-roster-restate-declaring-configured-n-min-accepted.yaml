schema_version: "1"
kind: scenario
protocol: reputation
name: place-roster-restate-declaring-configured-n-min-accepted
byte_pinning: false
description: |
    An acceptor takes a roster restatement declaring an N_min it is configured
    for (RD_13.2 plan §0.4, calls 8 and 9). The roster in force declares none, so
    this restatement changes the declaration, and a change is not held to the
    half-window age a plain restatement is. bob is configured for N_min 4, so he
    accepts.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: member
  - id: dave
    role: member

fixtures:
  roster:
    bob: [alice, bob, carol]
  n_min:
    bob: 4

steps:
  - id: 1
    from: alice
    to: bob
    function: place
    payload:
      k: 0
      ballot: {n: 5, by: alice}
      head: ""
      value:
        - {roster: restate, n_min: 4}
  - id: 2
    from: bob
    to: alice
    function: place accepted
    in_response_to: 1
    no_propagate: true
    payload: {}

expected_state:
  bob:
    place_promised: {n: 5, by: alice}
