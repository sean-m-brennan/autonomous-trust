schema_version: "1"
kind: scenario
protocol: identity
name: peer-caps-exchange
byte_pinning: false
description: |
    Exercises both `peer_caps_query` (IdentityProtocol.caps_query)
    and `peer_caps_response` (IdentityProtocol.caps_response)
    handlers in a single round trip with full semantic parity.

    Step 1: newcomer queries bg for its capabilities.
      - Python: handle_caps_query reads
        `self.capabilities.to_list()` and emits a JSON-array
        caps_response back.
      - C: handle_caps_query (2026-05-12 semantic-parity rewrite,
        no longer a stub) looks up the test-installed own-caps
        allowlist via `_id_own_caps_for` and emits the same
        JSON-array payload.

    Step 2: bg sends a caps_response to newcomer with bg's own
    capabilities list.
      - Python: handle_caps_response parses the array and
        registers each cap under bg.uuid in newcomer's
        peer_capabilities map.
      - C: handle_caps_response stores the array under bg.uuid
        in id_state.peer_caps_map.

    `peer_caps_count` expected_state assertion: count of caps
    registered for ANY peer in newcomer's view. With bg sending
    a 2-cap response, both languages record peer_caps_count=2.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

fixtures:
  capabilities:
    bg: [sensor_validation, airquality_stream]

steps:
  - id: 1
    from: newcomer
    to: bg
    function: peer_caps_query
    payload: {}
    description: |
        newcomer asks bg for its capability list. bg's
        handle_caps_query emits a caps_response carrying
        `[sensor_validation, airquality_stream]` back.
  - id: 2
    from: bg
    to: newcomer
    function: peer_caps_response
    payload:
      caps: [sensor_validation, airquality_stream]
    description: |
        bg's caps_response delivered to newcomer.
        handle_caps_response parses the array and registers both
        caps under bg's uuid in newcomer's peer_capabilities.

expected_state:
  newcomer:
    peer_caps_count: 2
