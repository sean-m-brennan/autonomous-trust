schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "peer-eid-match-is-exact"
description: |
  The address match is exact: a peer stored with a CIDR suffix does not match the bare address.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "peer_eid"
    target: "10.0.0.5"
    peers:
      - address: "10.0.0.5/24"
        uuid: "aabbccdd-1122-4000-8000-000000000001"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "peer_eid"
    description: "trigger: peer_eid"
expected_state:
  host:
    eid: "dtn://at-10.0.0.5/peer"
