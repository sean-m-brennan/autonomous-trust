schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "route-no-default-no-leg"
description: |
  With no default, an unmatched address has no leg.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "route"
    inners:
      - kind: "udp_net_4"
        match_cidr: "10.0.0.0/24"
      - kind: "udp_net_4"
        match_cidr: "172.20.0.0/16"
    target: "192.168.1.10"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "route"
    description: "trigger: route"
expected_state:
  host:
    leg: -1
