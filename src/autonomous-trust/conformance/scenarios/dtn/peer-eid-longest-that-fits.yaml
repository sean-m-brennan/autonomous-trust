schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "peer-eid-longest-that-fits"
description: |
  An EID of 127 bytes is the longest either runtime forms.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "peer_eid"
    target: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    peers: []
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "peer_eid"
    description: "trigger: peer_eid"
expected_state:
  host:
    eid: "dtn://at-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/peer"
