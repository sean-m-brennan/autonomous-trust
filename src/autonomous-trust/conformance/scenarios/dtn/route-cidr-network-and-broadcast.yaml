schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "route-cidr-network-and-broadcast"
description: |
  Both ends of a CIDR are inside it.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "route"
    inners:
      - kind: "udp_net_4"
        match_cidr: "192.168.1.0/24"
    target: "192.168.1.255"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "route"
    description: "trigger: route"
expected_state:
  host:
    leg: 0
