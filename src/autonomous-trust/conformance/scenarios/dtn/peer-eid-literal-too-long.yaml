schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "peer-eid-literal-too-long"
description: |
  An EID target is refused when it is over 127 bytes.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "peer_eid"
    target: "dtn:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    peers: []
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "peer_eid"
    description: "trigger: peer_eid"
expected_state:
  host:
    error: true
