[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "autonomous_trust_operator"
version = "0.2.1"
description = "AutonomousTrust Operator - PIV+MFA terminal console for human operators of an AT node"
authors = ["Sean M Brennan <sean.brennan@tekfive.com>"]
readme = "README.md"
packages = [{include = "autonomous_trust"}]
#license = "Proprietary"
exclude = ["**/__pycache__"]

[project]
name = "autonomous_trust_operator"
version = "0.2.1"

[tool.poetry.dependencies]
python = "^3.13"
#autonomous_trust.core = {path = "../autonomous-trust"}
autonomous-trust = ">=0.2.1"
autonomous-trust-services = ">=0.2.1"
# Terminal UI framework (PIV_MFA_OPERATOR_ACCESS_PLAN.md §6.2 decision: Textual).
textual = ">=0.60"
# Second-factor: TOTP (RFC 6238) is the §6.1 default.
pyotp = ">=2.9"
# PKCS#11 binding (§6.5 decision: PyKCS11) for live PIV/CAC cards -- mirrors the
# `pykcs11` pip entry in config/cfg/environment.yml. The card paths lazy-import
# it, so demo/CI still runs where the binding or middleware is absent.
PyKCS11 = ">=1.5.12"
