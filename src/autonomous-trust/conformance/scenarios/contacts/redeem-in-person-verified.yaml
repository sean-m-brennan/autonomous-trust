schema_version: "1"
kind: "scenario"
protocol: "contacts"
name: "redeem-in-person-verified"
description: |
  The same invitation redeemed as an in-person/QR exchange: the key arrived over a channel with no man in the middle, so the contact is verified on the spot and seeded slightly above neutral (§4.4/§10.5).
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  contacts:
    op: "redeem"
    blob: ""
    in_person: true
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "redeem"
    description: "trigger: redeem"
expected_state:
  host:
    verified: true
    provenance: "in_person"
    trust_seed: 0.3
    uuid: "aaaaaaaa-0000-4000-8000-000000000001"
    nickname: "alice@example"
