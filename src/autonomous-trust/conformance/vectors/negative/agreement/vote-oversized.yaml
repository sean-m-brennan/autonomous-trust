schema_version: "1"
kind: negative
protocol: agreement
name: vote-oversized
description: |
    Replace the `data` field on bob's agreement vote with base64 of
    65535 zero bytes. Companion to identity/request-access-oversized
    on an agreement envelope.

    Same honest semantic: parsers decode cleanly, signature
    verification fails because the inflated payload doesn't match
    what bob signed. Reason_class: signature_verification_failed.

based_on: scenarios/agreement/poa-leader-abstains.yaml

mutation:
  step_id: 1
  op: inflate
  target: payload
  size: 65535

expected:
  reason_class: signature_verification_failed
