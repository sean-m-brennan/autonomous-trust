schema_version: "1"
kind: scenario
protocol: identity
name: gateway-child-key-needs-verification
byte_pinning: false
description: |
    A gateway holding only a child cohort's public key takes the child's
    private key from a verified update only.

    gw bridges a cohort below it and was seeded with that child group's public
    key alone, at epoch 2. anchor, a child member, sends an unsigned update for
    the child: the same group at the same epoch, larger by three members, and
    carrying a private key. The larger membership used to be reason enough to
    install the key that came with it. A key reaches the child under the same
    gate as a rotation: from a verified message, at the epoch held or a newer
    one. Nothing changes.

participants:
  - id: gw
    role: border_guard
  - id: boss
    role: group_member
  - id: anchor
    role: group_member

fixtures:
  groups:
    anchor:
      uuid: "0c000000-0000-4000-8000-0000000000c7"
      size: 4
      key_epoch: 2
  cohort_tree:
    nodes:
      gw:
        members: [boss]
        child_group: [anchor]
        child_uuid: "0c000000-0000-4000-8000-0000000000c7"
        child_public_only: true
        child_key_epoch: 2

steps:
  - id: 1
    from: anchor
    to: gw
    function: group_key_update
    payload:
      unsigned: true
    description: anchor sends an unsigned, larger copy of the child carrying a key.

expected_state:
  gw:
    group_size: 2
    child_group_size: 1
    child_group_owns_key: false
    child_group_key_epoch: 2
