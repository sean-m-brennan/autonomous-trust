schema_version: "1"
kind: scenario
protocol: agreement
name: pow-mined-proof-finalizes-true
byte_pinning: false
description: |
    Second POW scenario; introduces the `function: prove` step kind.
    Each adapter mines a valid POW proof for `blob-x` using its own
    `protocol.prove()` implementation, then runs verify and asserts
    finalize=true.

    PER-LANGUAGE MINING (this is the design, not a test gap): Python's
    `nacl.hash.blake2b` returns ASCII-hex bytes; C's
    `crypto_generichash` returns raw bytes. The `DIFFICULTY=2` setting
    consequently means different things in each impl — Python checks 2
    leading hex `'0'` chars (1 zero byte), C checks 2 leading raw zero
    bytes. Both impls still produce mineable proofs at their own
    difficulty; the conformance gate compares only the *outcome* of
    `finalize` (true on both sides), not the digest bytes. The
    cross-language digest-format and DIFFICULTY-interpretation drift
    is tracked as BUGS.md P5 and deferred for production alignment.

    Why this scenario still adds value despite per-language semantics:
      - Exercises the full prove/verify/finalize POW state machine in
        both languages end-to-end.
      - Confirms `agreement_prove` and `protocol.prove` produce proofs
        their own verifier accepts (a regression would surface as
        outcome=false on one or both sides).
      - Gives a structural template for a future cross-language POW
        scenario after the canonical-hash plumbing lands.

participants:
  - id: alice
    role: voter
  - id: bob
    role: voter

fixtures:
  impl: work
  difficulty: 2
  myself: bob
  blobs:
    blob-x:
      originator: alice
      payload: "minable-payload"

steps:
  - id: 1
    from: bob
    to: agreement
    function: prove
    payload:
      blob: blob-x
    description: |
        bob mines a valid POW proof for blob-x (per its impl's own
        DIFFICULTY semantics) and submits via protocol.verify.
  - id: 2
    from: bob
    to: agreement
    function: finalize
    payload:
      blob: blob-x
      expected_outcome: true
    description: |
        finalize sees the approved blob and returns true. The exact
        digest bytes differ across languages (see P5); only the
        outcome is cross-language asserted.
