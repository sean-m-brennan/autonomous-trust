schema_version: "1"
kind: scenario
protocol: identity
name: block-survives-restart
byte_pinning: false
description: |
    A block outlives the process that recorded it (Phase 4 P4.1).

    Until this increment NO SOCIAL STATE WAS PERSISTED AT ALL — the five files
    doc/architecture/persistent-cohort.md lists do not include one, and
    connection_edges is equally in-memory. A block could live with that only
    while a block did nothing. Now that it gates every inbound path, a restart
    silently restoring a blocked peer's reach is a moderation failure, not a
    cache miss: the person blocked someone and the daemon forgot.

    It is written CORE-SIDE, to etc/at/social.cfg.json, not app-side. Every
    enforcement point is inside the core, so an app-side store would leave a
    window between agorad starting and the app's first replay during which a
    blocked peer's DMs and posts land — and agorad is a standalone daemon the
    GUI spawns, so that window is real. It must also work headless, and this
    harness runs the core with NO app at all, which is the plainest possible
    demonstration of why: an app-side store could not be pinned here.

    trigger_social_reload drives the real writer and the real reader — save,
    then load back, which is the round trip a restart performs. A conformance
    step cannot restart a process, and asserting on the in-memory record alone
    would pass with no file written at all.

    bob is scored and never blocked. He is the control: if the reload had
    simply wiped everything, alice's 0 would look like a preserved block.

    The SERIALIZATION is not pinned here — a live block stamps the wall clock,
    so two runtimes legitimately write different timestamps, and comparing live
    files would be comparing clocks. The exact bytes are pinned instead by
    test/social_store_test.c and tests/a_unit/test_social_store.py, which hold
    the same golden document on both sides.

    Requires CONFORMANCE_SOCIAL=1, or the C side skips and diff_results scores
    a one-side skip as a match.

participants:
  - id: node
    role: border_guard
  - id: alice
    role: group_member
  - id: bob
    role: group_member

fixtures:
  # Pinned, not adapter-minted: the identity-resync query is gated on the
  # asker's group uuid matching the responder's, so without a shared pin each
  # runtime mints its own per-participant group and the backfill silently
  # produces no peer (see tier-update-applied, block-local-clamp).
  shared_group:
    uuid: "0c000000-0000-4000-8000-00000000000b"

steps:
  - id: 1
    from: node
    to: alice
    function: peer_identity_query
    payload:
      have: []
    description: Setup. node asks alice for her published identity.
  - id: 2
    from: alice
    to: node
    function: peer_identity_response
    in_response_to: 1
    payload: {}
    description: Setup. node backfills alice into its peer list.
  - id: 3
    from: node
    to: bob
    function: peer_identity_query
    payload:
      have: []
    description: Setup. node asks bob for his published identity.
  - id: 4
    from: bob
    to: node
    function: peer_identity_response
    in_response_to: 3
    payload: {}
    description: Setup. node backfills bob into its peer list.
  - id: 5
    from: node
    to: node
    function: tier_update
    payload:
      peer: alice
      tier: 3
    description: The reputation process publishes alice at tier 3. Local IPC.
  - id: 6
    from: node
    to: node
    function: tier_update
    payload:
      peer: bob
      tier: 3
    description: The reputation process publishes bob at tier 3.
  - id: 7
    from: node
    to: node
    function: trigger_block
    payload:
      peer: alice
    description: |
        node blocks alice. The record is written to disk on the mutation
        itself, not at shutdown — a block that survives only a graceful stop is
        not much of a block.
  - id: 8
    from: node
    to: node
    function: trigger_social_reload
    payload: {}
    description: |
        Save and load back: the round trip a restart performs. If the block
        lived only in memory, or the file were written but not read at start-up,
        alice's clamp would vanish here.

expected_state:
  node:
    peer_count: 2
    peer_tier:
      alice: 0    # blocked, and the block came back off disk
      bob: 3      # never blocked; proves the reload did not simply wipe state
