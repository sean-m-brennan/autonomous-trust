schema_version: "1"
kind: scenario
protocol: identity
name: business-ad-noncustomer-silent
byte_pinning: false
description: |
        THE GATE'S NEGATIVE (Phase 3 P3.2), and the exact control for
        business-ad-customer-relays: the same ad, the same peer, the fixtures.customers
        edge removed. newcomer verifies bg's ad and RECORDS the page — it can show
        the cafe to its operator — but it carries nothing onward, because it is not
        a customer. Patronage, not audience, is what distributes a page.

        NON-VACUITY: newcomer.business_page is present at seq 1, so the ad was
        genuinely accepted; business_ads_emitted = 0 can therefore only be the
        customer gate. Together with -customer-relays (emits 1) this pins the gate
        from both sides.

        customer_satisfaction = -1 is the same fact read from the other end: no
        edge held, so nothing to say and nothing to sign.

        Step 1: bg -> newcomer peer_business_ad {sat: 255 (SAT_SELF), seq: 1}.
          - Both runtimes: verify, record at seq 1, emit NOTHING.


participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_business_ad
    payload:
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      sat: 255
      seq: 1
      ts: 0
      bundle: '{"page":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ","name":"Corner Cafe","locality":"9q8yyk8y"},"sig":"stub"},"delegation":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"},"sig":"stub"}}'
    description: |
        bg's signed ad for its own page.

expected_state:
  newcomer:
    business_page:
      "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ":
        seq: 1
        endorsers: 0
    customer_satisfaction:
      "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ": -1
    business_ads_emitted: 0
