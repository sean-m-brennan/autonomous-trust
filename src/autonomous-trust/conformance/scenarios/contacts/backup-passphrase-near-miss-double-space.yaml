schema_version: '1'
kind: scenario
protocol: contacts
name: backup-passphrase-near-miss-double-space
description: Two spaces between groups is not the code shape.
byte_pinning: false
participants:
- id: host
  role: recipient
fixtures:
  contacts:
    op: backup
    mode: passphrase
    passphrase: abcd  efgh-jklm-npqr-stuv-wxyz
steps:
- id: 1
  from: host
  to: host
  function: backup
  description: 'trigger: backup passphrase'
expected_state:
  host:
    passphrase_status: ok
    normalized: abcd  efgh-jklm-npqr-stuv-wxyz
