schema_version: "1"
kind: scenario
protocol: negotiation
name: probe-target-drawn
byte_pinning: false
description: |
    With a probe block declared, a directed probe's target is drawn rather
    than taken from the prober (RD_12.7 plan section 3.4, D1(b), D6). The
    weights are the UCB1 bonuses of the selection layer's own probe counts,
    so both runtimes draw from the same numbers wherever their prober runs.

    The prober addresses an at.handshake probe to bob. Nobody has been probed
    yet, so every bonus is equal, and link 1 of alice's chain draws carol out
    of dave, carol and bob. carol is probed. bob is not, although the prober
    named him. A task addressed to a peer by anything but the prober keeps
    its address (spawn-task-selects-k's peers are drawn only because the task
    is unaddressed).

participants:
  - id: alice
    role: requestor
  - id: bob
    role: worker
  - id: carol
    role: worker
  - id: dave
    role: worker

fixtures:
  capabilities:
    bob: [at.handshake]
    carol: [at.handshake]
    dave: [at.handshake]
  selection:
    holder: alice
    root: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
    declaration:
      version: 1
      probe: {floor: 0.1}

steps:
  - id: 1
    from: alice
    to: alice
    function: spawn task
    payload:
      capability: at.handshake
      task_id: t-probe
      target: bob
    description: the prober asks for a probe of bob.
  - id: 2
    from: alice
    to: carol
    function: invitation
    in_response_to: 1
    description: the draw falls on carol, who checks it.
  - id: 3
    from: alice
    to: bob
    function: invitation
    in_response_to: 1
    expect_none: true
    description: bob, the prober's choice, is not probed.

expected_state:
  alice:
    has_my_task: t-probe
  carol:
    selection_findings: {}
