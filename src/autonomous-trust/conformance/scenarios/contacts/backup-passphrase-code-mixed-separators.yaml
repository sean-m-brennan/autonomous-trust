schema_version: '1'
kind: scenario
protocol: contacts
name: backup-passphrase-code-mixed-separators
description: Dashes and spaces may be mixed.
byte_pinning: false
participants:
- id: host
  role: recipient
fixtures:
  contacts:
    op: backup
    mode: passphrase
    passphrase: abcd-EFGH jklm-npqr stuv-wxyz
steps:
- id: 1
  from: host
  to: host
  function: backup
  description: 'trigger: backup passphrase'
expected_state:
  host:
    passphrase_status: ok
    normalized: ABCD-EFGH-JKLM-NPQR-STUV-WXYZ
