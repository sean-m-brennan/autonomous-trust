schema_version: "1"
kind: scenario
protocol: reputation
name: place-roster-restate-too-early-refused
byte_pinning: false
description: |
    Membership recorded in the chain (doc/architecture/reputation.md, "Who is
    in the group"). A roster is restated only once it is half a window old, so
    that the roster in force never leaves the resident chain. A restatement
    now, with the roster still fresh, is refused.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: member
  - id: dave
    role: member

fixtures:
  ordered_placement: true
  roster:
    bob: [alice, bob, carol]

steps:
  - id: 1
    from: alice
    to: bob
    function: place
    payload:
      k: 0
      ballot: {n: 5, by: alice}
      head: ""
      value:
        - {roster: restate}
  - id: 2
    from: bob
    to: alice
    function: place accepted
    in_response_to: 1
    expect_none: true
    payload: {}
