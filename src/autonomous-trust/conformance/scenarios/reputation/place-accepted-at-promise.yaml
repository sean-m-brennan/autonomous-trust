schema_version: "1"
kind: scenario
protocol: reputation
name: place-accepted-at-promise
byte_pinning: false
description: |
    Ordered placement (doc/architecture/reputation.md, "Agreeing on an
    order"): classic Paxos decides what the chain holds from each index.
    alice sends a value for instance 0 under (5, alice): one completed task
    between carol and dave, each half carrying its commit certificate. bob has
    promised nothing higher, the task is not on its chain, and both certificates
    clear its quorum, so it accepts, signs the placement, and promises the
    ballot.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: member
  - id: dave
    role: member

fixtures: {}

steps:
  - id: 1
    from: alice
    to: bob
    function: place
    payload:
      k: 0
      ballot: {n: 5, by: alice}
      head: ""
      value:
          - {task_id: t-1, p1: carol, p1_score: 0.9, p2: dave, p2_score: 0.7}
  - id: 2
    from: bob
    to: alice
    function: place accepted
    in_response_to: 1
    no_propagate: true
    payload: {}

expected_state:
  bob:
    place_promised: {n: 5, by: alice}
