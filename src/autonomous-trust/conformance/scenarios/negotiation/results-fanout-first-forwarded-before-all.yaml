schema_version: "1"
kind: scenario
protocol: negotiation
name: results-fanout-first-forwarded-before-all
byte_pinning: false
description: |
    The first reply to a fanned-out task goes on toward the app at once
    (ISSUES §2.8, the user's call 2026-10-20), and the task stays open for
    the invitees still to answer, whose results will be scored only.

    alice spawns a task both bob and carol can do; only bob reports. bob's
    result is forwarded and scored, and alice still holds the task for carol.
    Until then C forwarded only once every invitee had answered, so one
    silent invitee kept the app from seeing any answer at all.

participants:
  - id: alice
    role: requestor
  - id: bob
    role: worker
  - id: carol
    role: worker

fixtures:
  capabilities:
    bob: [data_fetch]
    carol: [data_fetch]

steps:
  - id: 1
    from: alice
    to: alice
    function: spawn task
    payload:
      capability: data_fetch
      task_id: t-first
    description: alice spawns; bob and carol are invited.
  - id: 2
    from: bob
    to: alice
    function: report results
    payload:
      task_id: t-first
      result: done
    description: bob reports; carol never does.

expected_state:
  alice:
    results_scored: {task: t-first, executors: [bob]}
    results_forwarded: {task: t-first, executors: [bob]}
    has_my_task: {slug: t-first, present: true}
