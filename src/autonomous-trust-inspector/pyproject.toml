[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "autonomous_trust_inspector"
version = "0.2.1"
description = "AutonomousTrust Inspector - the AutonomousTrust network visualization tool"
authors = ["Sean M Brennan <sean.brennan@tekfive.com>"]
readme = "README.md"
packages = [{include = "autonomous_trust"}]
#license = "Proprietary"
include = ['autonomous_trust/inspector/viz/index.html',
    'autonomous_trust/inspector/viz/css/*',
    'autonomous_trust/inspector/viz/js/*',
    'autonomous_trust/inspector/viz/scss/*']
exclude = ["**/__pycache__"]

[project]
name = "autonomous_trust_inspector"
version = "0.2.1"

[tool.poetry.dependencies]
python = "^3.13"
#autonomous_trust.core = {path = "../autonomous-trust"}
autonomous-trust = ">=0.2.1"
autonomous-trust-services = ">=0.2.1"
aenum = ">=3.1.11"
libsass = ">=0.22.0"
networkx = ">=3.0"
numpy = ">=1.24"                # nx.spring_layout in disaster_response_graph.py needs it
quart = ">=0.19.5"
flask = '>=3.0,<3.2'
plotly = ">=5.9.0"
kaleido = ">=0.2.1,<1.0"        # static PNG export of figures (0.2.x is headless; 1.x needs Chrome)
dash = '>=3.0'                 # code only uses dash.Patch (>=2.9); dash-extensions needs >=3
dash-bootstrap-components = '>=2.0.0'
dash-extensions = '>=2.0'      # dash_components.core + dashboard modules import dash_extensions.enrich
dash-iconify = '>=0.1.2'
websockets = '>=10,<15'        # dash_components.core imports websockets.legacy.server (removed in 15)

