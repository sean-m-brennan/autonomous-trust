schema_version: "1"
kind: scenario
protocol: identity
name: gateway-child-key-refuses-older-epoch
byte_pinning: false
description: |
    A gateway holding only a child cohort's public key refuses a carried key
    older than the one it holds.

    gw holds the child group's public key at epoch 2. anchor sends a verified
    update for the child, larger by three members and carrying a private key,
    at epoch 1. Installing it would roll the child back to a retired key, which
    is what the rotation gate exists to refuse. Nothing changes.

participants:
  - id: gw
    role: border_guard
  - id: boss
    role: group_member
  - id: anchor
    role: group_member

fixtures:
  groups:
    anchor:
      uuid: "0c000000-0000-4000-8000-0000000000c7"
      size: 4
      key_epoch: 1
  cohort_tree:
    nodes:
      gw:
        members: [boss]
        child_group: [anchor]
        child_uuid: "0c000000-0000-4000-8000-0000000000c7"
        child_public_only: true
        child_key_epoch: 2

steps:
  - id: 1
    from: anchor
    to: gw
    function: group_key_update
    payload: {}
    description: anchor sends a verified, larger copy of the child under an older key.

expected_state:
  gw:
    group_size: 2
    child_group_size: 1
    child_group_owns_key: false
    child_group_key_epoch: 2
