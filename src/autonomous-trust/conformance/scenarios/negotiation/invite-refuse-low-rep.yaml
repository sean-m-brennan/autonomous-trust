schema_version: "1"
kind: scenario
protocol: negotiation
name: invite-refuse-low-rep
byte_pinning: false
description: |
    Trust-tier refusal path: bob is capable, but the data_fetch
    capability requires trust tier 1 and alice's trust tier (as
    seen by bob) is 0. handle_invite's tier-gate refuses the
    invite. See doc/architecture/trust-tiers.md §7.1.

    Previously this scenario exercised a hierarchy-bucket gate
    (`peer_level == 0 → refuse`); the new gate generalises to
    `peer._tier < cap.required_tier → refuse`, and the original
    "tier 0 refuses" semantics is preserved by setting
    required_tier = 1 on data_fetch.

participants:
  - id: alice
    role: requestor
  - id: bob
    role: worker

fixtures:
  capabilities:
    bob: [data_fetch]
  capability_tiers:
    data_fetch: 1
  peer_tiers:
    alice: 0

steps:
  - id: 1
    from: alice
    to: bob
    function: invitation
    payload:
      capability: data_fetch
      task_id: t-low-rep

  - id: 2
    from: bob
    to: alice
    function: nack
    in_response_to: 1
    payload:
      task_id: t-low-rep
