schema_version: "1"
kind: scenario
protocol: identity
name: business-ad-dedup
byte_pinning: false
description: |
        Content-id dedup (Phase 3 P3.2). An ad is addressed by the blake2b digest of
        its canonical form — advertiser, polity, satisfaction, page seq, ts and the
        page BYTES — so the identical ad arriving twice is the same ad, not news.
        The second copy is dropped after signature verification and BEFORE the
        customer gate, which is what keeps a cohort of customers from echoing one
        page around forever: every re-advertisement is a distinct first-person ad,
        and every duplicate dies where it lands.

        newcomer is a customer here deliberately — dedup is only observable through
        a node that WOULD otherwise speak. Two identical ads in, exactly ONE ad out.
        A mutation that drops the dedup ring emits 2.

        Step 1: bg -> newcomer peer_business_ad {sat: 255, seq: 1, ts: 0}.
          - Both runtimes: verify, record, customer gate emits newcomer's own ad.
        Step 2: the SAME ad again, byte-for-byte.
          - Both runtimes: same content id, already seen, dropped. No second emit.


participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

fixtures:
  # newcomer is a CUSTOMER of the cafe — the edge that authorizes it to carry
  # the page. Declared at satisfaction 3 with the page it already holds at
  # seq 0, so the inbound seq-1 ad is a page UPDATE it picks up and carries.
  customers:
    newcomer:
      "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ":
        sat: 3
        seq: 0
        bundle: '{"page":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ","name":"Corner Cafe","locality":"9q8yyk8y"},"sig":"stub"},"delegation":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"},"sig":"stub"}}'

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_business_ad
    payload:
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      sat: 255
      seq: 1
      ts: 0
      bundle: '{"page":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ","name":"Corner Cafe","locality":"9q8yyk8y"},"sig":"stub"},"delegation":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"},"sig":"stub"}}'
    description: |
        bg's signed ad for its own page.
  - id: 2
    from: bg
    to: newcomer
    function: peer_business_ad
    payload:
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      sat: 255
      seq: 1
      ts: 0
      bundle: '{"page":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ","name":"Corner Cafe","locality":"9q8yyk8y"},"sig":"stub"},"delegation":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"},"sig":"stub"}}'
    description: |
        The identical ad a second time; its content id is already in the ring.

expected_state:
  newcomer:
    business_page:
      "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ":
        seq: 1
        endorsers: 0
    customer_satisfaction:
      "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ": 3
    business_ads_emitted: 1
