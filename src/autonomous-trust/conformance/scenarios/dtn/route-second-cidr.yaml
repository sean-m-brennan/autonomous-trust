schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "route-second-cidr"
description: |
  Legs are tried in order; the second CIDR takes its own subnet.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "route"
    inners:
      - kind: "udp_net_4"
        match_cidr: "10.0.0.0/24"
      - kind: "udp_net_4"
        match_cidr: "172.20.0.0/16"
    target: "172.20.5.10"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "route"
    description: "trigger: route"
expected_state:
  host:
    leg: 1
