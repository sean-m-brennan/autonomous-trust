schema_version: "1"
kind: "scenario"
protocol: "contacts"
name: "invitation-expired-rejected"
description: |
  An invitation past its expiry is refused even though its signature is valid (a fixed past expiry, so the result is clock-independent).
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  contacts:
    op: "redeem"
    blob: ""
    in_person: false
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "redeem"
    description: "trigger: redeem"
expected_state:
  host:
    redeem_status: "expired"
