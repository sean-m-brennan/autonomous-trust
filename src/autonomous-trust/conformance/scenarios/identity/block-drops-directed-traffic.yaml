schema_version: "1"
kind: scenario
protocol: identity
name: block-drops-directed-traffic
byte_pinning: false
description: |
    A blocked peer's DM does not reach us (Phase 4 P4.1).

    DMs were never tier-gated at all — the C handler says so outright ("no
    connection/tier gate — that gates the feed") — so the block's tier clamp
    could not touch them even in principle. A blocked peer could keep writing,
    and every message landed.

    DROPPED, not hidden: nothing is stored and nothing is accrued. A DM has no
    third party whose interest is served by our keeping it, which is the line
    this increment draws between directed traffic and gossiped traffic. A
    blocked peer's POST is hidden-but-relayed, because withholding a
    community's feed traffic because one member muted the author is community
    content policy, not a personal block.

    The drop happens AFTER the freshness window advances, deliberately. If it
    came first, every DM sent during a block would replay the moment the block
    was lifted.

    bob is the control: unblocked, same verb, same run, and his DM must land.

    Requires CONFORMANCE_SOCIAL=1, or the C side skips and diff_results scores
    a one-side skip as a match.

participants:
  - id: node
    role: border_guard
  - id: alice
    role: group_member
  - id: bob
    role: group_member

steps:
  - id: 1
    from: node
    to: node
    function: trigger_block
    payload:
      peer: alice
    description: node locally blocks alice. Nothing on the wire; alice is told nothing.
  - id: 2
    from: alice
    to: node
    function: peer_dm
    payload:
      text: you blocked me and I am still here
      seq: 1
    description: |
        alice writes anyway. Before P4.1 this was recorded on both runtimes —
        a DM has no tier gate for a clamp to act on.
  - id: 3
    from: bob
    to: node
    function: peer_dm
    payload:
      text: an ordinary message
      seq: 1
    description: The control. bob is not blocked, so his DM must be recorded.

expected_state:
  node:
    dm_last:
      alice:
        absent: true
      bob:
        seq: 1
        text: an ordinary message
    social_tx_last:
      alice:
        absent: true
