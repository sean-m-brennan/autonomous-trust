# Read by at-wifi.service beside /boot/wpa_supplicant.conf (wpa_supplicant -I).
#
# The ad-hoc cell AT nodes fall back to when the router in
# /boot/wpa_supplicant.conf is out of range or absent. wpa_supplicant joins it,
# or starts it, only when no network of higher priority is in the scan, and
# every network without a priority line has priority 0. Every node built from
# this image uses the same SSID, channel and BSSID, so that nodes that start
# the cell apart still form one cell. The BSSID is fixed because two nodes that
# each start a cell with a random one may never merge.
#
# The cell is open: AT signs and encrypts its own traffic, and the CYW43455
# driver (brcmfmac) does not do RSN in ad-hoc mode. The 2.4 GHz channel 6 is
# allowed for ad-hoc use in every regulatory domain; 5 GHz channels mostly
# are not.
#
# wpa_cli and at-wifi-prefer-ap talk to wpa_supplicant through this socket.

ctrl_interface=/run/wpa_supplicant

network={
    ssid="autonomous-trust"
    mode=1
    frequency=2437
    bssid=02:41:54:00:00:01
    key_mgmt=NONE
    priority=-100
}
