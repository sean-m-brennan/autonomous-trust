schema_version: "1"
kind: scenario
protocol: replication
name: challenge-session
byte_pinning: false
description: |
    The live bisection game (RD_12.6_LIVE_REPLICATION_PLAN.md §3.5, Phase 2).
    The `bisection` scenario holds both traces whole. A live verifier holds
    only each executor's commitment, (trace_len, trace_root), and asks for one
    digest at a time, narrowing an interval whose chains agree at lo - 1 and
    differ at hi until it reaches the first divergent step k. Then each
    executor reveals h(k-2), s(k-1) and s(k); the verifier checks them against
    that executor's own claimed digests and re-executes step k once from the
    verified pre-state. The reference stands in for that re-execution here
    (past its end, the computation is over).

    The runtimes must ask for the same indices in the same order, or an
    executor's exposure would depend on which implementation checked it, and
    must reach the same verdicts. What each row pins:

      - Row 1: honest against a cheater departing at step 2. Asked 3, 1, 2.
      - Row 2: the cheater LIES at midpoint 3, claiming the honest digest. The
        lie moves the search to k = 4, where the cheater must reveal a
        pre-state hashing to the agreed h(3); its real s(3) does not, so it is
        outvoted. A lie about a midpoint buys nothing.
      - Row 3: two cheaters wrong at the same step in different ways. Both
        are outvoted: the reference, not either executor, is the truth.
      - Row 4: one executor stops at five steps of eight. The shorter has no
        state at 5, so the chains differ there by definition; the longer is
        asked for its digest at 5 (the final fetch), and since the computation
        goes on, the one that stopped is outvoted.
      - Row 5: one executor computes a step past the end. The reference ends
        at 5, so the extra step is the one outvoted. Its root already is its
        digest at 5, so no final fetch is needed.
      - Row 6: identical traces. No dispute, nothing asked, both corroborated.
      - Row 7: a reveal that contradicts its own commitment (the state it
        shows at k is not the one it hashed) is outvoted.
      - Row 8: a state over max_state_bytes breaks the replay contract, so
        both executors here are outvoted.
      - Row 9: divergence at step 0. Each executor's s(0) is checked against
        its own h(0) and against the agreed input.
      - Rows 11-12: a revealed pre-state that does not hash to the agreed
        h(k-1) contradicts the executor's own commitment, even when its s(k)
        is right; with no verified pre-state at all there is nothing to
        re-execute from, and both are outvoted.
      - Row 10: 600-byte states, with the committed roots pinned. The C
        chain used to copy each state into a 576-byte buffer and silently
        dropped the rest, so its roots differed from Python's for any state
        over 512 bytes.

participants:
  - id: requestor
    role: new_node
  - id: worker
    role: peer

fixtures:
  replication:
    version: 1
    default_prob: 0.05

  events:
    # 1 honest vs cheater
    - challenge:
        traces:
          honest: [s0, s1, s2, s3, s4, s5, s6, s7]
          cheater: [s0, s1, X2, X3, X4, X5, X6, X7]
        reference: [s0, s1, s2, s3, s4, s5, s6, s7]
      asked: [3, 1, 2]
      divergence_index: 2
      verdicts: {honest: corroborated, cheater: outvoted}
      scores: {honest: [0.9, replication], cheater: [0.1, replication]}

    # 2 a lying midpoint moves k and convicts the liar anyway
    - challenge:
        traces:
          honest: [s0, s1, s2, s3, s4, s5, s6, s7]
          cheater: [s0, s1, X2, X3, X4, X5, X6, X7]
        lies:
          cheater: {"3": "04bfaa5c9dcfaa6211749862fc2728902e24f3414623203c5a34e4f52f9b2622"}
        reference: [s0, s1, s2, s3, s4, s5, s6, s7]
      asked: [3, 5, 4]
      divergence_index: 4
      verdicts: {honest: corroborated, cheater: outvoted}

    # 3 both wrong at the divergent step
    - challenge:
        traces:
          left: [s0, s1, L2, L3]
          right: [s0, s1, R2, R3]
        reference: [s0, s1, s2, s3]
      asked: [1, 2]
      divergence_index: 2
      verdicts: {left: outvoted, right: outvoted}

    # 4 one stops short of the end
    - challenge:
        traces:
          full: [s0, s1, s2, s3, s4, s5, s6, s7]
          short: [s0, s1, s2, s3, s4]
        reference: [s0, s1, s2, s3, s4, s5, s6, s7]
      asked: [2, 4, 5]
      divergence_index: 5
      verdicts: {full: corroborated, short: outvoted}

    # 5 one computes past the end
    - challenge:
        traces:
          overrun: [s0, s1, s2, s3, s4, extra]
          exact: [s0, s1, s2, s3, s4]
        reference: [s0, s1, s2, s3, s4]
      asked: [2, 4]
      divergence_index: 5
      verdicts: {overrun: outvoted, exact: corroborated}

    # 6 no dispute
    - challenge:
        traces:
          one: [s0, s1, s2]
          two: [s0, s1, s2]
        reference: [s0, s1, s2]
      asked: []
      divergence_index: null
      verdicts: {one: corroborated, two: corroborated}

    # 7 a reveal that contradicts its own commitment
    - challenge:
        traces:
          honest: [s0, s1, s2, s3]
          cheater: [s0, s1, X2, X3]
        reveal:
          cheater: {state: s2}
        reference: [s0, s1, s2, s3]
      divergence_index: 2
      verdicts: {honest: corroborated, cheater: outvoted}

    # 8 a state over the declared bound
    - challenge:
        traces:
          honest: [s0, s1, long-state-2, s3]
          cheater: [s0, s1, X2, X3]
        reference: [s0, s1, long-state-2, s3]
        max_state_bytes: 4
      divergence_index: 2
      verdicts: {honest: outvoted, cheater: outvoted}

    # 9 divergence at the first step
    - challenge:
        traces:
          honest: [s0, s1]
          cheater: [X0, s1]
        reference: [s0, s1]
      asked: [0]
      divergence_index: 0
      verdicts: {honest: corroborated, cheater: outvoted}

    # 11 a revealed pre-state that does not hash to the agreed digest
    - challenge:
        traces:
          sloppy: [s0, s1, s2, s3]
          cheater: [s0, s1, X2, X3]
        reveal:
          sloppy: {pre: not-s1}
        reference: [s0, s1, s2, s3]
      divergence_index: 2
      verdicts: {sloppy: outvoted, cheater: outvoted}

    # 12 the same for both: no verified pre-state to re-execute from
    - challenge:
        traces:
          left: [s0, s1, s2, s3]
          right: [s0, s1, X2, X3]
        reveal:
          left: {pre: not-s1}
          right: {pre: not-s1}
        reference: [s0, s1, s2, s3]
      divergence_index: 2
      verdicts: {left: outvoted, right: outvoted}

    # 10 long states hash identically in both runtimes
    - bisect:
        traces:
          honest: [, ]
          cheater: [, ]
        reference: [, ]
      roots:
        honest: 7903dde8aa663c3625d493f3e69f10a2801c8f59bd1e2e85a1ca510f06b77e42
        cheater: 953536ae4fefa1542ea332eafc3eca745d0bf9bf0bf1a49f4f93739d651e01c1
      divergence_index: 1
      verdicts: {honest: corroborated, cheater: outvoted}
    - challenge:
        traces:
          honest: [, ]
          cheater: [, ]
        reference: [, ]
      asked: [0]
      divergence_index: 1
      verdicts: {honest: corroborated, cheater: outvoted}

steps:
  - id: 1
    from: requestor
    to: requestor
    function: replay_events
    description: |
        Replay the events against this runtime's challenge session.
