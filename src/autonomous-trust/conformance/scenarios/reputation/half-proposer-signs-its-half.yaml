schema_version: "1"
kind: scenario
protocol: reputation
name: half-proposer-signs-its-half
byte_pinning: false
description: |
    Signed halves (R+D.md §14.2; doc/architecture/reputation.md, "Signed
    halves"). A commit certificate is the acceptors' word that a round ran; a
    half also carries its scorer's own signature over AT-HALF, which names the
    counterparty, and two halves pair only when each names the other.

    alice's round for t-1 names bob as its counterparty. bob accepts, a
    majority of three with alice, so alice pools her half, signed by her and
    naming bob.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: proposer

fixtures:
  proposals:
    alice:
      - id1: 1000
        id2: 1
        task_id: t-1
        score: 0.8
        names: bob

steps:
  - id: 1
    from: alice
    to: bob
    function: transaction
    payload:
      id1: 1000
      id2: 1
      proposer: alice
      task_id: t-1
      score: 0.8

  - id: 2
    from: bob
    to: alice
    function: tx accepted
    in_response_to: 1
    payload:
      id1: 1000
      id2: 1
      proposer: alice

expected_state:
  alice:
    halves_held: 1
    signed_halves: 1
