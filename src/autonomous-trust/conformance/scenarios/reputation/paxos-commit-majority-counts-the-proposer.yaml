schema_version: "1"
kind: scenario
protocol: reputation
name: paxos-commit-majority-counts-the-proposer
byte_pinning: false
description: |
    A Paxos round commits on a strict majority of the group, the proposer
    counted (doc/architecture/reputation.md, "Agreeing on a history"). alice,
    bob and carol are three members. alice's transaction went out, which is
    her own acceptance, and bob accepts it. Two of three is a majority, so
    alice writes her half. carol never answers.

    Before this rule a commit needed more than len(peers) // 2 acceptances
    with the proposer left out: both of alice's peers here. So one stopped
    member of three blocked every commit the other two proposed.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: acceptor

fixtures:
  requests:
    bob:
      - [1000, 1]
  my_requests:
    alice:
      - id1: 1000
        id2: 1
        task_id: t-1
        score: 0.8

steps:
  - id: 1
    from: alice
    to: bob
    function: transaction
    payload:
      id1: 1000
      id2: 1
      proposer: alice
      task_id: t-1
      score: 0.8

  - id: 2
    from: bob
    to: alice
    function: tx accepted
    in_response_to: 1
    payload:
      id1: 1000
      id2: 1
      proposer: alice

expected_state:
  alice:
    halves_held: 1
