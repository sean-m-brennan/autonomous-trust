schema_version: "1"
kind: scenario
protocol: identity
name: position-replay-rejected
byte_pinning: false
description: |
    Freshness on the coarse-position response (Increment 2, the "with-distance"
    feature). A peer_position_response carries a freshness `seq`; a captured
    response replayed with a stale (non-increasing) seq must be REFUSED, not
    stored — otherwise an eavesdropper could pin a peer to an old, wrong
    location. Both replayed values below are VALID geohashes, so the refusal is
    attributable to the freshness gate alone, never to charset validation.

    Step 1: bg -> newcomer peer_position_response {pos: u4pruy, seq: 2}.
      - Both runtimes: accepted (first stamp), stored under bg's uuid.
    Step 2: bg -> newcomer peer_position_response {pos: gcpvj0, seq: 1}.
      - Both runtimes: seq 1 is not above the mark (2), so freshness.accept /
        freshness_accept refuses it; the stored bucket stays u4pruy and the
        per-verb refusal tally ticks once.

    Assertions: newcomer.peer_position[bg] is still the FIRST value (the replay
    did not overwrite it), and freshness_refusals[peer_position_response]=1 (the
    positive observable — the second delivery was refused by the mark, not
    silently coalesced). id_state's refusal tally is process-global, so exactly
    one participant does the refusing here.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_position_response
    payload:
      pos: u4pruy
      seq: 2
    description: bg's genuine position; newcomer records it.
  - id: 2
    from: bg
    to: newcomer
    function: peer_position_response
    payload:
      pos: gcpvj0
      seq: 1
    description: |
        A replayed/stale response (seq below the mark). Refused; the stored
        position must not change to the spoofed bucket.

expected_state:
  newcomer:
    peer_position:
      bg: u4pruy
    freshness_refusals:
      peer_position_response: 1
