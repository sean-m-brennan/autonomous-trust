schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "endpoints-pre-join"
description: |
  Before a group is joined, the broadcast and group endpoints sit on the pre-join group EID ("AT-boot" plus a NUL).
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "endpoints"
    node_uuid: "aabbccdd-1122-4000-8000-000000000001"
    group_uuid: null
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "endpoints"
    description: "trigger: endpoints"
expected_state:
  host:
    endpoints:
      - ["dtn://at-aabbccdd/peer", "/peer"]
      - ["dtn://at-group-41542d626f6f7400/bcast", "/bcast"]
      - ["dtn://at-group-41542d626f6f7400/group", "/group"]
    group_joined: false
