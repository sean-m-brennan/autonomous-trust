syntax = "proto3";

package autonomous_trust.core.protobuf.services;

message Position {
  double x = 1;
  double y = 2;
  optional double z = 3;
}

message GeoPosition {
  double lat = 1;
  double lon = 2;
  optional double alt = 3;
}

message UTMPosition {
  string zone = 1;
  double easting = 2;
  double northing = 3;
  optional double alt = 4;
}
