name: Conformance Corpus

# Runs the dual-language conformance harness on push/PR. The
# autonomous_trust repo ships two parallel impls (Python and C) of the
# same protocols and the conformance corpus pins their behavior
# bit-for-bit (within v1's byte_pinning: false semantic-equality
# scope). This workflow gates merges by:
#   1. Building + running the C harness over the full corpus.
#   2. Running the Python harness over the same corpus.
#   3. Diffing the two JSON result files via
#      `conformance.harness.common.diff_results` — fails the run if
#      any case has an asymmetric outcome between the two impls
#      (e.g. one passes, one fails) or if --strict-coverage flags a
#      corpus case neither side recorded.
#
# The environment is provisioned with conda (Miniforge + mamba) from the
# project's own two env files so CI matches local dev exactly:
#   * config/cfg/environment.yml   — runtime + C build deps (cmake,
#     libsodium, jansson, libuuid, check, protobuf, libprotobuf,
#     protobuf-c >=1.5.2 [ships the protoc-gen-c plugin the C harness's
#     `protoc --c_out` codegen needs], plus the Python runtime deps the
#     harness imports).
#   * config/cfg/devel_environ.yml — dev/test tooling layered on top
#     (tox, pytest, pytest-asyncio/cov, jsonschema, clang/clangxx/lld,
#     pkg-config). Both files share `name: autonomous_trust`, so the
#     second is applied via `conda env update`.
# This replaces the prior apt+pip provisioning, which lacked
# protobuf-c / protoc-gen-c (apt installed only protobuf-compiler) and
# could not supply the C libs from pip.
#
# Local equivalent: `bash scripts/test-conformance.sh --c --strict-coverage`.
#
# When the parent (`sustainable_space/`) CI pipeline materializes,
# the meta-step referenced in CONFORMANCE_PLAN.md §CI Integration
# can call this workflow via `workflow_run` or duplicate the
# `diff_results` invocation against the artifacts uploaded here.

on:
  push:
    branches: [master, main, 'feature/**']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # Login shell so `conda activate` (set up by setup-miniconda) is
        # in effect for every `run:` step.
        shell: bash -el {0}
    env:
      # Keep downloaded packages in a cacheable location.
      CONDA_PKGS_DIRS: ~/conda_pkgs_dir
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-pkgs-${{ runner.os }}-${{ hashFiles('config/cfg/environment.yml', 'config/cfg/devel_environ.yml') }}
          restore-keys: |
            conda-pkgs-${{ runner.os }}-

      - name: Set up conda env from environment.yml (Miniforge + mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: autonomous_trust
          environment-file: config/cfg/environment.yml
          use-mamba: true
          auto-activate-base: false

      - name: Layer dev/test deps from devel_environ.yml
        # Same env name (autonomous_trust); --prune keeps it consistent
        # with the union of both spec files.
        run: mamba env update -n autonomous_trust -f config/cfg/devel_environ.yml

      - name: Show toolchain
        run: |
          conda info --envs
          python --version
          cmake --version | head -1
          protoc --version || echo "protoc missing"
          command -v protoc-gen-c && echo "protoc-gen-c: $(command -v protoc-gen-c)" || echo "protoc-gen-c missing"
          clang --version | head -1 || echo "clang missing"

      - name: Generate protobuf Python interfaces
        # autonomous_trust.core.protobuf is protoc-generated (gitignored, so
        # absent on a fresh checkout). The Python harness imports the core
        # package, which imports these modules; without them collection fails
        # with `ModuleNotFoundError: No module named 'autonomous_trust.core.protobuf'`.
        # `proto-only` runs just the `protoc --python_out` codegen (+ package
        # __init__ files), skipping the poetry/sdist build.
        run: bash scripts/build-py.sh proto-only

      - name: Run conformance harnesses (Python, then C) and diff
        # The script's `--c` mode builds+runs the C harness and diffs it
        # against the most recent Python results JSON — so the Python harness
        # must run FIRST to produce that file (otherwise the diff silently
        # skips). Two invocations:
        #   1. Python harness in the active conda env. CONFORMANCE_SKIP_TOX=1
        #      forces the direct-pytest path so the conda interpreter (with
        #      the harness deps from environment.yml) is what's exercised,
        #      rather than tox's isolated re-pip venv.
        #   2. C harness build+run, then the cross-language diff with
        #      --strict-coverage (fails if any corpus case is missing from
        #      either side).
        #
        # Use the conda toolchain + libs consistently for the C build: point
        # CMake at the active env prefix (the bare conda LLVM/lib packages
        # don't install an activation script that sets CMAKE_PREFIX_PATH),
        # build with the env's clang, and make the conda .so closure
        # resolvable at run time. OpenSSL from conda enables the AT_ZTA build
        # path, pinning the zta-* scenarios symmetrically.
        env:
          CONFORMANCE_SKIP_TOX: '1'
        run: |
          export CC=clang CXX=clang++
          export CMAKE_PREFIX_PATH="${CONDA_PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}"
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          bash scripts/test-conformance.sh --python --strict-coverage
          bash scripts/test-conformance.sh --c --strict-coverage

      - name: Upload Python conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-python-results
          path: src/autonomous-trust/conformance/results/python-*.json
          if-no-files-found: warn

      - name: Upload C conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-c-results
          path: src/c/build/conformance/results/c-latest.json
          if-no-files-found: warn
