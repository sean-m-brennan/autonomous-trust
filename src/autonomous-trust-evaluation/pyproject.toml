[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "autonomous_trust_evaluation"
version = "0.2.1"
description = "AutonomousTrust Evaluation - red team, metrics, generators, and scenario tools"
authors = ["Sean M Brennan <sean.brennan@tekfive.com>"]
readme = "README.md"
packages = [{include = "autonomous_trust"}]
#license = "Proprietary"
exclude = ["**/__pycache__"]

[project]
name = "autonomous_trust_evaluation"
version = "0.2.1"

[tool.poetry.dependencies]
python = "^3.13"
autonomous-trust = ">=0.2.1"
autonomous-trust-services = ">=0.2.1"
autonomous-trust-simulator = ">=0.2.1"
autonomous-trust-inspector = ">=0.2.1"
flask = '>=3.0,<3.2'
dash = '>=4.0.0'
dash-bootstrap-components = '>=2.0.0'
dash-iconify = '>=0.1.2'
pyyaml = '>=6.0'
plotly = ">=5.9.0"
