schema_version: "1"
kind: scenario
protocol: agreement
name: pos-vote-replay-tight-margin-flips
byte_pinning: false
description: |
    POS replay-handling probe (tight margin). Companion to
    `pos-vote-replay-outcome-invariant`. That case picked a wide
    stake margin where neither impl's outcome could change under
    vote-replay; this case picks a TIGHT margin where the outcome
    USED TO flip, and now must NOT — this is the regression pin in
    the opposite direction that the note below anticipated.

    HARDENED 2026-08-21: both impls now dedup by voter on the count
    path (Python `AgreementProtocol.finalize`, C `agreement_finalize`),
    so bob's replayed nay is counted exactly once and the outcome
    stays at the single-delivery value, TRUE.

    Setup:
      voters: alice (stake 10), bob (stake 6)
      myself: bob (so myself != blob.originator, no short-circuit)
      blob.originator: alice
      Votes: alice YES, bob NO with repeat: 2

    Counting walk-through:
      Python `AgreementByStake._count_vote`
      (`autonomous_trust/.../algorithms/stake.py:35-40`) adds
      voter's stake to `yea` or `nay` per call. `_accumulate_votes`
      returns `self.yea > self.nay`.
      C `_stake_count_vote` (`src/c/autonomous_trust/algorithms/
      agreement.c:208-222`) and `_stake_accumulate` are byte-equal
      in semantics.

      Single delivery:
        approvals iterated: [(alice, yes, +10), (bob, no, +6)]
        → yea=10, nay=6 → 10 > 6 → outcome: TRUE

      Replay (repeat: 2 on bob's nay), BEFORE hardening:
        approvals iterated: [(alice, yes, +10), (bob, no, +6),
                             (bob, no, +6)]
        → yea=10, nay=12 → 10 > 12 → outcome: FALSE

      Replay (repeat: 2 on bob's nay), AFTER hardening:
        bob's second ballot hits the per-voter dedup and is skipped
        approvals iterated: [(alice, yes, +10), (bob, no, +6)]
        → yea=10, nay=6 → 10 > 6 → outcome: TRUE

    What this scenario documents at the conformance gate:
      - POS is now replay-resistant at a tight margin: the replayed
        nay no longer flips the outcome.
      - Both impls dedup the SAME way (no asymmetry). Python dedups
        after its signature check in `finalize`; C's votes cleared
        `pre_verify` at store time, so in both runtimes claiming a
        voter's slot costs that voter's key — dedup can't be used to
        suppress a real ballot with a forged one.
      - The dedup set is scoped to one tally and dies with it, so a
        genuine later round for the same blob starts clean (see
        `late-vote-after-finalize`).

    Pairs with `pos-vote-replay-outcome-invariant`:
      - The wide-margin case proves outcome doesn't change when
        the margin is wide enough.
      - This case proves outcome DOES change when the margin is
        tight enough.
      Together they pin the full set of replay behaviors POS
      exhibits today.

participants:
  - id: alice
    role: voter
  - id: bob
    role: voter

fixtures:
  impl: stake
  stakes:
    alice: 10
    bob: 6
  myself: bob
  blobs:
    blob-x:
      originator: alice
      payload: "tight-margin-replay-payload"

steps:
  - id: 1
    from: alice
    to: agreement
    function: vote
    payload:
      blob: blob-x
      approval: true
    description: alice (stake 10) approves blob-x.

  - id: 2
    from: bob
    to: agreement
    function: vote
    payload:
      blob: blob-x
      approval: false
    repeat: 2
    description: |
        bob (stake 6) rejects blob-x — delivered TWICE. Both impls
        dedup by voter, so nay accumulates 6 once. Yea=10 > 6 →
        outcome stays at the single-delivery TRUE.

expected_state:
  agreement:
    blob-x:
      outcome: true
