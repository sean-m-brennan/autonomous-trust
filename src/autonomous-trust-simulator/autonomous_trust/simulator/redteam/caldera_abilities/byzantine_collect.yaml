- id: at-byzantine-collect-001
  name: AT Byzantine Node - Collect Metrics
  description: Collect Byzantine node detection metrics from AT simulation
  tactic: collection
  technique:
    attack_id: T1005
    name: Data from Local System
  executors:
    - name: sh
      platform: linux
      command: >
        python -m autonomous_trust.simulator.redteam.caldera_bridge
        --attack byzantine --action collect
        --config /tmp/caldera-config/attack-config.json
      timeout: 120
