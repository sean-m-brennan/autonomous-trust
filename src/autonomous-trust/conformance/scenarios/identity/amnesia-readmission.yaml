schema_version: "1"
kind: scenario
protocol: identity
name: amnesia-readmission
byte_pinning: false
description: |
    A MEMBER of bg's group, known by the same UUID and keys, re-announces
    itself after losing its state. welcoming_committee detects this as the
    amnesia branch and calls `_peer_accepted(amnesia=True)` synchronously: no
    vote. Tests the simpler welcoming_committee path and the cascade of
    confirm + accept + history outbound messages.

    Membership is the precondition (`amnesia_member`). Until 2026-10-19 this
    case seated the returning node in bg's peer list only, which was the hole:
    a peer that is not a member (a first-contact direct
    peer) was handed the group key with no vote. See
    amnesia-direct-peer-not-readmitted.

    See doc/architecture/identity-protocol.md, "Amnesia".

participants:
  - id: bg
    role: border_guard
  - id: returning
    role: new_node

fixtures:
  amnesia_member: true

steps:
  - id: 1
    from: returning
    to: bg
    function: request_access
    description: |
        Returning peer broadcasts an announce. bg already knows this UUID as
        a member (amnesia_member seats it in bg's peer list and group).

  - id: 2
    from: bg
    to: broadcast
    function: peer_accepted
    in_response_to: 1
    description: |
        bg's _peer_accepted emits a confirm to the group on the encrypted
        broadcast channel.

  - id: 3
    from: bg
    to: returning
    function: access_granted
    in_response_to: 1
    description: |
        bg sends its own identity in the open so the returning peer can
        encrypt subsequent traffic.

  - id: 4
    from: bg
    to: returning
    function: full_history
    in_response_to: 1
    description: |
        bg sends the group key and history; returning peer can now decrypt
        group-encrypted messages.

expected_state:
  bg:
    phase: 3
    # Readmitted without a vote.
    propose_emitted: 0
