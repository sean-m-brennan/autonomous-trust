schema_version: "1"
kind: scenario
protocol: reputation
name: commit-cert-named-previous-roster-pooled
byte_pinning: false
description: |
    A commit certificate names the roster it was collected under
    (doc/architecture/reputation.md, "Commit certificates"). bob's roster grew
    from alice, bob, carol and dave to six members, so his roster in force
    needs three signatures besides the scorer's. alice was one roster behind:
    carol and dave signed her half, a majority of the first roster, and her
    commit names that roster. It was in force within the last 32 instances of
    bob's chain, so bob judges the certificate by it and pools the half.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: member
  - id: dave
    role: member
  - id: erin
    role: member
  - id: frank
    role: member

fixtures:
  roster: {}
  local_chain:
    bob:
      - {roster: genesis, members: [alice, bob, carol, dave]}
      - {roster: add, member: erin}
      - {roster: add, member: frank}

steps:
  - id: 1
    from: alice
    to: bob
    function: tx committed
    payload:
      task_id: t-1
      score: 0.8
      cosigners: [carol, dave]
      cert_roster: [alice, bob, carol, dave]

expected_state:
  bob:
    pool_tasks: [t-1]
