schema_version: "1"
kind: scenario
protocol: reputation
name: place-outranked-not-accepted
byte_pinning: false
description: |
    Ordered placement (doc/architecture/reputation.md, "Agreeing on an
    order"): classic Paxos decides what the chain holds from each index.
    bob has promised (9, carol). alice's value under (5, alice) is below it, so
    bob does not accept it: a lower ballot cannot overwrite what a higher one may
    already have decided.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: member
  - id: dave
    role: member

fixtures:
  place_promised:
    bob: {n: 9, by: carol}

steps:
  - id: 1
    from: alice
    to: bob
    function: place
    payload:
      k: 0
      ballot: {n: 5, by: alice}
      head: ""
      value:
          - {task_id: t-1, p1: carol, p1_score: 0.9, p2: dave, p2_score: 0.7}
  - id: 2
    from: bob
    to: alice
    function: place accepted
    in_response_to: 1
    expect_none: true
    payload: {}

expected_state:
  bob:
    place_promised: {n: 9, by: carol}
