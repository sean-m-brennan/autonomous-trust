schema_version: "1"
kind: scenario
protocol: reputation
name: catchup-placed-end-not-rewritten
byte_pinning: false
description: |
    Ordered placement (doc/architecture/reputation.md, "Agreeing on an
    order"): a placed chain carries each placement's certificate on its last
    entry, with the index the placement began at, so a node catching up checks
    every placement it is handed, against its own view of the group (a strict
    majority, here three of four). Then a placement decides, not a length.

    bob holds a certified placement of two entries. alice's chain is longer
    but holds no placement, and it forks from bob's at index 0. Nothing below
    bob's placed end is rewritten, so bob keeps his chain whatever the
    lengths.

participants:
  - id: alice
    role: provider
  - id: bob
    role: consumer
  - id: carol
    role: member
  - id: dave
    role: member

fixtures:
  ordered_placement: true
  local_chain:
    bob:
      - {task: a, p1: 0.7, p2: 0.5, batch: 1}
      - {task: b, p1: 0.9, p2: 0.3, batch: 1, placed_by: [alice, bob, carol]}

steps:
  - id: 1
    from: alice
    to: bob
    function: latest update
    payload:
      chain:
        - {task: p, p1: 0.1, p2: 0.1, certified_by: [alice, carol, dave]}
        - {task: q, p1: 0.2, p2: 0.2, certified_by: [alice, carol, dave]}
        - {task: r, p1: 0.3, p2: 0.3, certified_by: [alice, carol, dave]}
        - {task: s, p1: 0.4, p2: 0.4, certified_by: [alice, carol, dave]}

expected_state:
  bob:
    chain_entries: [a, b]
