schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "route-slash-zero-takes-no-eid"
description: |
  A /0 IPv4 CIDR takes every IPv4 address and no EID.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "route"
    inners:
      - kind: "udp_net_4"
        match_cidr: "0.0.0.0/0"
    target: "dtn://x/"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "route"
    description: "trigger: route"
expected_state:
  host:
    leg: -1
