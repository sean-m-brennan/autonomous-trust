schema_version: "1"
kind: scenario
protocol: negotiation
name: invite-replay-survives
byte_pinning: false
description: |
    Invitation replay: alice's `invitation` is delivered to bob twice via the
    universal scenario engine's `repeat: N` grammar, which builds the inbound
    ONCE and dispatches it N times — the same wire bytes, which is what a
    replay actually is. The first delivery admits the task; the second is
    refused, silently, by the freshness gate.

    What changed. An invitation is the negotiation verb that asks a peer to RUN
    something, and its payload — a serialized task — used to carry no freshness
    token of any kind. Both runtimes counted every delivery, so a captured
    invitation could be re-presented for as long as the flood counter tolerated
    it. The task now carries `seq`: the requestor's monotonic per-process
    counter (`core/freshness.py`, `utilities/freshness.h`), field 12 of
    `negotiation/task.proto` and the `"seq"` key of the JSON form. The receiver
    keeps a per-(sender, verb) high-water mark and refuses anything at or below
    it. `repeat: 2` therefore delivers seq 1 twice: accepted, then refused.

    The gate sits AHEAD of the per-task flood counter, which is what
    `flood_count: 1` pins. Behind it, the replays would drive the counter past
    `max_task_duplicates = 5` and make bob emit a `refusal` — which alice reads
    as "this worker is out" (`_cancel_participant`). That would turn a replay
    into a way of evicting a worker from a task it had already accepted. Past
    the gate the counter counts what it was built to count: distinct, freshly
    stamped invitations for one task, which is `invite-flood-past-threshold`.

    The refusal is silent. Answering a replay would spend a message on a sender
    we cannot vouch for and tell an attacker where our mark sits, so nothing is
    emitted for the second delivery — pinned by step 2's absence of any second
    `ack`, and by the outbox comparison the engine runs across both runtimes.

    The scenario name is unchanged from before the fix and still reads true:
    bob's `handle_invite` survives the duplicate, and the task stays admitted.
    Names are cited identifiers here, so it keeps the one it has (same call as
    `pos-vote-replay-tight-margin-flips`).

    Limitations, inherited and still true:
      - The Python adapter's `task_in_stack` check is boolean ("stack
        non-empty"); it does not count entries, so it is `flood_count`, not
        `task_in_stack`, that carries the once-only evidence here.
      - The C scenario_engine's negotiation expected_state hook enforces the
        same keys, but a double-push of one task would show up in neither.

participants:
  - id: alice
    role: requestor
  - id: bob
    role: worker

fixtures:
  capabilities:
    bob: [data_fetch]

steps:
  - id: 1
    from: alice
    to: bob
    function: invitation
    payload:
      capability: data_fetch
      task_id: t-replay
      seq: 1
    repeat: 2
    description: |
        alice invites bob to perform data_fetch. The envelope is built once and
        delivered twice, both carrying seq 1. Delivery 1 is fresh (bob's mark
        for (alice, invitation) is 0) and is accepted. Delivery 2 is at the
        mark and is dropped before the flood counter, with no reply.
  - id: 2
    from: bob
    to: alice
    function: ack
    in_response_to: 1
    no_propagate: true
    description: |
        Assertion-only: an `ack` (NegotiationProtocol.acceptance) appears in
        step 1's captured outbox — the genuine first delivery was accepted.
        `no_propagate: true` keeps this an observation step. The engine's
        cross-runtime outbox comparison is what pins that there is exactly one
        emission and no `nack`.

expected_state:
  bob:
    task_in_stack: true
    flood_count:
      task: t-replay
      count: 1
