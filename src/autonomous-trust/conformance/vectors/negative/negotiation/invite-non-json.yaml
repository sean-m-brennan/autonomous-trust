schema_version: "1"
kind: negative
protocol: negotiation
name: invite-non-json
description: |
    Replace alice's negotiation `invitation` wire buffer with the 15
    ASCII bytes "not_json_at_all". Parser must reject as
    envelope_malformed — companion to identity/request-access-non-json
    on a negotiation envelope. Confirms the new `op: replace
    target: wire_bytes` path dispatches identically across protocols.

based_on: scenarios/negotiation/invite-accept.yaml

mutation:
  step_id: 1
  op: replace
  target: wire_bytes
  content_hex: "6e6f745f6a736f6e5f61745f616c6c"

expected:
  reason_class: envelope_malformed
