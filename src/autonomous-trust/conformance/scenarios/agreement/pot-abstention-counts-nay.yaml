schema_version: "1"
kind: scenario
protocol: agreement
name: pot-abstention-counts-nay
byte_pinning: false
description: |
    An eligible voter that does not vote counts against approval
    (RD_13.1 D3), keeping the default-deny that poa-leader-abstains pins
    for PoA.

    Setup: the five voters of pot-climbed-leader-outvoted, all eligible
    under the default floor. Only bob and carol vote, both approve; the
    other three are silent. 2 of 5 is not a majority, so false.

participants:
  - id: alice
    role: voter
  - id: bob
    role: voter
  - id: carol
    role: voter
  - id: dave
    role: voter
  - id: erin
    role: voter

fixtures:
  impl: trust
  tiers:
    alice: 4
    bob: 2
    carol: 2
    dave: 1
    erin: 1
  myself: erin
  blobs:
    blob-x:
      originator: bob
      payload: "abstention-payload"

steps:
  - id: 1
    from: bob
    to: agreement
    function: vote
    payload:
      blob: blob-x
      approval: true
    description: |
        bob (tier 2) approves.
  - id: 2
    from: carol
    to: agreement
    function: vote
    payload:
      blob: blob-x
      approval: true
    description: |
        carol (tier 2) approves. alice, dave and erin never vote.

expected_state:
  agreement:
    blob-x:
      outcome: false
