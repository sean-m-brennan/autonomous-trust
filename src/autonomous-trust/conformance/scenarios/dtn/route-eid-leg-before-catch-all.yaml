schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "route-eid-leg-before-catch-all"
description: |
  Order decides: an EID leg listed first takes an EID before a catch-all CIDR is tried.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "route"
    inners:
      - kind: "dtn_bp"
        match_eid: true
      - kind: "udp_net_4"
        match_cidr: "0.0.0.0/0"
    target: "ipn:1.1"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "route"
    description: "trigger: route"
expected_state:
  host:
    leg: 0
