schema_version: '1'
kind: scenario
protocol: contacts
name: backup-open-changed-mem-fails
description: 'Changing the memory fails the open like a wrong passphrase: it is in the associated data
  (or the key).'
byte_pinning: false
participants:
- id: host
  role: recipient
fixtures:
  contacts:
    op: backup
    mode: open
    blob:
      typename: at-backup
      v: 1
      kdf: argon2id13
      ops: 1
      mem: 16384
      salt: 000102030405060708090a0b0c0d0e0f
      aead: xchacha20poly1305-ietf
      nonce: 101112131415161718191a1b1c1d1e1f2021222324252627
      ct: 4l6LixkmgAPxRgX5dYgekx/XCaGKa/K6vivH8Albd3g=
    passphrase: correct horse battery staple
steps:
- id: 1
  from: host
  to: host
  function: backup
  description: 'trigger: backup open'
expected_state:
  host:
    backup_status: bad_passphrase
