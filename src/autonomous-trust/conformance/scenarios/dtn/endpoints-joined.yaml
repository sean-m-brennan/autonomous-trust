schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "endpoints-joined"
description: |
  A joined group moves the broadcast and group endpoints to its EID; the peer endpoint is the node EID.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "endpoints"
    node_uuid: "aabbccdd-1122-4000-8000-000000000001"
    group_uuid: "11223344-5566-7788-99aa-bbccddeeff00"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "endpoints"
    description: "trigger: endpoints"
expected_state:
  host:
    endpoints:
      - ["dtn://at-aabbccdd/peer", "/peer"]
      - ["dtn://at-group-1122334455667788/bcast", "/bcast"]
      - ["dtn://at-group-1122334455667788/group", "/group"]
    group_joined: true
