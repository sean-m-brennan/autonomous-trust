schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "endpoints-group-set-only-past-byte-eight"
description: |
  A group uuid whose only set byte is past the eighth is joined, and its EID is eight zero bytes.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "endpoints"
    node_uuid: "aabbccdd-1122-4000-8000-000000000001"
    group_uuid: "00000000-0000-0000-0000-000000000001"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "endpoints"
    description: "trigger: endpoints"
expected_state:
  host:
    endpoints:
      - ["dtn://at-aabbccdd/peer", "/peer"]
      - ["dtn://at-group-0000000000000000/bcast", "/bcast"]
      - ["dtn://at-group-0000000000000000/group", "/group"]
    group_joined: true
