schema_version: "1"
kind: scenario
protocol: negotiation
name: results-uninvited-not-scored
byte_pinning: false
description: |
    A result from a peer that was not invited is not scored (ISSUES §2.8).

    alice addresses the task to bob alone. carol, who learned the task id,
    reports anyway. With one transaction per executor (§2.50) her report would
    have earned her a whole bilateral transaction; it is dropped, and the task
    waits for bob, who answers and is scored.

participants:
  - id: alice
    role: requestor
  - id: bob
    role: worker
  - id: carol
    role: worker

fixtures:
  capabilities:
    bob: [data_fetch]
    carol: [data_fetch]

steps:
  - id: 1
    from: alice
    to: alice
    function: spawn task
    payload:
      capability: data_fetch
      task_id: t-addr
      target: bob
    description: alice addresses the task to bob.
  - id: 2
    from: carol
    to: alice
    function: report results
    payload:
      task_id: t-addr
      result: done
    description: carol, never invited, reports.
  - id: 3
    from: bob
    to: alice
    function: report results
    payload:
      task_id: t-addr
      result: done
    description: bob reports.

expected_state:
  alice:
    results_scored: {task: t-addr, executors: [bob]}
    has_my_task: {slug: t-addr, present: false}
