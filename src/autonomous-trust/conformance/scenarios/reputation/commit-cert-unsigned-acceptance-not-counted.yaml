schema_version: "1"
kind: scenario
protocol: reputation
name: commit-cert-unsigned-acceptance-not-counted
byte_pinning: false
description: |
    Commit certificates (doc/architecture/reputation.md). bob's acceptance of
    alice's round carries no signature over her commit_designation. An unsigned
    acceptance does not count, and alice writes nothing.

    Step 2 is delivered as built, not as bob's reply to step 1 (which is
    signed), so the acceptance alice handles is the unsigned one.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor

fixtures:
  proposals:
    alice:
      - id1: 1000
        id2: 1
        task_id: t-1
        score: 0.8

steps:
  - id: 1
    from: alice
    to: bob
    function: transaction
    payload:
      id1: 1000
      id2: 1
      proposer: alice
      task_id: t-1
      score: 0.8

  - id: 2
    from: bob
    to: alice
    function: tx accepted
    payload:
      id1: 1000
      id2: 1
      proposer: alice

expected_state:
  alice:
    halves_held: 0
    certified_halves: 0
