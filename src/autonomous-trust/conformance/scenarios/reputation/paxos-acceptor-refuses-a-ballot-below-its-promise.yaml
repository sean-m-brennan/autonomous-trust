schema_version: "1"
kind: scenario
protocol: reputation
name: paxos-acceptor-refuses-a-ballot-below-its-promise
byte_pinning: false
description: |
    Phase 2 of a Paxos round runs only under the ballot the acceptor granted,
    and only while it has promised no higher one since
    (doc/architecture/reputation.md, "Agreeing on a history"). bob granted
    alice's ballot 1000 for slot 1, then promised a rival's ballot 2000. When
    alice's transaction arrives under 1000, bob does not accept it and sends
    nothing back.

    Before this rule an acceptor took any transaction at a slot it had ever
    granted, whatever ballot it carried, so an outranked proposer could still
    collect acceptances.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor

fixtures:
  requests:
    bob:
      - [1000, 1]
  last_id:
    bob: 2000
  my_requests:
    alice:
      - id1: 1000
        id2: 1
        task_id: t-1
        score: 0.8

steps:
  - id: 1
    from: alice
    to: bob
    function: transaction
    payload:
      id1: 1000
      id2: 1
      proposer: alice
      task_id: t-1
      score: 0.8

  - id: 2
    from: bob
    to: alice
    function: tx accepted
    in_response_to: 1
    expect_none: true
    payload:
      id1: 1000
      id2: 1
      proposer: alice
