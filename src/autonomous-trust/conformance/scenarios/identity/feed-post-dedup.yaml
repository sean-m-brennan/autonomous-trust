schema_version: "1"
kind: scenario
protocol: identity
name: feed-post-dedup
byte_pinning: false
description: |
    Content-id dedup for a feed post (Increment 7). A post is content-addressed by
    the blake2b hash of its canonical form; gossip means the same post can arrive
    by several paths, so a reader must record it ONCE and drop repeats (the app-
    content dedup store, distinct from the transport dedup ring). Here bg's
    identical post (same author, seq, ts, tier, body -> same content id) is
    delivered twice; the second is deduped away and the recorded post is unchanged.

    Step 1: bg -> newcomer peer_post {body:"once", seq:1, ts:0, tier:0}.
      - Both runtimes: verified, tier-passed, recorded.
    Step 2: bg -> newcomer the identical post (same content id).
      - Both runtimes: content-id already seen -> dropped; the record is unchanged.

    Assertion: newcomer.post_last[bg] is the single "once" post.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_post
    payload:
      body: once
      seq: 1
      ts: 0
      tier: 0
    description: bg's genuine post; newcomer records it.
  - id: 2
    from: bg
    to: newcomer
    function: peer_post
    payload:
      body: once
      seq: 1
      ts: 0
      tier: 0
    description: |
        The identical post again (same content id). Deduped; the record must not
        change or double.

expected_state:
  newcomer:
    post_last:
      bg:
        seq: 1
        tier: 0
        body: once
