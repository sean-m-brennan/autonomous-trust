schema_version: "1"
kind: scenario
protocol: identity
name: zta-x509-reject-oversized-credential
byte_pinning: false
description: |
    ZTA X.509 admission — the credential-size bound (ZTA_CRED_MAX = 64 KiB).
    newcomer announces with a VALID, CA-chained leaf certificate whose DER is
    deliberately padded past 64 KiB (a large unrecognized extension). The cert
    parses and chain-verifies, so WITHOUT the size guard it would be admitted
    (propose_emitted == 1). The admission gate rejects it purely on size
    (credential too large), so the welcoming committee drops the candidate
    before the propose — propose_emitted == 0.

    This is what pins the 64 KiB value cross-language: a junk oversized blob
    would be rejected by cert-parse failure regardless of any size check, so it
    could not distinguish "size bound enforced" from "not a cert". A valid,
    oversized cert is admitted iff the size guard is absent — so the assertion
    fails the instant either side's bound drifts.

    Both sides enforce ZTA_CRED_MAX at the admission gate:
      - Python idprocess._zta_admit (before verify_credential)
      - C id_proc.c admission block (before verify_credential)
    C additionally rejects at protobuf deserialization (identity.c), but the
    conformance harness attaches a live from_whom (no wire round-trip), so the
    admission-gate check is the one exercised here. Keep ZTA_CRED_MAX in lockstep
    (Python zta_verifier.py == C identity.h).

    Cross-impl: pinned on BOTH sides. The C conformance adapter wires the ZTA
    policy + credentials (_apply_zta_fixtures) when built with -DAT_ZTA=ON;
    scripts/test-conformance.sh enables that automatically when OpenSSL is
    present (build-zta/). Without OpenSSL the C side skips this scenario, which
    is still non-asymmetric (diff_results.py treats a one-side skip as a match).

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

fixtures:
  zta_policy:
    enabled: true
    require_at_admission: true
    # These fixtures PREDATE the credential->identity binding
    # (doc/architecture/zta-integration.md) and
    # provision none, so `off` keeps each pin testing what it claims: this case is
    # about the chain / operator classification, not about bindings. Without it a
    # reject-* pin would pass for the wrong reason (unbound, not bad chain) and the
    # admit pins would fail outright. Binding behavior is pinned separately by the
    # zta-binding-* scenarios.
    binding_mode: "off"
    verifier_type: x509
    ca_bundle_path: testdata/zta/ca-bundle-oversized.pem
  credentials:
    newcomer: testdata/zta/certs/oversized.der

steps:
  - id: 1
    from: newcomer
    to: broadcast
    function: request_access
    description: |
        newcomer announces with a valid but >64 KiB credential. bg's admission
        gate rejects it on size (before verify); no propose is emitted.

expected_state:
  bg:
    propose_emitted: 0
