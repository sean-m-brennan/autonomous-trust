syntax = "proto3";

package autonomous_trust.core.protobuf.identity;

message Encryptor {
  bytes hex_seed = 1;
}

message Signature {
  bytes hex_seed = 1;
}

// One ZTA credential and the proof that this node may present it.
//
// A node carries ONE; several arise only at a network gateway bridging agencies,
// which needs one per agency it bridges. `binding` is a signature by the
// credential's own private key over
//   "at-zta-binding-v1" || uuid(16) || node signing key(32) || sha256(der)(32)
// (identity/zta_binding.py). Because the pre-image names the node, a harvested
// (der, binding) pair cannot be re-presented under another identity -- which is
// what closes the first-use-wins hole in ISSUES §1.5. It may be empty: a
// certificate whose SAN already names the node is bound by its issuer instead,
// and a deployment mid-migration may not have provisioned one yet (see the
// zta_policy binding_mode).
message ZtaCredential {
  bytes der = 1;       // raw credential (X.509 DER)
  bytes binding = 2;   // holder-asserted binding signature; may be empty
  string issuer = 3;   // issuer/anchor label, advisory only — never trusted
}

message Identity {
  bytes uuid = 1;
  string address = 2;
  // Zooko ONLINE name (global, human-meaningful, not unique). This is the only
  // name carried on the wire (was `fullname`).
  string nickname = 3;
  Signature signature = 4;
  Encryptor encryptor = 5;
  bytes zta_credential_hash = 6;   // SHA-256 of ZTA credential at admission
  string zta_issuer = 7;           // Credential issuer identifier
  bytes zta_credential = 8;        // Raw credential for peer verification
  // Field 9 previously held a LOCAL nickname; removed. Reserved so the field
  // number is never reused.
  reserved 9;
  // petname is a Zooko LOCAL name — intentionally never populated on the wire
  // (identity.c sync_out / identity.py sync_to_message leave it unset, so
  // proto3 omits it). A receiver assigns its own petname locally.
  string petname = 10;
  uint32 rank = 11;                // Voter rank for AgreementByAuthority;
                                   // 0 by default, future elevation
                                   // mechanism may bump it.
  // Operator-attended signal (ethne guardian edge, D8). Advertises whether a
  // node has a human behind it. operator_bound is durable ("has a human
  // guardian", backed by the ZTA operator credential the receiver verifies);
  // operator_attested_at is a live freshness stamp (epoch seconds of the last
  // verified operator session; 0 = none) from which peers derive attended-now.
  // Like the zta_* fields, these are NOT part of identity equality (rotation
  // and attestation must not change identity). See
  // lib/muudd/lib/ethne/doc/design.md D8/Q9.
  bool operator_bound = 12;        // durable: node has a human guardian
  double operator_attested_at = 13;  // live: epoch secs of last operator session
  // WHICH human — the guardian's identity, and STRICTLY OPT-IN. The two fields
  // above say a human exists and when one was last present; neither names them,
  // because the operator credential is an X.509 with no ed25519 key. ethne's
  // chartered node->guardian edge (D15) needs a guardian that can co-sign, so a
  // node MAY advertise one:
  //
  //   operator_pubkey      the guardian's 32-byte ed25519 public key. One key per
  //                        OPERATOR, stable across every node that human guards —
  //                        per-node keys would let one person present as N
  //                        guardians (ethne D24).
  //   operator_key_binding a signature by the operator's PIV/CAC private key over
  //                        "at-operator-binding-v1" || uuid (16 raw bytes) ||
  //                        the node's 32-byte ed25519 public SIGNING key (raw,
  //                        not the hex encoding carried in Signature.hex_seed)
  //                        || operator_pubkey (32 raw bytes).
  //                        Verified against the credential's public key, so the
  //                        guardian claim chains to the distinct operator anchor
  //                        exactly as operator_bound does — and, because the
  //                        pre-image names the node, cannot be lifted from
  //                        another node's announce.
  //
  // BOTH ARE ABSENT BY DEFAULT AND MUST STAY COSTLESS. AT never requires them: a
  // node that declines is anonymous in exactly the way it is today, is admitted
  // identically, and its canonical form is byte-identical (both are emitted only
  // when non-default). A consumer that requires a guardian is asking for more
  // than AT asks for; that is the consumer's rule, not AT's.
  //
  // Not part of identity equality, like the zta_* fields above.
  bytes operator_pubkey = 14;      // opt-in: the guardian's ed25519 public key
  bytes operator_key_binding = 15; // opt-in: PIV signature binding it to this node
  // The full credential set, including the primary above (so the primary normally
  // appears twice — deduplicated by fingerprint on receipt). Fields 6/7/8 are kept
  // as the primary so a peer predating this field interoperates unchanged, and they
  // have nowhere to carry a binding, which is the other reason this exists.
  repeated ZtaCredential zta_credentials = 16;
}

// Which envelope encoding a group's members speak (ISSUES.md §2.3). Mirrors
// Python's NetWireFormat and C's net_wire_format_t; the JSON group wire form
// carries the same choice as the lowercase strings "json" / "proto".
//
// NET_WIRE_JSON is 0 SO THAT IT IS FREE: proto3 omits default-valued fields, so
// a JSON group encodes to exactly the bytes it did before this field existed
// and every byte-pinned group vector stays valid. It is also the right default
// on read -- a group from a peer that predates this field is a JSON group.
enum NetWireFormat {
  NET_WIRE_JSON = 0;
  NET_WIRE_PROTO = 1;
}

message Group {
  bytes uuid = 1;
  string address = 2;  // Legacy single address (first of address_map); kept so
                       // an older peer that only reads this field still works.
  Encryptor encryptor = 3;  // group-shared key
  // Full UUID->address membership map (§1.4). Mirrors Python Group._address_map
  // and C group_t.address_map; the single `address` above is just its first
  // value. Proto3 map — absent on read decodes to an empty map, so an older
  // peer that only sends `address` stays compatible.
  map<string, string> address_map = 4;
  // Group age for the merge size-tie tiebreaker (§3.1-b): epoch seconds, or 0
  // when unknown. Mirrors the canonical JSON `created`.
  double created = 5;
  // The envelope encoding this group's members speak (§2.3). Group-carried
  // rather than per-node so a cohort cannot end up half in one format: a
  // joiner adopts this at admission, and AT_NET_WIRE_MODE only stamps a group
  // its node MINTS. Absent/0 = json.
  NetWireFormat wire_format = 6;
}
