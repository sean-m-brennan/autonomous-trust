schema_version: '1'
kind: scenario
protocol: contacts
name: sync-time-within-the-skew-kept
description: Five minutes ahead is within the allowed skew and kept as sent.
byte_pinning: false
participants:
- id: host
  role: recipient
fixtures:
  contacts:
    op: sync
    now: 1800000000.0
    store:
      typename: contacts
      version: 1
      contacts: {}
    payload:
      v: 1
      typename: at-contacts-sync
      contacts:
        eeeeeeee-0000-4000-8000-000000000001:
          identity:
            typename: identity
            uuid: eeeeeeee-0000-4000-8000-000000000001
            address: ''
            nickname: bob
            signature:
              hex_seed: d04ab232742bb4ab3a1368bd4615e4e6d0224ab71a016baf8520a332c9778737
            encryptor:
              hex_seed: '7777777777777777777777777777777777777777777777777777777777777777'
          petname: bob-pet
          verified: false
          provenance: token
          trust_seed: 0.0
          rendezvous: []
          nonce: ''
          added_at: 1000.0
          verified_at: 0.0
          updated_at: 1800000300.0
      tombstones: {}
steps:
- id: 1
  from: host
  to: host
  function: sync
  description: 'trigger: sync'
expected_state:
  host:
    changes:
    - - eeeeeeee-0000-4000-8000-000000000001
      - added
    contacts:
      eeeeeeee-0000-4000-8000-000000000001:
        updated_at: 1800000300.0
