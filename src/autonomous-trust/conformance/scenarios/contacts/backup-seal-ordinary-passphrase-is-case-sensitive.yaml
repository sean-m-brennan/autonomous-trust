schema_version: '1'
kind: scenario
protocol: contacts
name: backup-seal-ordinary-passphrase-is-case-sensitive
description: 'Anything not shaped like a generated code is taken as typed: upper case gives another ciphertext
  than the vector.'
byte_pinning: false
participants:
- id: host
  role: recipient
fixtures:
  contacts:
    op: backup
    mode: seal
    plaintext: at backup vector
    passphrase: CORRECT HORSE BATTERY STAPLE
    ops: 1
    mem: 8192
    salt: 000102030405060708090a0b0c0d0e0f
    nonce: 101112131415161718191a1b1c1d1e1f2021222324252627
steps:
- id: 1
  from: host
  to: host
  function: backup
  description: 'trigger: backup seal'
expected_state:
  host:
    backup_status: ok
    ct: 7EGdhj6sR/Olz8tNfK4UF8dgLpNoFwbEIdxrXPtbHmA=
