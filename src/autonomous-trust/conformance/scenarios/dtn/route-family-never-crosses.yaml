schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "route-family-never-crosses"
description: |
  An IPv4 address never matches an IPv6 CIDR.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "route"
    inners:
      - kind: "udp_net_4"
        match_cidr: "fd00::/8"
    target: "10.0.0.1"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "route"
    description: "trigger: route"
expected_state:
  host:
    leg: -1
