schema_version: '1'
kind: scenario
protocol: selection
name: audit
byte_pinning: false
description: |
  The audit of a requestor's draws (RD_12.7 plan sections 0.1-0.2, D3(c)).

  The requestor draws six tasks (indices 1-6). The peer is shown draws 1 and 5,
  as a peer selected only for those would be. Draw 5 after 1 is a gap, so the
  peer asks about 2, 3 and 4. A re-announce of 5 is no finding. Draw 3 shown
  after 5 has an index that did not increase. Draw 6 with draw 5's link is a bad
  link, and a link that is not hex is malformed.

  Each audit answer gives only the asker's own row: its position, propensity
  and selection, the stream offset of the draw that decided it, and the
  interval it had to fall in. For every row the peer recomputes the coin from
  the link and finds the answer consistent. A row selected in a draw the peer
  was never shown is flagged as selected-uninvited. A stranger gets no row, and
  an index never drawn is unknown. A tampered answer is caught: a flipped
  selection is inconsistent with the coin, another draw's link fails against
  the head, and a non-numeric bound is malformed. The last row is a different
  head with no rotation proof.
participants:
- {id: requestor, role: requestor}
- {id: peer, role: peer}
