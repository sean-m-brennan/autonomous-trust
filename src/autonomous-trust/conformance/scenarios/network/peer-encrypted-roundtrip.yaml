schema_version: "1"
kind: scenario
protocol: network
name: peer-encrypted-roundtrip
byte_pinning: false
description: |
    Per-peer NaCl Box round-trip. Participant A builds a signed identity
    request_access Message addressed to B, JSON-serializes it, then encrypts
    the wire bytes with A's signing+encryption key pair against B's
    encryption public key. B decrypts with its own private key and A's
    public key, re-parses the wire bytes via the production parser, and the
    scenario asserts that the parsed Message carries the correct
    (process, function, verified) tuple.

    This is the smallest cross-language test that exercises the per-peer
    transport encrypt → decrypt → wire-parse path end-to-end. The Box
    framing differs between Python (PyNaCl prefixes the nonce to the
    ciphertext) and C (libsodium-via-identity_encrypt expects a caller-
    supplied nonce alongside the bare ciphertext), so byte_pinning is off;
    semantic equivalence at the parsed-Message boundary is what the
    conformance gate checks.

participants:
  - id: a
    role: sender
  - id: b
    role: receiver

fixtures:
  # Caller-supplied per-message nonce (24 bytes). The Python EncryptedMessage
  # prepends this internally; the C side accepts it as a separate argument.
  # Either way both languages drive the same Box round-trip with the same
  # nonce, so plaintext equality is a strict cross-language assertion.
  nonce_hex: "0x000102030405060708090a0b0c0d0e0f1011121314151617"
  # Plaintext payload carried by the identity Message. Empty JSON object —
  # the test does not depend on payload shape, only on Message envelope
  # fields surviving the round trip.
  obj_json: "{}"

steps:
  - id: 1
    from: a
    to: b
    function: request_access
    description: |
        A signs/serializes a request_access Message, encrypts the bytes
        with the fixed nonce to B, B decrypts and re-parses. Adapter
        captures the parsed-Message observables (process, function,
        verified) for expected_state.

expected_state:
  b:
    routed_process: identity
    routed_function: request_access
    verified: true
