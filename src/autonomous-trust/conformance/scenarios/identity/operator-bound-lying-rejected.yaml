schema_version: "1"
kind: scenario
protocol: identity
name: operator-bound-lying-rejected
byte_pinning: false
description: |
    Operator-attended signal — a lying node cannot claim a human (ethne
    guardian edge, D8/Q9). The newcomer presents an ordinary device/drone
    credential (drone_alpha.der) that chains to the mission CA (so it is admitted
    as a peer) but NOT to the distinct operator CA, AND it ADVERTISES
    operator_bound = true (operator_claims). The border guard admits it, but
    _zta_admit neutralizes the advertised claim and re-derives operator-class
    from the operator anchor — which the drone credential fails — so the stored
    peer's operator_bound is false.

    This pins the non-forgeability property: the advertised bool never survives;
    only a credential that verifies against the operator anchor marks a human
    guardian.

    Cross-impl: pinned on BOTH sides (see operator-bound-verified for the C ZTA
    build/skip rule). Demonstrates the DISTINCT operator anchor: the drone
    credential chains to the mission CA (ca-bundle.pem, so it is admitted) but
    NOT to the operator CA (operator-ca-bundle.pem), so it is not operator-class.
    Reuses the existing drone_alpha.der fixture.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

fixtures:
  zta_policy:
    enabled: true
    require_at_admission: true
    # These fixtures PREDATE the credential->identity binding (ISSUES §1.5) and
    # provision none, so `off` keeps each pin testing what it claims: this case is
    # about the chain / operator classification, not about bindings. Without it a
    # reject-* pin would pass for the wrong reason (unbound, not bad chain) and the
    # admit pins would fail outright. Binding behavior is pinned separately by the
    # zta-binding-* scenarios.
    binding_mode: "off"
    verifier_type: x509
    ca_bundle_path: testdata/zta/ca-bundle.pem
    operator_ca_bundle_path: testdata/zta/operator-ca-bundle.pem
  credentials:
    newcomer: testdata/zta/certs/drone_alpha.der
  operator_claims:
    newcomer: true

steps:
  - id: 1
    from: newcomer
    to: broadcast
    function: request_access
    description: |
        newcomer announces a drone credential while advertising
        operator_bound=true. bg admits it (chain-valid) but the operator-anchor
        classification fails.
  - id: 2
    from: bg
    to: broadcast
    function: propose_peer
    in_response_to: 1
    description: bg proposes the candidate to the group.
  - id: 3
    from: bg
    to: broadcast
    function: peer_accepted
    in_response_to: 1
    description: |
        _peer_accepted stores the newcomer with the NEUTRALIZED operator_bound
        (false) — the advertised claim did not survive.
  - id: 4
    from: bg
    to: newcomer
    function: access_granted
    in_response_to: 1
    description: bg sends its published identity to the newcomer.
  - id: 5
    from: bg
    to: newcomer
    function: full_history
    in_response_to: 1
    description: bg sends the group key + history DAG.

expected_state:
  bg:
    operator_bound:
      newcomer: false
