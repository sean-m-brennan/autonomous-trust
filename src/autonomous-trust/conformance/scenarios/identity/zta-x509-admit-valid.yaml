schema_version: "1"
kind: scenario
protocol: identity
name: zta-x509-admit-valid
byte_pinning: false
description: |
    ZTA X.509 admission — happy path. The border guard runs with a ZTA policy
    (enabled, require_at_admission, verifier_type x509) trusting the mission CA
    bundle. The newcomer announces with a credential (drone_alpha.der) issued by
    that CA, so the welcoming committee verifies the chain and proposes the
    newcomer for the group vote — propose_emitted == 1.

    Cross-impl: pinned on BOTH sides. The C conformance adapter wires the ZTA
    policy + credentials (_apply_zta_fixtures) when built with -DAT_ZTA=ON;
    scripts/test-conformance.sh enables that automatically when OpenSSL is
    present (build-zta/). Without OpenSSL the C side skips this scenario, which
    is still non-asymmetric (diff_results.py treats a one-side skip as a match).

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

fixtures:
  zta_policy:
    enabled: true
    require_at_admission: true
    # These fixtures PREDATE the credential->identity binding (ISSUES §1.5) and
    # provision none, so `off` keeps each pin testing what it claims: this case is
    # about the chain / operator classification, not about bindings. Without it a
    # reject-* pin would pass for the wrong reason (unbound, not bad chain) and the
    # admit pins would fail outright. Binding behavior is pinned separately by the
    # zta-binding-* scenarios.
    binding_mode: "off"
    verifier_type: x509
    ca_bundle_path: testdata/zta/ca-bundle.pem
  credentials:
    newcomer: testdata/zta/certs/drone_alpha.der

steps:
  - id: 1
    from: newcomer
    to: broadcast
    function: request_access
    description: |
        newcomer announces with a CA-signed credential. bg's welcoming_committee
        verifies it (VERIFIED) and proceeds to propose the candidate.

expected_state:
  bg:
    propose_emitted: 1
