schema_version: "1"
kind: scenario
protocol: identity
name: block-unblock-restores-tier
byte_pinning: false
description: |
    A block can be lifted, and lifting it restores exactly what was there
    before (Phase 4 P4.1).

    A block that cannot be undone is not a moderation tool, it is a mistake you
    have to live with. Unblock is a DISCARD of the record, not a second flag
    beside it — "blocked" IS the presence of the key on both runtimes — so the
    record and the predicate cannot drift apart, and re-blocking is idempotent.

    The tier is the observable because it is what block-local-clamp already
    pins in the other direction: alice is scored to tier 3, blocked (clamped to
    0), then unblocked, and her tier must be 3 again. A clamp that turned out
    to be destructive — overwriting the stored tier rather than shadowing it —
    would pass block-local-clamp and fail here, which is exactly why the pair
    is worth having.

    bob is scored alongside and never blocked. He fixes the reading: if the
    resync or the tier updates had silently stopped working, alice's 3 could
    come back as 0 and be misread as a failed unblock.

    The peer is told nothing, on either side of it. What alice sent while
    blocked is gone — the inbound gates dropped it rather than queueing it — so
    an unblock restores reach going forward and does not replay the silence.

    Requires CONFORMANCE_SOCIAL=1, or the C side skips and diff_results scores
    a one-side skip as a match.

participants:
  - id: node
    role: border_guard
  - id: alice
    role: group_member
  - id: bob
    role: group_member

fixtures:
  # Pinned, not adapter-minted: the identity-resync query is gated on the
  # asker's group uuid matching the responder's, so without a shared pin each
  # runtime mints its own per-participant group and the backfill silently
  # produces no peer (see tier-update-applied, block-local-clamp).
  shared_group:
    uuid: "0c000000-0000-4000-8000-00000000000b"

steps:
  - id: 1
    from: node
    to: alice
    function: peer_identity_query
    payload:
      have: []
    description: Setup. node asks alice for her published identity.
  - id: 2
    from: alice
    to: node
    function: peer_identity_response
    in_response_to: 1
    payload: {}
    description: Setup. node backfills alice into its peer list.
  - id: 3
    from: node
    to: bob
    function: peer_identity_query
    payload:
      have: []
    description: Setup. node asks bob for his published identity.
  - id: 4
    from: bob
    to: node
    function: peer_identity_response
    in_response_to: 3
    payload: {}
    description: Setup. node backfills bob into its peer list.
  - id: 5
    from: node
    to: node
    function: tier_update
    payload:
      peer: alice
      tier: 3
    description: The reputation process publishes alice at tier 3. Local IPC.
  - id: 6
    from: node
    to: node
    function: tier_update
    payload:
      peer: bob
      tier: 3
    description: The reputation process publishes bob at tier 3.
  - id: 7
    from: node
    to: node
    function: trigger_block
    payload:
      peer: alice
    description: node blocks alice; her effective tier clamps to 0.
  - id: 8
    from: node
    to: node
    function: trigger_unblock
    payload:
      peer: alice
    description: |
        node lifts the block. The clamp SHADOWED the stored tier rather than
        overwriting it, so removing the record restores 3 — nothing has to be
        re-learned.

expected_state:
  node:
    peer_count: 2
    peer_tier:
      alice: 3    # unblocked -> the reputation tier stands again
      bob: 3      # never blocked -> unchanged throughout
