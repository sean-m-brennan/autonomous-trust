schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "route-first-default-wins"
description: |
  Of two default legs, the first is the default.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "route"
    inners:
      - kind: "udp_net_4"
        is_default: true
      - kind: "tcp_net_4"
        is_default: true
    target: "1.2.3.4"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "route"
    description: "trigger: route"
expected_state:
  host:
    leg: 0
