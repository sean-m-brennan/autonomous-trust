schema_version: "1"
kind: scenario
protocol: agreement
name: pot-threshold-tier-filter
byte_pinning: false
description: |
    Proof of Trust (PoT) `threshold_tier` gate. A voter whose trust tier
    is below the threshold is not eligible: its vote is dropped and it
    does not count toward the eligible set (RD_13.1).

    Setup: alice (tier 2) and bob (tier 1, myself); threshold_tier is 3.
    alice approves. Neither voter reaches tier 3, so there are no
    eligible voters and PoT cannot approve: outcome false.

    Under the leader-decides rule PoT had before RD_13.1, the same case
    was false for a different reason (alice's vote was forced to false).
    The outcome is unchanged; the companion PoA scenario
    `poa-threshold-rank-filter` no longer describes the same rule.

participants:
  - id: alice
    role: voter
  - id: bob
    role: voter

fixtures:
  impl: trust
  threshold_tier: 3
  tiers:
    alice: 2
    bob: 1
  myself: bob
  blobs:
    blob-x:
      originator: alice
      payload: "below-threshold-payload"

steps:
  - id: 1
    from: alice
    to: agreement
    function: vote
    payload:
      blob: blob-x
      approval: true
    description: |
        alice (tier 2) approves blob-x. With threshold_tier=3 she is
        not eligible and her vote is dropped; with no eligible voters
        finalize returns false.

expected_state:
  agreement:
    blob-x:
      outcome: false
