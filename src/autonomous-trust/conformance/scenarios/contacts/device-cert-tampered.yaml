  contacts:
    op: device
    mode: verify
    cert:
      body: '{"v":1,"typename":"at-device-cert","operator":"17cb79fb2b4120f2b1ec65e4198d6e08b28e813feb01e4a400839b85e18080ce","uuid":"dddddddd-0000-4000-8000-000000000053","key":"2012cb90ca60e8e5d8daf66e2272d2233e0486d557e8c66141ed8920177d7eb7","issued_at":1790000000}'
      sig: c600b61d077ddbf7f1d1d2202919e4584a0c87fa588e203d1a7d0c38178452814847a212d618bfaca8b96447e3455dc84df608c3620a235bcd0b6fe0c2d49e08
steps:
- id: 1
  from: host
  to: host
  function: device
  description: 'trigger: device verify'
expected_state:
  host:
    device_status: bad_signature
