schema_version: "1"
kind: scenario
protocol: identity
name: business-post-unknown-polity-dropped
byte_pinning: false
description: |
    THE AUDIENCE GATE (Phase 3 P3.4, user-locked): a post from a business this
    node knows nothing about is DROPPED AND NOT RELAYED. This is
    business-post-shared with step 1 — the ad that teaches newcomer the page —
    removed, and nothing else changed. The signature is perfectly good; the
    business is simply a stranger.

    Dropped means BOTH halves: business_post_last is empty (nothing to show)
    and business_posts_emitted is 0 (nothing carried onward). The second is
    the one that matters for the network: a node forwarding content it is not
    allowed to read is how a gossip channel becomes an amplifier.

    A mutation that moves the gate after the emit passes the first assertion
    and fails the second. A mutation that removes the gate fails both.

    Step 1: bg -> newcomer peer_business_post {seq: 1, hops: 0}, no page held.
      - Both runtimes: verify the signature, then drop for want of a page.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_business_post
    payload:
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      seq: 1
      ts: 0
      hops: 0
      bundle: '{"post":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ","body":"Fresh croissants at seven.","seq":1},"sig":"stub"},"delegation":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"},"sig":"stub"}}'
    description: |
        A well-signed post from a business newcomer has never heard of.

expected_state:
  newcomer:
    business_page:
      "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ": {}
    business_post_last:
      "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ": {}
    business_posts_emitted: 0
