schema_version: "1"
kind: scenario
protocol: identity
name: directory-request-is-held-for-the-app
byte_pinning: false
description: |
    A request that passes every gate is HELD for Alice's app to decide, and
    nothing is sent back: her node never answers a stranger on its own. Bob
    signed it with the key on his envelope, for her uuid and a handle she
    publishes, and he is not already her contact.

participants:
  - id: alice
    role: border_guard
  - id: bob
    role: new_node

fixtures:
  first_contact:
    enabled: true
  # Strangers, each alone in a cohort: nobody here is a peer of anybody.
  groups:
    alice:
      uuid: "fc000000-0000-4000-8000-0000000d0100"
      size: 1
    bob:
      uuid: "fc000000-0000-4000-8000-0000000d0101"
      size: 1

steps:
  - id: 1
    from: alice
    to: alice
    function: trigger_directory_publish
    payload:
      handle: alice@example.org
    description: |
        Pseudo-step: Alice's app publishes her handle through the production
        app_directory_publish, with an attestation from the harness issuer.
  - id: 2
    from: bob
    to: alice
    function: first_contact_request
    payload:
      handle: alice@example.org
      nonce: 01c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0
    description: |
        Bob found Alice's entry and asks, signed by his own key. Plaintext: neither
        is a peer of the other yet.

expected_state:
  alice:
    directory_requests_held: 1
    directory_accepts_emitted: 0
    direct_peers:
      bob: false
    contacts:
      bob: false
