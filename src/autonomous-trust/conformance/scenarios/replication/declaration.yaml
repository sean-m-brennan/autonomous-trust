schema_version: "1"
kind: scenario
protocol: replication
name: declaration
byte_pinning: false
description: |
    The replay declaration a running node reads from $AT_REPLICATION
    (RD_12.6_LIVE_REPLICATION_PLAN.md §0.1, D1, D2 and D12). A capability the
    operator declares replayable carries a `replay` object bounding its trace
    (max_steps, at most 256, the game's bound) and each revealed state
    (max_state_bytes, 4096 by default). Only these capabilities are replicated
    live: a capability with no `replay` object has a live probability of 0
    whatever its replicate_prob, and default_prob applies only to a replayable
    capability that does not give its own.

    What each row pins:

      - Rows 1-3: the replay contract resolves, with its defaults.
      - Rows 4-6: the live probability: a replayable capability's own number,
        default_prob for one that gives none, and 0 for one that is not
        replayable even with a probability of its own.
      - Row 7: a capability the declaration does not name is not replicated
        live.
      - Rows 8-14: refusals, each fatal to the whole declaration: steps of 0
        and over 256, a boolean, a state bound of 0 and over 65536, a replay
        that is not an object, and an entry with neither replicate_prob nor
        replay.

participants:
  - id: requestor
    role: new_node
  - id: worker
    role: peer

fixtures:
  replication:
    version: 1
    default_prob: 0.05
    capabilities:
      demo.integrate:
        replicate_prob: 0.2
        replay: {max_steps: 64, max_state_bytes: 1024}
      demo.defaulted:
        replay: {}
      demo.plain:
        replicate_prob: 0.5

  events:
    - {capability: demo.integrate, replay: {max_steps: 64, max_state_bytes: 1024}}
    - {capability: demo.defaulted, replay: {max_steps: 256, max_state_bytes: 4096}}
    - {capability: demo.plain, replay: null}
    - {capability: demo.integrate, live_prob: 0.2}
    - {capability: demo.defaulted, live_prob: 0.05}
    - {capability: demo.plain, live_prob: 0.0}
    - {capability: unlisted.thing, live_prob: 0.0}
    - declare: {version: 1, capabilities: {x: {replay: {max_steps: 0}}}}
      refused: true
    - declare: {version: 1, capabilities: {x: {replay: {max_steps: 257}}}}
      refused: true
    - declare: {version: 1, capabilities: {x: {replay: {max_steps: true}}}}
      refused: true
    - declare: {version: 1, capabilities: {x: {replay: {max_state_bytes: 0}}}}
      refused: true
    - declare: {version: 1, capabilities: {x: {replay: {max_state_bytes: 65537}}}}
      refused: true
    - declare: {version: 1, capabilities: {x: {replay: 4}}}
      refused: true
    - declare: {version: 1, capabilities: {x: {note: neither}}}
      refused: true
    - declare: {version: 1, capabilities: {x: {replay: {max_steps: 256, max_state_bytes: 65536}}}}
      refused: false

steps:
  - id: 1
    from: requestor
    to: requestor
    function: replay_events
    description: |
        Replay the events against this runtime's declaration parser.
