schema_version: "1"
kind: scenario
protocol: identity
name: directory-accept-with-someone-elses-invitation-is-ignored
byte_pinning: false
description: |
    Alice's accept answers Bob's request, but the invitation inside it was
    minted by Mallory. Redeeming it would make Mallory Bob's contact under
    Alice's name; the invitation must be the holder's own, so no hello is
    sent.

participants:
  - id: alice
    role: border_guard
  - id: bob
    role: new_node
  - id: mallory
    role: new_node

fixtures:
  first_contact:
    enabled: true
  # Strangers, each alone in a cohort: nobody here is a peer of anybody.
  groups:
    alice:
      uuid: "fc000000-0000-4000-8000-0000000d0c00"
      size: 1
    bob:
      uuid: "fc000000-0000-4000-8000-0000000d0c01"
      size: 1
    mallory:
      uuid: "fc000000-0000-4000-8000-0000000d0c02"
      size: 1

steps:
  - id: 1
    from: bob
    to: bob
    function: trigger_directory_request
    payload:
      holder: alice
      handle: alice@example.org
    description: |
        Pseudo-step: a lookup finds Alice's entry (a local dir_result) and Bob's
        app asks her, through the production app_first_contact_request. Bob now
        has a request outstanding to her, under her entry's key.
  - id: 2
    from: alice
    to: bob
    function: first_contact_accept
    payload:
      minted_by: mallory
    description: |
        Alice's accept for Bob's request, carrying Mallory's invitation.

expected_state:
  bob:
    first_contact_hellos_emitted: 0
