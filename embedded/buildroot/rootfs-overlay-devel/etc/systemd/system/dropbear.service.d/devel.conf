# The root filesystem is read-only. /etc/dropbear points into the data
# partition, so the host keys are generated once and survive reboots, and
# root's authorized_keys points at /boot/authorized_keys.
[Unit]
RequiresMountsFor=/opt/autonomous-trust /boot

[Service]
ExecStartPre=/bin/mkdir -p -m 700 /opt/autonomous-trust/dropbear
