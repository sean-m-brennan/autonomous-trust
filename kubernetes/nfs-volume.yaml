---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: source-pv
  namespace: $NAMESPACE
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  nfs:
    server: $CLUSTER_HOST_IP
    path: "$SRC_DIR"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: config-pv
  namespace: $NAMESPACE
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  nfs:
    server: $CLUSTER_HOST_IP
    path: "$CFG_DIR"
