schema_version: "1"
kind: scenario
protocol: negotiation
name: report-results-forwarded
byte_pinning: false
description: |
    Exercises the `report results` (NegotiationProtocol.result)
    handler — the path a worker takes when reporting completion
    back to the requestor. handle_results looks up the task in
    `my_tasks`, records the per-peer result, forwards a
    TaskResult to the main queue when all participants have
    reported, and then deletes my_tasks[uuid] so no further
    results are accepted.

    Setup: step 1 has alice spawn a local task (populating
    alice.my_tasks via start_task and fan-outing an invitation to
    bob); step 2 has bob report results back to alice. After
    step 2, alice.my_tasks no longer contains the task — that's
    the cross-language no-crash assertion this scenario pins.

    Why we can't directly assert "task absent from my_tasks":
    the negotiation adapter's `has_my_task` expected_state key
    only supports a positive presence check (raises if absent).
    The conformance value here is therefore cross-language
    equivalence at the no-crash level — both Python and C must
    walk the same two-step path without exception. An inverse
    assertion lands later if `has_my_task: false` becomes a
    supported observable.

participants:
  - id: alice
    role: requestor
  - id: bob
    role: worker

fixtures:
  capabilities:
    bob: [data_fetch]

steps:
  - id: 1
    from: alice
    to: alice
    function: spawn task
    payload:
      capability: data_fetch
      task_id: t-results
    description: |
        alice locally spawns the task; start_task adds it to
        my_tasks and fan-outs an invitation to bob.
  - id: 2
    from: bob
    to: alice
    function: report results
    payload:
      task_id: t-results
      result: done
    description: |
        bob reports the task as complete. handle_results records
        the result in my_tasks[uuid].results and (with task.size
        defaulting to 1) forwards the TaskResult to the main
        queue, then deletes my_tasks[uuid].

# No expected_state — handle_results clears my_tasks[uuid], which the
# adapter's `has_my_task` key can't assert in the negative. C's
# neg_state is a file-static singleton so other negative observables
# (e.g. task_in_stack: false) are polluted by prior scenarios. The
# conformance value here is cross-language no-crash equivalence: both
# Python and C walk the same two-step path without exception.
