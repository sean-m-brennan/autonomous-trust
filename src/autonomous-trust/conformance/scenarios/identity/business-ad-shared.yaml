schema_version: "1"
kind: scenario
protocol: identity
name: business-ad-shared
byte_pinning: false
description: |
    A business ad, the happy path (Phase 3 P3.2). A business is an Ethne polity;
    its PAGE is an opaque, self-verifying Ethne bundle. The runtime never parses
    that bundle — it carries it as bytes and the APP verifies polity-root ->
    envoy -> page. What the runtime verifies is the AT layer: a detached Ed25519
    signature binding WHO advertised, HOW satisfied they are, and WHICH page
    bytes they meant.

    Here bg publishes its own page and newcomer's handle_business_ad verifies the
    signature, content-id records it, and stores the page.

    Note newcomer.business_page.endorsers is 0: the business's OWN ad is not an
    endorsement. Self-vouching is free, so it buys no social proof — only
    customers can (business-ad-customer-relays).

    Step 1: bg -> newcomer peer_business_ad {sat: 255 (SAT_SELF), seq: 1}.
      - Both runtimes: verify bg's signature, record the page at seq 1.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_business_ad
    payload:
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      sat: 255
      seq: 1
      ts: 0
      bundle: '{"page":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ","name":"Corner Cafe","locality":"9q8yyk8y"},"sig":"stub"},"delegation":{"payload":{"polity":"did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"},"sig":"stub"}}'
    description: |
        bg's signed ad for its own page; newcomer verifies and records it.

expected_state:
  newcomer:
    business_page:
      "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ":
        seq: 1
        endorsers: 0
    customer_satisfaction:
      "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ": -1
    business_ads_emitted: 0
