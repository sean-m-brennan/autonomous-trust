schema_version: "1"
kind: "scenario"
protocol: "contacts"
name: "verify-contact-mismatch"
description: |
  A wrong safety number leaves the contact UNVERIFIED and seeds nothing - the man-in-the-middle defense (§4.4).
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  contacts:
    op: "verify_contact"
    blob: ""
    identity_b:
      address: "10.0.0.1"
      encryptor:
        hex_seed: "0faa684ed28867b97f4a6a2dee5df8ce974e76b7018e3f22a1c4cf2678570f20"
      nickname: "bob@example"
      signature:
        hex_seed: "884b8857f4eaa1613c61504db34d4beaf346517a0e31de3cddd4d9b4201d9d0b"
      typename: "identity"
      uuid: "bbbbbbbb-0000-4000-8000-000000000002"
    presented: "00000 00000 00000 00000 00000 00000 00000 00000 00000 00000 00000 00000"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "verify_contact"
    description: "trigger: verify_contact"
expected_state:
  host:
    verify_status: "mismatch"
    verified: false
    trust_seed: 0.0
