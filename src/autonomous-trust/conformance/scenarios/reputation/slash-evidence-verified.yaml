schema_version: "1"
kind: scenario
protocol: reputation
name: slash-evidence-verified
byte_pinning: false
description: |
    Phase 3 — Merkle-evidence-gated slashing
    (reputation-vs-blockchain-analysis.md §2.1 / §3).

    bob holds a finalized Phase 2 checkpoint over a committed window (root
    pinned by chain-catchup-verifies-links / checkpoint-cosign-flow). alice
    finalizes a slash against rogue carrying Merkle evidence: the offending
    tx's leaf entry_hash and an RFC 6962 inclusion proof against that same
    checkpoint root. bob verifies the proof folds to its finalized checkpoint
    and applies the floor — the accusation is cryptographically tied to a
    quorum-committed transaction, not merely trusted. Both languages must
    floor rogue to 0.1.

participants:
  - id: alice
    role: detector
  - id: bob
    role: member
  - id: rogue
    role: target

# The slash protocol is opt-in (R+D.md §12.8): nothing arms it automatically,
# since a poorly scored transaction carries its reason and every peer judges
# for itself. This scenario drives that protocol, so it arms it -- and every
# scenario that does NOT set this is a pin that the default is off.
fixtures:
  slash_enabled: true
  # bob's prior view of rogue — a rejected slash would leave this unchanged;
  # a verified one floors it.
  reputations:
    bob:
      rogue: 0.6
  # bob's finalized checkpoint over the committed window (== window_root of
  # chain-catchup-verifies-links). The evidence proof must fold to this root.
  checkpoint:
    bob:
      root: "f9bf077e5bfd8ef4cdf5fb0519b70ec51fb7df536515bf16c594a477ce6d5168"
      epoch: 1
      count: 3

steps:
  - id: 1
    from: alice
    to: bob
    function: slash final
    payload:
      target: rogue
      floor_score: 0.1
      epoch: 9
      evidence:
        task_id: "offending-tx"
        leaf: "2893be5e37728cf65ba0fef9a83d135aaf76b927b41e9e3ae7513c5baf13377f"
        proof:
          - ["244a27c19915c64129429a834fdb517b1a3f51395d2940a950eb47b88e5c766d", false]
          - ["4f165ec5ff8ed7eb52a08bd0c648f50dd5944a673f6531e635cb637cd47bbad9", false]
        root: "f9bf077e5bfd8ef4cdf5fb0519b70ec51fb7df536515bf16c594a477ce6d5168"
    description: |
        alice broadcasts the finalized slash with a valid inclusion proof;
        bob verifies it against its checkpoint and floors rogue.

expected_state:
  bob:
    reputation_of:
      rogue: 0.1
