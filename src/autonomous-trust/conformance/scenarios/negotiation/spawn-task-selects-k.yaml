schema_version: "1"
kind: scenario
protocol: negotiation
name: spawn-task-selects-k
byte_pinning: false
description: |
    A requestor that selects assigns a task to k of its capable peers, not to
    all of them (RD_12.7_SELECTIVE_ASSIGNMENT_PLAN.md section 3.1, D1(b),
    D2(a)).

    alice's declaration gives data_fetch k = 1. bob, carol and dave can all
    run it at the same tier, so each is drawn at 1/3. The draw is seeded by
    link 1 of alice's committed chain (the root is the fixture's), sorted by
    uuid string (dave, carol, bob), and it falls on carol. Only carol is
    invited. Her invitation carries the draw, she checks it against the
    chain's head, and she finds nothing wrong.

participants:
  - id: alice
    role: requestor
  - id: bob
    role: worker
  - id: carol
    role: worker
  - id: dave
    role: worker

fixtures:
  capabilities:
    bob: [data_fetch]
    carol: [data_fetch]
    dave: [data_fetch]
  selection:
    holder: alice
    root: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
    declaration:
      version: 1
      capabilities:
        data_fetch: {k: 1, floor: 0.05}

steps:
  - id: 1
    from: alice
    to: alice
    function: spawn task
    payload:
      capability: data_fetch
      task_id: t-select
    description: alice spawns the task, and her selection layer draws its invitee.
  - id: 2
    from: alice
    to: carol
    function: invitation
    in_response_to: 1
    description: carol, the drawn peer, is invited and checks the draw.
  - id: 3
    from: alice
    to: bob
    function: invitation
    in_response_to: 1
    expect_none: true
    description: bob was not drawn.
  - id: 4
    from: alice
    to: dave
    function: invitation
    in_response_to: 1
    expect_none: true
    description: nor was dave.

expected_state:
  alice:
    has_my_task: t-select
  carol:
    selection_findings: {}
