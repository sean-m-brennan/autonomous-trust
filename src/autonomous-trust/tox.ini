[tox]
envlist = at

[testenv]
# When the deps are already satisfied from outside the venv -- the integration
# test container runs with VIRTUALENV_SYSTEM_SITE_PACKAGES=true so they come
# from its conda env -- pip installs no copy of pytest into the venv, and tox
# then refuses the bare `pytest` below as an external command. This is a no-op
# for a normal run, where pytest IS in the venv.
allowlist_externals = pytest
# tox rebuilds the environment for its commands and forwards only an allowlist,
# so these two never reach pytest on their own. The integration test container
# sets both (test-integration.sh) to keep coverage's SQLite data file and the
# bytecode cache off /app, which its uid cannot write. Unset elsewhere, so this
# changes nothing for a local run.
passenv =
    COVERAGE_FILE
    PYTHONPYCACHEPREFIX
deps =
    -rrequirements.txt
    -rtests_require.txt
commands = pytest --ignore=tests/local --ignore=conformance --cov=autonomous_trust --cov-append --cov-report=html:coverage

[testenv:conformance]
deps =
    -rrequirements.txt
    -rtests_require.txt
    jsonschema
    protobuf
    jcs
commands = pytest conformance/harness/python conformance/harness/common/tests tools/tests -v

[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
addopts = -m "not slow"
filterwarnings =
    ignore::DeprecationWarning:pkg_resources:
