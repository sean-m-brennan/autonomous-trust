schema_version: "1"
kind: scenario
protocol: identity
name: identity-canonical
byte_pinning: false
description: |
    Documentation canonical for the Identity protocol — picked up by
    `scripts/build-docs.sh` via the `<protocol>-canonical.yaml`
    convention and rendered into `doc/architecture/_generated/`.
    Mirrors `new-node-admission` step-for-step; the duplication is
    intentional so the docs example has a stable filename
    (`identity-canonical`) that won't move when `new-node-admission`
    is updated, while still running through the same conformance
    code path so the diagram cannot drift from executable behavior.

    Flow: a new node broadcasts `request_access`; the border guard
    (bg) runs welcoming_committee, proposes the candidate to the
    group, votes (synchronously under `synchronous_dispatch`),
    finalizes the agreement, and emits the confirm/accept/history
    triple to bring the newcomer into the group.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: newcomer
    to: broadcast
    function: request_access
    description: |
        newcomer broadcasts its identity, package hash, and capabilities.
        bg receives the announce and runs welcoming_committee.

  - id: 2
    from: bg
    to: broadcast
    function: propose_peer
    in_response_to: 1
    description: |
        bg's welcoming_committee emits a propose_peer to the encrypted group
        channel so other border guards can vote.

  - id: 3
    from: bg
    to: broadcast
    function: peer_accepted
    in_response_to: 1
    description: |
        After synchronous _vote_collection finalizes, _peer_accepted broadcasts
        a peer_accepted to the encrypted group channel.

  - id: 4
    from: bg
    to: newcomer
    function: access_granted
    in_response_to: 1
    description: |
        bg sends its own published identity to newcomer in the open so the
        newcomer can encrypt subsequent traffic to bg.

  - id: 5
    from: bg
    to: newcomer
    function: full_history
    in_response_to: 1
    description: |
        bg sends the group key and identity-history DAG so newcomer can join
        and decrypt subsequent group-encrypted traffic.

expected_state:
  bg:
    phase: 3
