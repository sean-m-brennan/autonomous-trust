schema_version: "1"
kind: scenario
protocol: identity
name: directory-request-from-a-contact-is-ignored
byte_pinning: false
description: |
    Bob is already Alice's contact. Asking again adds nothing, and holding it
    would put a question to the app it has already answered, so the request is
    dropped.

participants:
  - id: alice
    role: border_guard
  - id: bob
    role: new_node

fixtures:
  first_contact:
    enabled: true
  # Strangers, each alone in a cohort: nobody here is a peer of anybody.
  groups:
    alice:
      uuid: "fc000000-0000-4000-8000-0000000d0500"
      size: 1
    bob:
      uuid: "fc000000-0000-4000-8000-0000000d0501"
      size: 1
  contacts:
    bob: {}

steps:
  - id: 1
    from: alice
    to: alice
    function: trigger_directory_publish
    payload:
      handle: alice@example.org
    description: |
        Pseudo-step: Alice's app publishes her handle through the production
        app_directory_publish, with an attestation from the harness issuer.
  - id: 2
    from: bob
    to: alice
    function: first_contact_request
    payload:
      handle: alice@example.org
      nonce: 05c0c0c0c0c0c0c0c0c0c0c0c0c0c0c0
    description: |
        Bob found Alice's entry and asks, signed by his own key. Plaintext: neither
        is a peer of the other yet.

expected_state:
  alice:
    directory_requests_held: 0
