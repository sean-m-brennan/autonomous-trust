schema_version: "1"
kind: scenario
protocol: reputation
name: commit-cert-unnamed-judged-by-roster-in-force
byte_pinning: false
description: |
    The negative control of commit-cert-named-previous-roster-pooled: the same
    certificate, carol's and dave's signatures, with no roster named. bob
    judges it by his roster in force, six members needing three signatures
    besides the scorer's, and refuses it.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: member
  - id: dave
    role: member
  - id: erin
    role: member
  - id: frank
    role: member

fixtures:
  roster: {}
  local_chain:
    bob:
      - {roster: genesis, members: [alice, bob, carol, dave]}
      - {roster: add, member: erin}
      - {roster: add, member: frank}

steps:
  - id: 1
    from: alice
    to: bob
    function: tx committed
    payload:
      task_id: t-1
      score: 0.8
      cosigners: [carol, dave]

expected_state:
  bob:
    pool_tasks: []
