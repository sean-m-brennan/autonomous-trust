schema_version: "1"
kind: scenario
protocol: reputation
name: catchup-paged-single-page-applies
byte_pinning: false
description: |
    A catch-up reply too large for one datagram goes as pages (ISSUES §2.67):
    {page, of, head, chain}, every page of one window naming the responder's
    head. A window that is one page long is complete as soon as it arrives, and
    dave handles it exactly as he would the same chain sent unpaged: the links
    verify and he catches up to all three entries.

    Assembly across several pages is pinned by unit tests in each runtime
    (test_update_pages.py, rep_update_pages_test.c); the C harness resets the
    reputation state before every step, so pages cannot accumulate across steps
    here.

participants:
  - id: alice
    role: provider
  - id: dave
    role: consumer

fixtures:
  num_updates:
    dave: 1

steps:
  - id: 1
    from: alice
    to: dave
    function: latest update
    payload:
      page: 0
      of: 1
      head: "aa"
      chain:
        - {task: a, p1: 0.7, p2: 0.5}
        - {task: b, p1: 0.9, p2: 0.3}
        - {task: c, p1: 0.6, p2: 0.4}

expected_state:
  dave:
    committed_tx_count: 3
    window_root: "044ff20acbca5c0d93e083ddc7f5cefbe404271250de10d0a15dd8e50d847556"
