schema_version: '1'
kind: scenario
protocol: selection
name: chain
byte_pinning: false
description: |
  The committed seed chain (RD_12.7 plan section 0.1). The requestor
  publishes head = H^N(root), N = 65536, and draw n is seeded by link(n) =
  H^(N-n)(root), so link(65536) is the root itself. H is SHA-256. A link checks
  against the head as H^n(link) == head, or forward from a link already checked
  (known_index), which costs only the gap. Indices outside [1, N] never check.
  The links straddle a checkpoint (255, 256, 257) because the requestor
  produces each one from the nearest checkpoint below it.
participants:
- {id: requestor, role: requestor}
- {id: peer, role: peer}
