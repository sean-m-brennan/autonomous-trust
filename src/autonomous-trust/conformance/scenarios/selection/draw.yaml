schema_version: '1'
kind: scenario
protocol: selection
name: draw
byte_pinning: false
description: |
  The draw (RD_12.7 plan section 3.2): weights in, a subset and its exact
  inclusion probabilities out, one SplitMix64 stream per decision.

  The propensities rows pin p_i = floor + (1 - n*floor) * w_i / W, summed left
  to right: zero weights read as all equal, and a floor no distribution can
  meet (3 * 0.5 > 1) degrades to uniform and says so.

  The draw rows pin both kinds. k = 1 is one categorical draw (its propensity is
  p_i). k > 1 is a Bernoulli draw per peer at pi_i = clamp(k * p_i, floor, 1),
  and the logged inclusion is pi_i + E * p_i, where E is the probability the
  round comes up empty and falls back to one categorical draw. Seed 1 is a
  round that came up empty, so its one selection is the fallback's. k null, and
  k at least the eligible count, select everyone at probability 1. The seed
  2^63 - 1, the largest a JSON integer carries in both, checks the
  high bits reach the seed.
participants:
- {id: requestor, role: requestor}
- {id: peer, role: peer}
