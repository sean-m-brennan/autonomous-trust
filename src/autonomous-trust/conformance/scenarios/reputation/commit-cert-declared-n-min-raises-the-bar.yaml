schema_version: "1"
kind: scenario
protocol: reputation
name: commit-cert-declared-n-min-raises-the-bar
byte_pinning: false
description: |
    A declared N_min raises the commit-certificate bar (RD_13.2 plan §0.4).
    bob's roster in force lists five members and declares N_min 4 (F = 1), so a
    half needs (5 + 1) // 2 = 3 signatures besides its scorer's, where an
    undeclaring roster of five needs two. alice's half carries carol's and dave's,
    so bob does not pool it.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: proposer
  - id: dave
    role: member
  - id: erin
    role: member

fixtures:
  roster: {}
  local_chain:
    bob:
      - {roster: genesis, members: [alice, bob, carol, dave, erin]}
      - {roster: restate, n_min: 4}
  tx_history:
    bob:
      - task_id: t-1
        p1: carol
        p1_score: 0.9

steps:
  - id: 1
    from: alice
    to: bob
    function: tx committed
    payload:
      task_id: t-1
      score: 0.8
      cosigners: [carol, dave]

expected_state:
  bob:
    halves_held: 1
    certified_halves: 0
