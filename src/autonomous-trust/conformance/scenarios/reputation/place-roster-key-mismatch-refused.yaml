schema_version: "1"
kind: scenario
protocol: reputation
name: place-roster-key-mismatch-refused
byte_pinning: false
description: |
    Membership recorded in the chain (doc/architecture/reputation.md, "Who is
    in the group"). The add names dave, a peer of bob's, but with a signing key
    that is not dave's: bob does not accept it, or the roster would vouch for
    signatures dave never made.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: member
  - id: dave
    role: member

fixtures:
  roster:
    bob: [alice, bob, carol]

steps:
  - id: 1
    from: alice
    to: bob
    function: place
    payload:
      k: 0
      ballot: {n: 5, by: alice}
      head: ""
      value:
        - {roster: add, member: dave, key: "7777777777777777777777777777777777777777777777777777777777777777"}
  - id: 2
    from: bob
    to: alice
    function: place accepted
    in_response_to: 1
    expect_none: true
    payload: {}
