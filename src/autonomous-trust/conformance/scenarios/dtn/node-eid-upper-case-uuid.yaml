schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "node-eid-upper-case-uuid"
description: |
  An upper-case uuid gives the same, lower-case, EID.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "node_eid"
    uuid: "AABBCCDD-1122-4000-8000-000000000001"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "node_eid"
    description: "trigger: node_eid"
expected_state:
  host:
    eid: "dtn://at-aabbccdd/"
