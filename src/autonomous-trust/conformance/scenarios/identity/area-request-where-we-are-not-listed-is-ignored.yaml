schema_version: '1'
kind: scenario
protocol: identity
name: area-request-where-we-are-not-listed-is-ignored
byte_pinning: false
description: 'Being findable is opt-in: a node listed nowhere takes no requests via an area, whatever the request claims.'
participants:
- id: alice
  role: border_guard
- id: bob
  role: new_node
fixtures:
  first_contact:
    enabled: true
  groups:
    alice:
      uuid: fc000000-0000-4000-8000-0000000e0200
      size: 1
    bob:
      uuid: fc000000-0000-4000-8000-0000000e0201
      size: 1
steps:
- id: 1
  from: bob
  to: alice
  function: first_contact_request
  payload:
    area: u4pr
    nonce: 0e02c0c0c0c0c0c0c0c0c0c0c0c0c0c0
  description: 'Bob found Alice''s card at a hub and asks, signed by his own key, naming the area. Plaintext: neither is a peer of the other yet.'
expected_state:
  alice:
    directory_requests_held: 0
