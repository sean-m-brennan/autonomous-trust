# at-address.service, not this, holds AT back until the node has its address:
# with no router there is no DHCP, and with the ad-hoc cell not yet formed no
# link is online, so an unbounded wait here would stall a node that has a
# static address. --any so an unplugged port does not count against it;
# --ipv4 so an IPv6 link-local address does not count as online.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --ipv4 --timeout=30
