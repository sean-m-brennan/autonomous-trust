schema_version: "1"
kind: scenario
protocol: identity
name: identity-response-signed-by-another-refused
byte_pinning: false
description: |
    A member cannot vouch for an identity that is not its own (RD_2.6 plan
    §2.5). member's published identity arrives under other's valid signature:
    the frame verifies, but not as the identity it carries, so coord backfills
    nothing.

participants:
  - id: coord
    role: group_member
  - id: member
    role: group_member
  - id: other
    role: group_member

fixtures:
  shared_group:
    uuid: "0c000000-0000-4000-8000-000000000003"

steps:
  - id: 1
    from: member
    to: coord
    function: peer_identity_response
    payload:
      signed_by: other

expected_state:
  coord:
    peer_count: 0
