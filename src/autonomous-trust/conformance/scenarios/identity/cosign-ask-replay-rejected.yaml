schema_version: "1"
kind: scenario
protocol: identity
name: cosign-ask-replay-rejected
byte_pinning: false
description: |
    Freshness on the co-signing ask (Phase 3 P3.3). The ask carries a freshness
    `seq`; a captured ask replayed with a stale (non-increasing) seq must be
    REFUSED. There is no signature on the message (crypto_box authenticates the
    asker), so the refusal here is attributable to the freshness gate alone.

    Why it matters more here than for a DM: an ask is a demand on somebody's
    attention and on their key. An exchange that can be re-injected can be used to
    re-ask forever — and the wording of what is being signed is derived locally
    from the bytes, so a person re-presented with an old ask sees a perfectly
    truthful description of a record that was already settled.

    Step 1: bg -> newcomer peer_cosign_request {op: admit, seq: 2}.
      - Both runtimes: accepted (first stamp), recorded as the last ask from bg.
    Step 2: bg -> newcomer peer_cosign_request {op: expel, seq: 1}.
      - Both runtimes: seq 1 is not above the mark (2), so the freshness gate
        refuses it; the recorded ask stays the ADMISSION and the per-verb refusal
        tally ticks once.

    Assertions: newcomer.cosign_request_last[bg] is still the admit at seq 2 (the
    replay did not overwrite it with the expulsion), and
    freshness_refusals[peer_cosign_request]=1.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_cosign_request
    payload:
      record: membership
      op: admit
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      cid: "b3:7d3f1c9a2b4e6f80112233445566778899aabbccddeeff00123456789abcdef0"
      bytes: "a3011a0066"
      seq: 2
      ts: 0
    description: bg's genuine ask; newcomer records it.
  - id: 2
    from: bg
    to: newcomer
    function: peer_cosign_request
    payload:
      record: membership
      op: expel
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      cid: "b3:00ff1c9a2b4e6f80112233445566778899aabbccddeeff00123456789abcdef0"
      bytes: "b4022a0077"
      seq: 1
      ts: 0
    description: |
        A replayed/stale ask (seq below the mark), and a different act. Refused by
        freshness; the recorded ask must not change to the expulsion.

expected_state:
  newcomer:
    cosign_request_last:
      bg:
        record: membership
        op: admit
        seq: 2
    freshness_refusals:
      peer_cosign_request: 1
