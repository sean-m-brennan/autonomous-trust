schema_version: "1"
kind: scenario
protocol: reputation
name: place-halves-out-of-order-refused
byte_pinning: false
description: |
    Ordered placement (doc/architecture/reputation.md, "Agreeing on an
    order"): classic Paxos decides what the chain holds from each index.
    An entry's halves are ordered by scorer uuid, so every node builds the same
    bytes. alice's entry has them the other way round, so bob does not accept the
    value.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: member
  - id: dave
    role: member

fixtures: {}

steps:
  - id: 1
    from: alice
    to: bob
    function: place
    payload:
      k: 0
      ballot: {n: 5, by: alice}
      head: ""
      value:
          - {task_id: t-1, p1: carol, p1_score: 0.9, p2: dave, p2_score: 0.7, swap: true}
  - id: 2
    from: bob
    to: alice
    function: place accepted
    in_response_to: 1
    expect_none: true
    payload: {}
