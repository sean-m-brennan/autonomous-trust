schema_version: "1"
kind: scenario
protocol: identity
name: proximity-band-near
byte_pinning: false
description: |
    Private proximity, the happy path (Phase 2). Two CONNECTED peers that have
    each opted in to an EXACT position learn a coarse distance BAND — near / mid
    / far — WITHOUT either coordinate crossing the wire. Here both sit at the
    same point, so the finest-resolution grid tags intersect and both record
    NEAR (1). What travels is only the keyed BLAKE2b tag set under a per-probe
    salt; the exact position never leaves the node, and a third party sees
    opaque tags. The corpus pins the band the intersection yields, not any
    coordinate.

    fixtures.connections pre-seeds the bilateral CONNECTED edge (proximity is
    connected-peers-only), and fixtures.exact_positions opts both in — a
    geographic datum is used ONLY because each node chose to store one locally.

    Step 1: newcomer -> bg trigger_proximity_probe (pseudo-step).
      - The local trigger emits ONE encrypted peer_proximity_probe {salt, tags}
        to bg (newcomer.proximity_probes_emitted=1, which is what makes the
        opt-in guard non-vacuous against proximity-absent-is-normal).
      - bg's handle_proximity_probe computes its tags under the same salt,
        intersects, records NEAR, and replies with its own tags
        (bg.proximity_replies_emitted=1).
      - newcomer's handle_proximity_reply recomputes under the echoed salt and
        records the same NEAR.
        (Python: self.peer_proximity; C: the band emitted by
        identity_emit_peer_proximity — read symmetrically via
        get_peer_proximity / the recorded band, keyed by the peer uuid.)

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

fixtures:
  connections:
    newcomer: [bg]
    bg: [newcomer]
  exact_positions:
    newcomer: [37.7749, -122.4194]
    bg: [37.7749, -122.4194]

steps:
  - id: 1
    from: newcomer
    to: bg
    function: trigger_proximity_probe
    payload: {}
    description: |
        newcomer runs a private-proximity probe against bg. The whole probe/
        reply round trip runs through the real handlers; both sides, at the same
        point, record NEAR.

expected_state:
  newcomer:
    proximity_probes_emitted: 1
    peer_proximity:
      bg: 1          # NEAR
  bg:
    proximity_replies_emitted: 1
    peer_proximity:
      newcomer: 1    # NEAR
