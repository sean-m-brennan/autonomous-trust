schema_version: "1"
kind: "scenario"
protocol: "dtn"
name: "route-dtn-eid-leg"
description: |
  A dtn: EID takes the EID leg.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  dtn:
    op: "route"
    inners:
      - kind: "udp_net_4"
        match_cidr: "10.0.0.0/24"
      - kind: "dtn_bp"
        match_eid: true
        is_default: true
    target: "dtn://at-abcd/peer"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "route"
    description: "trigger: route"
expected_state:
  host:
    leg: 1
