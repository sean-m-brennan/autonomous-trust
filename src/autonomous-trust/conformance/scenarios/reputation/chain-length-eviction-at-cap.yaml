schema_version: '1'
kind: scenario
protocol: reputation
name: chain-length-eviction-at-cap
byte_pinning: false
description: |
  Pins the reputation transaction-history cap DEFAULT_MAX_CHAIN_LEN /
  MAX_CHAIN_LEN = 200 cross-language. alice reports a hash-linked chain of
  205 committed entries to dave via `latest update`; dave's catchup()
  replays each through TransactionHistory.update(), which evicts the oldest
  entry once the resident chain reaches 200 (FIFO). The window therefore
  converges to the most-recent 200 entries (sent indices 5..204).

  committed_tx_count==200 pins the cap; window_root (RFC 6962 ordered Merkle
  root over the resident window) pins that BOTH sides retain the SAME 200
  entries and compute byte-identical entry_hashes after eviction. If either
  side's MAX_CHAIN_LEN drifts, or eviction keeps a different set, the count
  or the root diverges and the cross-language diff goes asymmetric --
  previously the two constants were aligned only by a code comment.

  num_updates quorum lowered to 1 (fixture) so a single report fires the
  chain merge; the C harness resets state per step, so the whole chain must
  arrive in one message (same constraint as chain-catchup-verifies-links).
participants:
- id: alice
  role: provider
- id: dave
  role: consumer
fixtures:
  num_updates:
    dave: 1
steps:
- id: 1
  from: alice
  to: dave
  function: latest update
