participants:
- id: host
  role: recipient
fixtures:
  contacts:
    op: backup
    mode: open
    blob:
      typename: at-backup
      v: 1
      kdf: argon2id13
      ops: 1
      mem: 8192
      salt: 000102030405060708090a0b0c0d0e0f
      aead: xchacha20poly1305-ietf
      nonce: zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz
