schema_version: '1'
kind: scenario
protocol: contacts
name: backup-restore-future-times-taken-as-now
description: A record dated far past our clock is taken as now, as a sibling sync does.
byte_pinning: false
participants:
- id: host
  role: recipient
fixtures:
  contacts:
    op: backup
    mode: restore
    now: 1800000000.0
    store:
      typename: contacts
      version: 1
      contacts: {}
    contents:
      typename: at-backup-contents
      v: 1
      created_at: 1700000000.0
      contacts:
        v: 1
        typename: at-contacts-sync
        contacts:
          eeeeeeee-0000-4000-8000-000000000001:
            identity:
              typename: identity
              uuid: eeeeeeee-0000-4000-8000-000000000001
              address: ''
              nickname: bob
              signature:
                hex_seed: d04ab232742bb4ab3a1368bd4615e4e6d0224ab71a016baf8520a332c9778737
              encryptor:
                hex_seed: '7777777777777777777777777777777777777777777777777777777777777777'
            petname: bob-pet
            verified: false
            provenance: in_person
            trust_seed: 0.0
            rendezvous: []
            nonce: ''
            added_at: 1800010000.0
            verified_at: 0.0
        tombstones: {}
steps:
- id: 1
  from: host
  to: host
  function: backup
  description: 'trigger: backup restore'
expected_state:
  host:
    backup_status: ok
    changes:
    - - eeeeeeee-0000-4000-8000-000000000001
      - added
    contacts:
      eeeeeeee-0000-4000-8000-000000000001:
        provenance: backup
