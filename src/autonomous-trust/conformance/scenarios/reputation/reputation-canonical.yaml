schema_version: "1"
kind: scenario
protocol: reputation
name: reputation-canonical
byte_pinning: false
description: |
    Documentation canonical for the Reputation protocol — picked up
    by `scripts/build-docs.sh` via the `<protocol>-canonical.yaml`
    convention and rendered into `doc/architecture/_generated/`.
    Mirrors `request-granted` step-for-step; the duplication is
    intentional so the docs example has a stable filename
    (`reputation-canonical`) that won't move when `request-granted`
    is updated, while still running through the same conformance
    code path so the diagram cannot drift from executable behavior.

    Flow: Paxos round-1 happy path. alice (proposer) sends an
    `ask permission` ballot to bob (acceptor). bob's history is
    empty, bob's last_id is None, so the strict-inequality guard
    passes and bob emits a `permission granted` ack back to alice.

    Phase 1 only — v1 schema + the C harness's per-step state reset
    make composing Phase 1 + Phase 2 in one scenario require
    step-specific fixtures (not supported by the adapter). The
    Phase 2 trace is pinned by `transaction-accepted.yaml`; nack
    / backdate / sync variants by `request-nacked-stale`,
    `request-backdated-chain-mismatch`, `chain-outdated-notification`.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor

steps:
  - id: 1
    from: alice
    to: bob
    function: ask permission
    payload:
      id1: 1000
      id2: 1
      proposer: alice
    description: |
        Phase 1 — alice broadcasts an ask-permission ballot on the
        encrypted group channel. (id1, id2, proposer) uniquely tags
        the round; id1 is a millisecond timestamp, id2 is the
        proposer's chain index.
  - id: 2
    from: bob
    to: alice
    function: permission granted
    in_response_to: 1
    payload:
      id1: 1000
      id2: 1
      proposer: alice
    description: |
        Phase 1 — bob's last_id is None and chain is empty, so the
        strict-inequality guard passes; handle_request emits a grant
        ack back to alice. (Out-of-band nack / backdate / sync
        branches are documented in separate scenarios.)

expected_state:
  bob:
    requests_count: 1
    last_id_set: true
