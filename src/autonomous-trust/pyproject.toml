[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "autonomous_trust"
version = "0.2.1"
description = "AutonomousTrust - a high-trust cooperative computing framework"
authors = ["Sean M Brennan <sean.brennan@tekfive.com>"]
#readme = "README.md"  # FIXME docker looking for /app/README.md
packages = [{include = "autonomous_trust"}]
#license = "Proprietary"
include = ["**/adjectives.txt", "**/names.txt", "autonomous_trust/core/protobuf/**/*.py"]
exclude = ["**/etc", "**/var", "**/notes", "**/__pycache__"]

[project]
name = "autonomous_trust"
version = "0.2.1"

[tool.poetry.dependencies]
python = "^3.13"
icontract = "^2.6.2"
psutil = "^5.9.5"
PyNaCl = "^1.5.0"
python-dateutil = "^2.8.2"
cryptography = "^43.0.0"  # X.509 ZTA verifier (identity/zta); parity with C OpenSSL backend
