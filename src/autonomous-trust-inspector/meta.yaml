## conda-build *must* be called in the current directory (src/autonomous-trust-inspector)

{% set toml = load_file_data('./pyproject.toml') %}  # fails early if wrong path
{% set project = toml.get('project', {}) %}
{% set name = project.get('name') %}
{% set version = project.get('version') %}

{# ------------------------------------------------------------------------
   The conda `run:` deps below are DERIVED from pyproject's
   tool.poetry.dependencies table (NB: a line ending in a bracket is
   parsed as a conda-build selector, so that name is left unbracketed),
   so pyproject.toml is the single source of truth (no more meta.yaml drift,
   e.g. the dash==2.6.2 / missing-services / hyphen-vs-underscore bugs). Two
   small hand-maintained tables bridge PyPI -> conda-forge:
   ------------------------------------------------------------------------ #}
{% set poetry_deps = toml.get('tool', {}).get('poetry', {}).get('dependencies', {}) %}
{# (1) deps whose conda-forge name differs from the PyPI/pyproject name.
   AT subpackages are underscored on conda; a few deps are renamed upstream. #}
{% set CONDA_NAME = {
     'autonomous-trust': 'autonomous_trust',
     'autonomous-trust-services': 'autonomous_trust_services',
     'autonomous-trust-inspector': 'autonomous_trust_inspector',
     'opencv-python': 'py-opencv',
     'kaleido': 'python-kaleido',
     'PyNaCl': 'pynacl',
   } %}
{# (2) deps NOT on conda-forge -> installed from the environment.yml pip
   section, so they must be omitted from conda run: requirements. #}
{% set PIP_ONLY = ['mediapipe', 'dash-iconify'] %}
{# NB: the poetry version spec is emitted verbatim, so deps MUST use
   conda-compatible operators (>=, <, ==, comma ranges). Poetry caret/tilde
   (^, ~) and bare versions are NOT translated — use explicit operators here.
   (The core `autonomous-trust` recipe keeps a hand-written run: precisely
   because its deps use carets.) #}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ./

build:
  noarch: python
  script: poetry build -f wheel && $PYTHON -m pip install ./dist/{{ name }}-{{ version }}-py3-none-any.whl --no-deps --ignore-installed -vv


requirements:
  build:
    - python==3.13
    - pip
    - poetry
  host:
    - python==3.13
    - pip
    - poetry
  run:
    - python>=3.13
    {%- for dep_name, dep_spec in poetry_deps.items() %}
    {%- if dep_name != 'python' and dep_name not in PIP_ONLY %}
    - {{ CONDA_NAME.get(dep_name, dep_name) }}{{ dep_spec }}
    {%- endif %}
    {%- endfor %}
