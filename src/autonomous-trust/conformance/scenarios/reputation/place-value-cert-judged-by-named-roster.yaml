schema_version: "1"
kind: scenario
protocol: reputation
name: place-value-cert-judged-by-named-roster
byte_pinning: false
description: |
    A placement value carries the roster each half's certificate names
    (doc/architecture/reputation.md, "Commit certificates"), and an acceptor
    judges the certificate by it. bob's roster grew from alice, bob, carol and
    dave to six members. carol's and dave's halves of t-1 were each certified
    by alice and bob under the first roster, a majority of it besides the
    scorer, and the value names that roster, so bob accepts the value though
    his roster in force would need three signatures a half.

participants:
  - id: alice
    role: proposer
  - id: bob
    role: acceptor
  - id: carol
    role: member
  - id: dave
    role: member
  - id: erin
    role: member
  - id: frank
    role: member

fixtures:
  roster: {}
  local_chain:
    bob:
      - {roster: genesis, members: [alice, bob, carol, dave]}
      - {roster: add, member: erin}
      - {roster: add, member: frank}

steps:
  - id: 1
    from: alice
    to: bob
    function: place
    payload:
      k: 3
      ballot: {n: 5, by: alice}
      head: recipient
      value:
          - {task_id: t-1, p1: carol, p1_score: 0.9, p2: dave, p2_score: 0.7, cosigners: [alice, bob], cert_roster: [alice, bob, carol, dave]}
  - id: 2
    from: bob
    to: alice
    function: place accepted
    in_response_to: 1
    no_propagate: true
    payload: {}

expected_state:
  bob:
    place_promised: {n: 5, by: alice}
