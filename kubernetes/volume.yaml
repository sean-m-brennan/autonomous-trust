---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: source-pv
  namespace: $NAMESPACE
  labels:
    name: source-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: "${SRC_DIR}"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: config-pv
  namespace: $NAMESPACE
  labels:
    name: config-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: "${CFG_DIR}"
