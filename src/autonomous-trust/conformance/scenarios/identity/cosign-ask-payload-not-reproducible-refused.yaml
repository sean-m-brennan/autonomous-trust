schema_version: "1"
kind: scenario
protocol: identity
name: cosign-ask-payload-not-reproducible-refused
byte_pinning: false
description: |
    The second control for cosign-ask-delivered (Phase 3 P3.3), and the one that
    matters most. The exported bytes exist to be reproduced EXACTLY: the
    signatures are over them, so a payload that arrives truncated, odd-length or
    not-hex verifies against NOTHING. That is strictly worse than a refused ask,
    because it spends somebody's attention and yields a signature over a record
    nobody can rebuild.

    So an odd-length payload is refused outright rather than carried. The same
    rule refuses a payload over the wire bound: truncating bytes whose whole
    purpose is byte-exact reproduction would produce a signature over nothing, so
    the authoring side refuses an oversized exchange and the receiving side
    refuses a short one.

    Step 1: bg -> newcomer peer_cosign_request with an odd-length `bytes` (the
    delivered scenario's payload with its last character lost in flight).
      - Both runtimes: the shape gate refuses; nothing is recorded.

    Assertion: newcomer.cosign_request_last[bg] is ABSENT. Paired with
    cosign-ask-delivered, which carries the whole payload and records it.

participants:
  - id: bg
    role: border_guard
  - id: newcomer
    role: new_node

steps:
  - id: 1
    from: bg
    to: newcomer
    function: peer_cosign_request
    payload:
      record: membership
      op: admit
      polity: "did:key:z6MkvZr75pe3PnPy11ixErx25xJ83E6MkqQQc4JpRogj3ytJ"
      cid: "b3:7d3f1c9a2b4e6f80112233445566778899aabbccddeeff00123456789abcdef0"
      bytes: "a3011a006"
      seq: 1
      ts: 0
    description: |
        The same admission, one hex character short — a payload no exporter
        produced, which reproduces to nothing.

expected_state:
  newcomer:
    cosign_request_last:
      bg:
        absent: true
